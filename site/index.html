<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleming 募集をさがす</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1A1A1A}a:hover{color:#3A63F4}
.m-only{display:none}
@keyframes fadein{from{opacity:.4}to{opacity:1}}
.cover .sl{opacity:0;transition:opacity .2s}.cover:hover .sl,.cover .sl:focus-visible{opacity:1}
.tabbar{display:none}
.arealist::-webkit-scrollbar{width:6px}.arealist::-webkit-scrollbar-thumb{background:#D9D4C7;border-radius:3px}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .cover .sl{opacity:.85!important}
  .m-only{display:flex!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important;flex-direction:column!important;align-items:stretch!important}
  .side{position:static!important;width:auto!important;flex:0 0 auto!important;order:-1}
  .cardtop{grid-template-columns:1fr!important;padding:0!important;gap:0!important}
  .cardtop .cover{order:-1;border-radius:0!important}
  .cardtop .ctext{padding:14px 16px 0!important}
  .ov{padding:0!important}
  .dlg{max-width:none!important;height:100%;max-height:none!important;border-radius:0!important}
  .optgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .dlghead{grid-template-columns:88px 1fr 88px!important;padding:0 8px!important}
  .dlgtitle{font-size:15px!important;white-space:nowrap}
  .cardbody{padding:14px 16px 16px!important;gap:12px!important}
  .ctitle{font-size:17px!important}
  .stat{flex:1 1 0!important;padding:8px 10px!important;border-radius:10px!important}
  .statl{font-size:10px!important}
  .statv{font-size:17px!important}
  .cta{flex:1 1 auto!important;justify-content:center}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E3E0D8;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F6F5F1; color: #1A1A1A; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <!-- App bar -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E0D8">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 0 0 auto">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #3A63F4; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #FFD338"></span></span>
        <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.4px">Fleming</span>
      </a>
      <form class="pc-only" aria-label="募集を検索" style="flex: 1 1 320px; min-width: 0; max-width: 480px; display: flex; align-items: center; gap: 10px; background: #F6F5F1; border-radius: 8px; padding: 0 16px; height: 42px; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">キーワード</label>
        <input id="q" type="search" value="{{qv}}" onInput="{{setQ}}" placeholder="病院名、エリア、「残業少なめ」など" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #1A1A1A; outline: none">
      </form>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" aria-current="page" style="text-decoration: none; padding: 10px 14px; border-radius: 4px; background: #3B4654; color: #FFFFFF; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 4px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">スカウト<span style="background: #3A63F4; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #DAD6CC; color: #6B675E; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 900"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
      <button type="button" class="m-only" onClick="{{openCond}}" aria-label="検索条件" style="margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: none; background: #F6F5F1; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
    </div>
  </header>

  <!-- Body: 3 columns -->
  <div class="wrap" style="max-width: 1160px; width: 100%; margin: 0 auto; padding: 28px 32px 64px; box-sizing: border-box; display: flex; gap: 28px; align-items: flex-start">


    <!-- Left: results -->
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
          <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #333333">{{prefTitle}}<span style="font-size: 15px; font-weight: 700"> の病院の看護師求人</span></h1>
          <span style="font-size: 12px; font-weight: 400; color: #666666">2026/11/10更新</span>
        </div>
        <span style="font-size: 13px; font-weight: 400; color: #666666">全 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 24px; font-weight: 700; color: #333333">{{count}}</span> 件（{{fac}}施設）</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
        <span style="position: relative; display: inline-flex">
          <select aria-label="表示順" onChange="{{setSort}}" style="appearance: none; -webkit-appearance: none; border: 1px solid #DDDDDD; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 400; color: #333333; padding: 8px 32px 8px 10px; min-height: 38px; cursor: pointer">
            <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><option value="{{t.i}}" selected="{{t.on}}">{{t.label}}</option></sc-for>
          </select>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 11px; top: 50%; margin-top: -6px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
        <span style="font-size: 12px; font-weight: 400; color: #333333">1-4件 / {{fac}}施設</span>
      </div>

      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
        <article style="background: #FFFFFF; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
          <div class="cardtop" style="display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; padding: 20px 24px 0; align-items: start">
            <div class="ctext" style="min-width: 0; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: #666666; flex-wrap: wrap">
                <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 4px; background: #DAD6CC; border: 1px solid #C9C4B8"></span>
                <span>{{j.org}}</span><span>·</span><span>{{j.area}}</span>
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap">
                <span style="font-size: 12px; font-weight: 400; color: #333333; border: 1px solid #C9C4B8; padding: 2px 8px; border-radius: 4px">{{j.type}}</span>
                <span style="font-size: 12px; font-weight: 400; color: #333333; border: 1px solid #C9C4B8; padding: 2px 8px; border-radius: 4px">{{j.cat}}</span>
              </div>
              <a href="job.html" class="ctitle" style="text-decoration: none; font-size: 18px; font-weight: 500; line-height: 1.6; color: #333333">{{j.title}}</a>
              <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 4px">
                <span style="font-size: 12px; font-weight: 400; color: #666666">{{j.payLabel}}</span>
                <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 20px; color: #333333">{{j.pay}}</span>
                <span style="font-size: 12px; font-weight: 400; color: #666666">{{j.payNote}}</span>
              </div>
            </div>
            <div class="cover" style="position: relative; aspect-ratio: 16 / 9; background: #3B4654; border-radius: 6px; overflow: hidden">
              <a href="job.html" aria-label="{{j.title}}" style="display: block; width: 100%; height: 100%">
                <img src="{{j.img}}" alt="{{j.photo}}" style="width: 100%; height: 100%; object-fit: cover; display: block; animation: fadein .5s ease">
              </a>
              <button type="button" onClick="{{j.prev}}" aria-label="前の写真" class="sl" style="position: absolute; left: 8px; top: 50%; margin-top: -14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(26,26,26,0.28); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
              <button type="button" onClick="{{j.next}}" aria-label="次の写真" class="sl" style="position: absolute; right: 8px; top: 50%; margin-top: -14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(26,26,26,0.28); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
              <span style="position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 6px; pointer-events: none">
                <sc-for list="{{j.dots}}" as="d" hint-placeholder-count="3"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{d.bg}}"></span></sc-for>
              </span>
              <span style="position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 400; color: #333333; background: rgba(255,255,255,0.94); padding: 4px 10px 4px 8px; border-radius: 999px; pointer-events: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3A63F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>話を聞ける人 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700">{{j.talk}}</span>人</span>
              <span style="position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 400; color: #FFFFFF; background: rgba(26,26,26,0.55); padding: 2px 8px; border-radius: 999px">{{j.pos}}</span>
            </div>
          </div>
          <div class="cardbody" style="padding: 16px 24px 22px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{j.bars}}" as="b" hint-placeholder-count="3">
                <div class="stat" style="flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 2px; background: #F6F5F1; border-radius: 6px; padding: 10px 14px">
                  <span class="statl pc-only" style="font-size: 11px; font-weight: 700; color: #5C5C5C">{{b.label}}</span><span class="statl m-only" style="font-size: 11px; font-weight: 700; color: #5C5C5C">{{b.short}}</span>
                  <span class="statv" style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: {{b.color}}">{{b.value}}</span>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{j.facts}}" as="f" hint-placeholder-count="3">
                <span style="font-size: 12px; font-weight: 400; color: #333333; border: 1px solid #C9C4B8; padding: 2px 8px; border-radius: 4px">{{f}}</span>
              </sc-for>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid #EDEAE2">
              <a href="job.html" class="cta" style="text-decoration: none; font-size: 14px; font-weight: 400; padding: 10px 18px; border-radius: 4px; background: #FFFFFF; border: 1px solid #B9C0CC; color: #3B4654; min-height: 42px; box-sizing: border-box; display: flex; align-items: center; gap: 10px">話を聞きに行きたい<span style="font-size: 12px; color: #666666; padding-left: 10px; border-left: 1px solid #D5D9E0; white-space: nowrap">話せる人 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; color: #333333">{{j.talk}}</span>人</span></a>
              <button type="button" onClick="{{j.like}}" aria-pressed="{{j.liked}}" style="border: 1px solid {{j.likeBorder}}; background: {{j.likeBg}}; color: #3B4654; border-radius: 4px; font-family: inherit; font-size: 13px; font-weight: 400; padding: 10px 14px; min-height: 42px; display: flex; align-items: center; gap: 6px; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="{{j.likeFill}}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.9 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4.1 0 6.2 4.6 4.5 8-2.5 4.4-9.5 9-9.5 9z"></path></svg>
                気になる <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif">{{j.likes}}</span>
              </button>
              <span style="margin-left: auto; font-size: 12px; font-weight: 700; color: #5C5C5C">{{j.posted}}</span>
            </div>
          </div>
        </article>
      </sc-for>
      <a href="profile.html" style="display: flex; align-items: center; gap: 16px; background: #FFD338; border-radius: 8px; padding: 16px 20px; text-decoration: none; color: #1A1A1A"><span style="font-size: 12px; font-weight: 900; background: #FFFFFF; padding: 4px 10px; border-radius: 999px; flex: 0 0 auto">紹介で5万円</span><span style="flex: 1 1 auto; font-size: 14px; font-weight: 700; line-height: 1.6">同期や元同僚に、そのまま送れる紹介文があります</span><span style="font-size: 14px; font-weight: 700">›</span></a>
      <button type="button" style="align-self: center; border: 2px solid #D9D4C7; background: #FFFFFF; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 12px 28px; min-height: 48px; cursor: pointer">もっと見る</button>
    </main>

    <!-- Right: search conditions -->
    <aside class="side" aria-label="検索条件" style="flex: 0 0 300px; width: 300px; position: sticky; top: 88px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 700; color: #333333">検索条件</span>
        <sc-if value="{{anySel}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{clearAll}}" style="border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 400; color: #3A63F4; cursor: pointer; min-height: 32px; padding: 0">すべてクリア</button></sc-if>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #D9D4C7; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
          <div style="border-bottom: 1px solid #EDEAE2">
            <sc-if value="{{hasArea}}" hint-placeholder-val="{{false}}">
              <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; align-items: center; gap: 8px">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="#3A63F4" aria-hidden="true" style="flex: 0 0 auto"><path d="M12 2c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"></path></svg>
                  <span style="flex: 1 1 auto; font-size: 14px; font-weight: 700; color: #333333">{{prefTitle}}</span>
                  <button type="button" onClick="{{openArea}}" style="border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 400; color: #3A63F4; cursor: pointer; min-height: 32px; padding: 0">変更</button>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{areaChips}}" as="c" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; gap: 2px; background: #F3F4F8; border: 1px solid #E1E4EC; border-radius: 999px; padding: 0 4px 0 12px; min-height: 32px; font-size: 13px; font-weight: 400; color: #333333">{{c.label}}<button type="button" onClick="{{c.remove}}" aria-label="{{c.label}}を外す" style="width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A857A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-for>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{noArea}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{openArea}}" style="width: 100%; display: flex; align-items: center; gap: 12px; border: none; background: #FFFFFF; font-family: inherit; text-align: left; padding: 0 16px; min-height: 56px; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#3A63F4" aria-hidden="true" style="flex: 0 0 auto"><path d="M12 2c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"></path></svg>
                <span style="flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 400; color: #333333">{{prefTitle}}（すべて）</span>
                <span style="flex: 0 0 auto; font-size: 13px; font-weight: 400; color: #3A63F4">変更</span>
              </button>
            </sc-if>
          </div>
          <div style="border-bottom: 1px solid #EDEAE2">
            <sc-if value="{{hasCond}}" hint-placeholder-val="{{false}}">
              <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; align-items: center; gap: 8px">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A63F4" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
                  <span style="flex: 1 1 auto; font-size: 14px; font-weight: 700; color: #333333">こだわり条件</span>
                  <button type="button" onClick="{{openCond}}" style="border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 400; color: #3A63F4; cursor: pointer; min-height: 32px; padding: 0">変更</button>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{condChips}}" as="c" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; gap: 2px; background: #F3F4F8; border: 1px solid #E1E4EC; border-radius: 999px; padding: 0 4px 0 12px; min-height: 32px; font-size: 13px; font-weight: 400; color: #333333">{{c.label}}<button type="button" onClick="{{c.remove}}" aria-label="{{c.label}}を外す" style="width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A857A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span></sc-for>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{noCond}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{openCond}}" style="width: 100%; display: flex; align-items: center; gap: 12px; border: none; background: #FFFFFF; font-family: inherit; text-align: left; padding: 0 16px; min-height: 56px; cursor: pointer">

    };
    const LINES = {
      '東京都': ['JR山手線','JR中央線','JR総武線','東京メトロ東西線','東京メトロ半蔵門線','都営新宿線','都営大江戸線','京王線','小田急線','東急東横線'],
      '神奈川県': ['JR東海道線','JR横須賀線','京急本線','相鉄線','東急田園都市線','横浜市営地下鉄ブルーライン'],
      '埼玉県': ['JR京浜東北線','JR埼京線','東武東上線','東武伊勢崎線','西武池袋線'],
      '千葉県': ['JR総武線','JR常磐線','京成本線','東武野田線','新京成線'],
      '茨城県': ['JR常磐線','つくばエクスプレス'], '栃木県': ['JR宇都宮線','東武宇都宮線'], '群馬県': ['JR高崎線','JR両毛線']
    };
    const num = (s, i) => ((s.length * 37 + i * 53) % 160) + 4;
    const areas = st.areas, lines = st.lines, exp = st.exp;
    const setAreas = (patch) => this.setState({ areas: Object.assign({}, areas, patch) });
    const label = (pref, g, it) => (/市$/.test(g) && /区$/.test(it) ? g + it : it);
    const groups = AREAS[st.pref];
    const areaRows = [];
    if (st.areaTab === 0) {
      groups.forEach(([g, items], gi) => {
        const keys = items.map((it) => st.pref + '|' + g + '|' + it);
        const nSel = keys.filter((k) => areas[k]).length;
        const all = nSel === items.length;
        const gk = st.pref + '|' + g;
        const open = !!exp[gk];
        areaRows.push({ isGroup: true, label: g, n: items.reduce((a, it, i) => a + num(it, i), 0), on: all, partial: !all && nSel ? nSel + '件選択中' : '', weight: 700, indent: '20px', bg: '#FFFFFF', open, caret: open ? 'rotate(180deg)' : 'none',
          toggle: () => { const p = {}; keys.forEach((k) => { p[k] = !all; }); setAreas(p); },
          expand: () => this.setState({ exp: Object.assign({}, exp, { [gk]: !open }) }) });
        if (open) items.forEach((it, i) => { const k = keys[i]; const on = !!areas[k];
          areaRows.push({ isGroup: false, label: it, n: num(it, i), on, partial: '', weight: 400, indent: '52px', bg: '#FAFAF7', open: false, caret: 'none', toggle: () => setAreas({ [k]: !on }), expand: () => {} }); });
      });
    } else {
      LINES[st.pref].forEach((ln, i) => { const k = st.pref + '|' + ln; const on = !!lines[k];
        areaRows.push({ isGroup: false, label: ln, n: num(ln, i), on, partial: '', weight: 400, indent: '20px', bg: '#FFFFFF', open: false, caret: 'none', toggle: () => this.setState({ lines: Object.assign({}, lines, { [k]: !on }) }), expand: () => {} }); });
    }
    const PREF_N = { '東京都': 1180, '神奈川県': 642, '埼玉県': 588, '千葉県': 517, '茨城県': 233, '栃木県': 141, '群馬県': 166 };
    const prefList = Object.keys(AREAS).map((p) => ({ label: p, n: PREF_N[p], border: p === st.pref ? '#3A63F4' : '#D9D4C7', pick: () => this.setState({ pref: p, modal: 'area' }) }));
    const selAreas = Object.keys(areas).filter((k) => areas[k]).map((k) => { const [p, g, it] = k.split('|'); return label(p, g, it); });
    const selLines = Object.keys(lines).filter((k) => lines[k]).map((k) => k.split('|')[1]);
    const areaSel = selAreas.concat(selLines);
    const areaSummary = areaSel.length ? areaSel.join('、') : st.pref + '（すべて）';

    // ---- Conditions ----
    const c = st.c;
    const setC = (patch) => this.setState({ c: Object.assign({}, c, patch) });
    const multi = (key, title, names) => ({ title, type: 'checkbox', name: key, options: names.map((label, i) => { const on = !!(c[key] || {})[i]; return { label, on, toggle: () => setC({ [key]: Object.assign({}, c[key], { [i]: !on }) }) }; }) });
    const single = (key, title, names) => ({ title, type: 'radio', name: key, options: names.map((label, i) => { const on = c[key] === i; return { label, on, toggle: () => setC({ [key]: on ? null : i }) }; }) });
    const condSections = [
      { title: '雇用形態', badge: '', note: '', groups: [multi('emp', '', ['常勤', 'パート（非常勤）'])] },
      { title: '勤務形態', badge: '', note: '', groups: [multi('shift', '', ['2交代', '3交代', '日勤のみ', '夜勤のみ'])] },
      { title: '給与', badge: '', note: '※手取りではなく額面', groups: [single('pay', '月給', ['25万円以上', '28万円以上', '30万円以上', '33万円以上', '35万円以上'])] },
      { title: '職場の数字', badge: 'Flemingだけ', note: '病院が同じ定義で開示した数字で絞り込めます', groups: [
        single('pts', '1人あたりの担当患者数（日勤）', ['5人以下', '7人以下', '10人以下']),
        single('ot', '平均残業時間（月）', ['5時間以内', '10時間以内', '20時間以内']),
        single('tr', '離職率（年）', ['都県平均以下', '10%以下', '7%以下']),
        single('night', '夜勤回数（月）', ['4回以内', '6回以内']) ] },
      { title: '病院の種類', badge: '', note: '', groups: [
        multi('htype', '', ['一般病院（急性期）', '大学病院', '回復期リハビリ病院', '療養型病院', '精神科病院']),
        multi('beds', '病床数', ['199床以下', '200〜399床', '400床以上']) ] },
      { title: '担当業務', badge: '', note: '', groups: [multi('duty', '', ['病棟', '外来', 'オペ室', '救急外来', 'ICU系', '透析', '内視鏡'])] },
      { title: '診療科', badge: '', note: '', groups: [multi('dept', '', ['内科', '外科', '整形外科', '脳神経外科', '循環器', '消化器', '呼吸器', '小児科', '産婦人科', '精神科', 'リハビリテーション科', '緩和ケア'])] },
      { title: '職場の特徴', badge: '', note: '', groups: [multi('feat', '', ['中途にも教育担当', '師長インタビューあり', '託児所あり', '寮あり', '電子カルテあり', '駅徒歩5分以内', '車通勤可', '4週8休以上', '年間休日120日以上', 'ブランク可'])] }
    ];
    const areaChips = Object.keys(areas).filter((k) => areas[k]).map((k) => { const [p, g, it] = k.split('|'); return { label: label(p, g, it), remove: () => setAreas({ [k]: false }) }; })
      .concat(Object.keys(lines).filter((k) => lines[k]).map((k) => ({ label: k.split('|')[1], remove: () => this.setState({ lines: Object.assign({}, lines, { [k]: false }) }) })));
    const SHORT = { '月給': '月給', '1人あたりの担当患者数（日勤）': '担当患者数', '平均残業時間（月）': '残業', '離職率（年）': '離職率', '夜勤回数（月）': '夜勤' };
    const condChips = [];
    condSections.forEach((s) => s.groups.forEach((g) => g.options.forEach((o) => { if (o.on) condChips.push({ label: g.type === 'radio' ? ((SHORT[g.title] || g.title) + ' ' + o.label) : o.label, remove: o.toggle }); })));
    if (st.name) condChips.push({ label: '「' + st.name + '」', remove: () => this.setState({ name: '' }) });
    const condLabels = [];
    condSections.forEach((s) => s.groups.forEach((g) => g.options.forEach((o) => { if (o.on) condLabels.push(g.title && g.type === 'radio' ? (g.title.replace(/（.*）/, '') + ' ' + o.label) : o.label); })));
    if (st.name) condLabels.push('「' + st.name + '」');
    const condSummary = condLabels.length ? condLabels.join('・') : '働き方、担当患者数、残業など';
    const nSel = condLabels.length + areaSel.length;
    const count = Math.max(4, Math.round(1180 * Math.pow(0.72, nSel)));
    const fac = Math.max(3, Math.round(count * 0.68));
    const prefTitle = st.pref;

    const m = st.modal;
    const close = () => this.setState({ modal: null });
    return {
      areaChips, condChips, hasArea: areaChips.length > 0, hasCond: condChips.length > 0, noArea: !areaChips.length, noCond: !condChips.length, anySel: areaChips.length + condChips.length > 0,
      clearAll: () => this.setState({ areas: {}, lines: {}, name: '', c: { emp: {}, shift: {}, pay: null, pts: null, ot: null, tr: null, night: null, htype: {}, beds: {}, duty: {}, dept: {}, feat: {} } }),
      qv: st.q || '', setQ: (e) => this.setState({ q: e.target.value }),
      setSort: (e) => this.setState({ tab: Number(e.target.value) }),
      tabs, jobs, count, fac, prefTitle, areaSummary, condSummary, condColor: condLabels.length ? '#333333' : '#8A857A',
      openArea: () => this.setState({ modal: 'area' }), openCond: () => this.setState({ modal: 'cond' }), openPref: () => this.setState({ modal: 'pref' }),
      modalOpen: !!m, isArea: m === 'area', isPref: m === 'pref', isCond: m === 'cond',
      modalTitle: m === 'cond' ? 'こだわり条件を選択' : m === 'pref' ? '都道府県を選択' : '市区町村・路線選択',
      hasBack: m === 'area' || m === 'pref', backLabel: m === 'area' ? '都道府県へ' : '市区町村へ', goBack: () => this.setState({ modal: m === 'area' ? 'pref' : 'area' }),
      closeModal: close,
      switchLabel: m === 'cond' ? 'エリア条件の追加・変更' : 'こだわり条件の追加・変更', switchModal: () => this.setState({ modal: m === 'cond' ? 'area' : 'cond' }),
      prefList, areaRows,
      areaTabs: ['市区町村', '路線・駅'].map((label, i) => ({ label, on: st.areaTab === i, line: st.areaTab === i ? '#3B4654' : 'transparent', fg: st.areaTab === i ? '#333333' : '#8A857A', fw: st.areaTab === i ? 700 : 400, pick: () => this.setState({ areaTab: i }) })),
      condSections, clearCond: () => this.setState({ c: { emp: {}, shift: {}, pay: null, pts: null, ot: null, tr: null, night: null, htype: {}, beds: {}, duty: {}, dept: {}, feat: {} }, name: '' }),
      nameQ: st.name, setName: (e) => this.setState({ name: e.target.value })
    };
  }
}
mount(Component, 'tpl', 'app');
</script>
</body>
</html>
