<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleming 募集をさがす</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1A1A1A}a:hover{color:#3A63F4}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F6F5F1; color: #1A1A1A; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <!-- App bar -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E0D8">
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 0 0 auto">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #3A63F4; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #FFD338"></span></span>
        <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.4px">Fleming</span>
      </a>
      <form aria-label="募集を検索" style="flex: 1 1 320px; min-width: 0; max-width: 480px; display: flex; align-items: center; gap: 10px; background: #F6F5F1; border-radius: 999px; padding: 0 16px; height: 42px; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">キーワード</label>
        <input id="q" type="search" placeholder="病院名、エリア、「残業少なめ」など" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #1A1A1A; outline: none">
      </form>
      <nav aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" aria-current="page" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">スカウト<span style="background: #3A63F4; color: #FFFFFF; font-family: 'Outfit', sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">メッセージ</a>
        <a href="#" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">気になる</a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #DAD6CC; color: #6B675E; border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 900"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>

  <!-- Body: 3 columns -->
  <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 28px 32px 64px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

    <!-- Left: filters -->
    <aside aria-label="絞り込み" style="flex: 0 1 260px; min-width: 220px; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 15px; font-weight: 900">絞り込み</span>
          <button type="button" style="border: none; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; color: #3A63F4; cursor: pointer; min-height: 32px">リセット</button>
        </div>
        <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 12px; font-weight: 700; color: #5C5C5C; padding: 0 0 6px">働き方</legend>
          <sc-for list="{{workTypes}}" as="w" hint-placeholder-count="3">
            <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; min-height: 32px; cursor: pointer">
              <input type="checkbox" checked="{{w.on}}" onChange="{{w.toggle}}" style="width: 18px; height: 18px; accent-color: #3A63F4; margin: 0">
              <span>{{w.label}}</span>
              <span style="margin-left: auto; font-family: 'Outfit', sans-serif; font-size: 12px; color: #5C5C5C">{{w.n}}</span>
            </label>
          </sc-for>
        </fieldset>
        <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 12px; font-weight: 700; color: #5C5C5C; padding: 0 0 6px">エリア</legend>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">
            <select style="font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #D9D4C7; background: #FFFFFF; color: #1A1A1A; min-height: 44px">
              <option>東京都</option><option>神奈川県</option><option>千葉県</option><option>埼玉県</option>
            </select>
          </label>
        </fieldset>
        <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
          <legend style="font-size: 12px; font-weight: 700; color: #5C5C5C; padding: 0 0 6px">こだわり</legend>
          <sc-for list="{{prefs}}" as="p" hint-placeholder-count="5">
            <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; min-height: 32px; cursor: pointer">
              <input type="checkbox" style="width: 18px; height: 18px; accent-color: #3A63F4; margin: 0">
              <span>{{p}}</span>
            </label>
          </sc-for>
        </fieldset>
      </div>
      <div style="background: #FFD338; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 700">紹介で5万円</span>
        <span style="font-size: 15px; font-weight: 900; line-height: 1.6">同期や元同僚に、<br>そのまま送れる紹介文があります</span>
        <a href="profile.html" style="align-self: flex-start; text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; min-height: 40px; box-sizing: border-box; display: flex; align-items: center">紹介リンクを見る</a>
      </div>
    </aside>

    <!-- Center: feed -->
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <div style="display: flex; gap: 4px; background: #FFFFFF; border-radius: 999px; padding: 4px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <button type="button" onClick="{{t.pick}}" style="border: none; background: {{t.bg}}; color: {{t.fg}}; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 18px; min-height: 40px; cursor: pointer">{{t.label}}</button>
          </sc-for>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: #5C5C5C"><span style="font-family: 'Outfit', sans-serif; font-size: 16px; color: #1A1A1A">{{count}}</span> 件の募集</span>
      </div>

      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
        <article style="background: #FFFFFF; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column">
          <a href="job.html" aria-label="{{j.title}}" style="display: block; height: 300px; background: #DAD6CC; position: relative; text-decoration: none; overflow: hidden">
            <img src="{{j.img}}" alt="{{j.photo}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
            <span style="position: absolute; left: 16px; top: 16px; display: flex; gap: 6px">
              <span style="background: #FFFFFF; color: #1A1A1A; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px">{{j.type}}</span>
              <span style="background: #1A1A1A; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px">{{j.cat}}</span>
            </span>
          </a>
          <div style="padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; align-items: flex-start; gap: 16px">
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                <a href="job.html" style="text-decoration: none; font-size: 21px; font-weight: 900; line-height: 1.5">{{j.title}}</a>
                <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #5C5C5C">
                  <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: #DAD6CC; border: 1px solid #C9C4B8"></span>
                  <span>{{j.org}}</span><span>·</span><span>{{j.area}}</span>
                </div>
                <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 2px">
                  <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">{{j.payLabel}}</span>
                  <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.3px">{{j.pay}}</span>
                  <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">{{j.payNote}}</span>
                </div>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; background: #F6F5F1; border-radius: 16px; padding: 12px 14px">
              <sc-for list="{{j.bars}}" as="b" hint-placeholder-count="2">
                <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700">
                  <span style="width: 128px; flex: 0 0 auto; color: #5C5C5C">{{b.label}}</span>
                  <span style="flex: 1 1 auto; height: 10px; background: #E6E2D8; border-radius: 999px; position: relative; overflow: hidden">
                    <span style="position: absolute; left: 0; top: 0; height: 10px; border-radius: 999px; background: {{b.color}}; width: {{b.w}}"></span>
                    <span style="position: absolute; top: 0; height: 10px; width: 2px; background: #1A1A1A; left: {{b.avgPos}}"></span>
                  </span>
                  <span style="width: 64px; flex: 0 0 auto; text-align: right; font-family: 'Outfit', sans-serif; font-size: 15px; color: #1A1A1A">{{b.value}}</span>
                </div>
              </sc-for>
              <span style="font-size: 10px; color: #8A857A">黒い線はエリア平均（担当患者数 10人／残業 月18時間）</span>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{j.facts}}" as="f" hint-placeholder-count="3">
                <span style="font-size: 12px; font-weight: 700; background: #F6F5F1; padding: 6px 10px; border-radius: 999px">{{f}}</span>
              </sc-for>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid #EDEAE2">
              <a href="job.html" style="text-decoration: none; font-size: 14px; font-weight: 700; padding: 12px 20px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">話を聞きに行きたい</a>
              <button type="button" onClick="{{j.like}}" aria-pressed="{{j.liked}}" style="border: 1.5px solid {{j.likeBorder}}; background: {{j.likeBg}}; color: #1A1A1A; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 700; padding: 10px 14px; min-height: 44px; display: flex; align-items: center; gap: 6px; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="{{j.likeFill}}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.9 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4.1 0 6.2 4.6 4.5 8-2.5 4.4-9.5 9-9.5 9z"></path></svg>
                気になる <span style="font-family: 'Outfit', sans-serif">{{j.likes}}</span>
              </button>
              <span style="margin-left: auto; font-size: 12px; font-weight: 700; color: #5C5C5C">{{j.posted}}</span>
            </div>
          </div>
        </article>
      </sc-for>
      <button type="button" style="align-self: center; border: 2px solid #1A1A1A; background: #FFFFFF; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 12px 28px; min-height: 48px; cursor: pointer">もっと見る</button>
    </main>

    <!-- Right rail -->
    <aside aria-label="あなた向けの情報" style="flex: 0 1 300px; min-width: 240px; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 44px; height: 44px; border-radius: 50%; background: #DAD6CC; color: #6B675E; border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 15px; font-weight: 900">山田 花子</span>
            <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">看護師 4年目｜東京都</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700"><span>プロフィールの充実度</span><span style="font-family: 'Outfit', sans-serif">60%</span></div>
          <div style="height: 8px; background: #EDEAE2; border-radius: 999px; overflow: hidden"><div style="height: 8px; width: 60%; background: #3A63F4; border-radius: 999px"></div></div>
          <span style="font-size: 12px; line-height: 1.6; color: #5C5C5C">希望条件を書くと、病院からのスカウトが届きやすくなります</span>
        </div>
        <a href="profile.html" style="text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 2px solid #1A1A1A; min-height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">プロフィールを編集</a>
      </div>

      <div style="background: #1A1A1A; color: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 13px; font-weight: 900">新しいスカウト</span>
          <span style="font-family: 'Outfit', sans-serif; font-size: 12px; background: #3A63F4; padding: 2px 10px; border-radius: 999px">3</span>
        </div>
        <sc-for list="{{scouts}}" as="s" hint-placeholder-count="2">
          <a href="scouts.html" style="text-decoration: none; color: #FFFFFF; display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid #333333">
            <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #DAD6CC; flex: 0 0 auto"></span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 13px; font-weight: 900">{{s.org}}</span>
              <span style="font-size: 12px; line-height: 1.5; color: #CFCFCF">{{s.text}}</span>
            </span>
          </a>
        </sc-for>
        <a href="scouts.html" style="text-decoration: none; color: #FFD338; font-size: 13px; font-weight: 700">すべて見る →</a>
      </div>

      <div style="background: #FFFFFF; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 13px; font-weight: 900">新しく掲載された職場</span>
        <sc-for list="{{risers}}" as="r" hint-placeholder-count="3">
          <a href="job.html" style="text-decoration: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #EDEAE2">
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 13px; font-weight: 900">{{r.org}}</span>
              <span style="font-size: 12px; color: #5C5C5C">{{r.meta}}</span>
            </span>
            <span style="font-size: 12px; font-weight: 700; color: #3A63F4; flex: 0 0 auto">{{r.delta}}</span>
          </a>
        </sc-for>
      </div>
    </aside>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0, liked: {}, work: { 0: true, 1: false } }; }
  renderVals() {
    const tabs = ['おすすめ', '新着', '給与順'].map((label, i) => ({ label, pick: () => this.setState({ tab: i }), bg: this.state.tab === i ? '#1A1A1A' : 'transparent', fg: this.state.tab === i ? '#FFFFFF' : '#1A1A1A' }));
        const workTypes = [['正社員', 128], ['パート', 64]].map((w, i) => ({ label: w[0], n: w[1], on: !!this.state.work[i], toggle: () => this.setState({ work: Object.assign({}, this.state.work, { [i]: !this.state.work[i] }) }) }));
    const raw = [
      { id: 1, type: '正社員', cat: '病院', title: '「聞きやすさ」で選ばれる内科病棟で、一緒に働く看護師を募集', org: 'みなと中央病院', area: '東京都港区', payLabel: '月収', pay: '276,500円〜', payNote: '夜勤4回を含む', img: 'images/station.jpg', photo: '申し送り中のナースステーション（師長とスタッフ）', pts: 7, ot: 8, facts: ['教育担当つき', '2交代', '有休消化 9割'], likes: 128, posted: '2日前' },
      { id: 2, type: '正社員', cat: '回復期', title: '患者さんの「帰る」を支える回復期リハビリ病院で、日勤のみも可', org: 'さくら台リハビリ病院', area: '神奈川県横浜市', payLabel: '月収', pay: '262,000円〜', payNote: '日勤のみの場合', img: 'images/rehab.jpg', photo: 'リハビリ室で患者さんと歩行練習をする看護師', pts: 9, ot: 5, facts: ['日勤のみOK', '託児所あり'], likes: 96, posted: '4日前' },
      { id: 3, type: '正社員', cat: '介護施設', title: '病院から介護へ。看取りまで寄り添う特養で、看護師を募集', org: 'ひだまりの郷', area: '千葉県船橋市', payLabel: '月収', pay: '258,000円〜', payNote: '夜勤4回を含む', img: 'images/care.jpg', photo: '食堂で入居者と談笑するスタッフ（夕方の光）', pts: 25, ot: 3, facts: ['夜勤 月4回', '有休消化 9割', '病院から転職多め'], likes: 54, posted: '1週間前' },
      { id: 4, type: 'パート', cat: 'クリニック', title: '週3日から。子育て中の看護師が半分を占める外来で働く', org: '[クリニック名]', area: '東京都世田谷区', payLabel: '時給', pay: '1,900円〜', payNote: '週3日・16時まで', img: 'images/mentor.jpg', photo: '外来の受付前、スタッフ3名の集合写真', pts: 0, ot: 0, facts: ['週3日〜', '16時まで'], likes: 73, posted: '1週間前' }
    ];
    const jobs = raw.map((j) => {
      const liked = !!this.state.liked[j.id];
      const bars = [
        { label: '1人あたりの担当患者数', value: j.pts ? j.pts + '人' : '外来', w: Math.min(100, j.pts / 30 * 100) + '%', avgPos: (10 / 30 * 100) + '%', color: j.pts <= 10 ? '#3A63F4' : '#FF8FB1' },
        { label: '平均残業時間（月）', value: j.ot + 'h', w: Math.min(100, j.ot / 40 * 100) + '%', avgPos: (18 / 40 * 100) + '%', color: j.ot <= 18 ? '#3A63F4' : '#FF8FB1' }
      ];
      return Object.assign({}, j, { bars, liked, likes: j.likes + (liked ? 1 : 0), likeFill: liked ? '#FF8FB1' : 'none', likeBg: liked ? '#FFE3EC' : '#FFFFFF', likeBorder: liked ? '#FF8FB1' : '#D9D4C7', like: () => this.setState({ liked: Object.assign({}, this.state.liked, { [j.id]: !liked }) }) });
    });
    return {
      tabs, workTypes, jobs, count: 233,
