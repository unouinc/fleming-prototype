<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>ナスリー 募集をさがす</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F7}
a{color:#1D1D1F}a:hover{color:#6E6E73}
.m-only{display:none}
@keyframes fadein{from{opacity:.4}to{opacity:1}}
.cover .sl{opacity:0;transition:opacity .2s}.cover:hover .sl,.cover .sl:focus-visible{opacity:1}
.tabbar{display:none}
.arealist::-webkit-scrollbar{width:6px}.arealist::-webkit-scrollbar-thumb{background:#D2D2D7;border-radius:3px}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .cover .sl{opacity:.85!important}
  .m-only{display:flex!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important;flex-direction:column!important;align-items:stretch!important}
  .featgrid{flex-direction:row!important;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .featgrid>button{flex:0 0 272px;width:272px!important}
  .side{position:static!important;width:auto!important;flex:0 0 auto!important;order:-1}
  .cardtop{grid-template-columns:1fr!important;padding:0!important;gap:0!important}
  .cardtop .cover{order:-1;border-radius:0!important}
  .cardtop .ctext{padding:14px 16px 0!important}
  .ov{padding:0!important}
  .dlg{max-width:none!important;height:100%;max-height:none!important;border-radius:0!important}
  .optgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .dlghead{grid-template-columns:88px 1fr 88px!important;padding:0 8px!important}
  .dlgtitle{font-size:15px!important;white-space:nowrap}
  .cardbody{padding:14px 16px 16px!important;gap:12px!important}
  .ctitle{font-size:17px!important}
  .stat{flex:1 1 0!important;padding:8px 10px!important;border-radius:10px!important}
  .statl{font-size:10px!important}
  .statv{font-size:17px!important}
  .cta{flex:1 1 auto!important;justify-content:center}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E5E5EA;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <!-- App bar -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5E5EA">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" aria-label="ナスリー トップへ" style="display: flex; flex-direction: row; align-items: center; gap: 10px; text-decoration: none; flex: 0 1 auto; min-width: 0; line-height: 1.2"><svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true" style="flex: 0 0 auto; display: block"><path fill-rule="evenodd" fill="#3A6CF2" d="M40.00,6.00 Q40,0 46.00,0.00 L74.00,0.00 Q80,0 80.00,6.00 L80.00,39.00 Q80,40 81.00,40.00 L114.00,40.00 Q120,40 120.00,46.00 L120.00,74.00 Q120,80 114.00,80.00 L81.00,80.00 Q80,80 80.00,81.00 L80.00,114.00 Q80,120 74.00,120.00 L46.00,120.00 Q40,120 40.00,114.00 L40.00,81.00 Q40,80 39.00,80.00 L6.00,80.00 Q0,80 0.00,74.00 L0.00,46.00 Q0,40 6.00,40.00 L39.00,40.00 Q40,40 40.00,39.00 Z M45.00,43.00 Q43,43 43.00,45.00 L43.00,75.00 Q43,77 45.00,77.00 L75.00,77.00 Q77,77 77.00,75.00 L77.00,45.00 Q77,43 75.00,43.00 Z"></path></svg><span style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0">
        <span class="brand-concept" style="font-size: 10px; font-weight: 500; color: #6E6E73; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">職場がみえる 看護師のための転職プラットフォーム</span>
        <span role="img" aria-label="ナスリー" style="display: block; color: #1D1D1F; margin-top: 2px"><svg width="86" height="19" viewBox="100 5 3850 855" aria-hidden="true" style="display: block"><g transform="translate(0,800) scale(1,-1)" fill="currentColor"><path d="M458,775 Q458,791 474,791 H580 Q596,791 596,775 V34 Q596,-56 506,-56 H246 Q230,-56 230,-40 V66 Q230,82 246,82 H446 Q458,82 458,94 Z"/><path d="M120,436 H935 Q951,436 951,452 V558 Q951,574 935,574 H120 Q104,574 104,558 V452 Q104,436 120,436 Z"/><path transform="translate(1040,0)" d="M834 678Q828 669 816.5 650.0Q805 631 799 615Q778 568 747.5 510.0Q717 452 678.5 393.5Q640 335 597 284Q541 221 473.5 159.5Q406 98 331.5 46.5Q257 -5 179 -42L76 66Q157 97 233.0 144.0Q309 191 374.0 246.0Q439 301 486 353Q519 391 548.5 434.0Q578 477 601.0 519.5Q624 562 635 598Q625 598 599.0 598.0Q573 598 538.5 598.0Q504 598 466.0 598.0Q428 598 393.5 598.0Q359 598 333.0 598.0Q307 598 296 598Q275 598 252.0 596.5Q229 595 208.5 593.5Q188 592 177 591V733Q192 732 214.0 730.0Q236 728 258.5 727.0Q281 726 296 726Q309 726 337.0 726.0Q365 726 401.0 726.0Q437 726 475.5 726.0Q514 726 549.5 726.0Q585 726 611.0 726.0Q637 726 649 726Q682 726 709.5 730.0Q737 734 752 739ZM610 367Q649 336 693.0 295.0Q737 254 780.0 210.0Q823 166 859.5 125.5Q896 85 921 55L807 -44Q770 7 722.5 62.0Q675 117 622.5 171.5Q570 226 516 275Z"/><path transform="translate(2080,0)" d="M803 776Q802 755 800.5 730.5Q799 706 799 676Q799 650 799.0 613.0Q799 576 799.0 539.5Q799 503 799 478Q799 398 791.5 338.0Q784 278 769.0 233.0Q754 188 732.5 153.5Q711 119 683 88Q650 52 607.0 23.5Q564 -5 520.5 -24.5Q477 -44 440 -56L335 54Q410 71 470.5 101.5Q531 132 576 180Q602 209 618.0 238.0Q634 267 642.5 302.5Q651 338 654.5 383.0Q658 428 658 486Q658 512 658.0 548.0Q658 584 658.0 619.0Q658 654 658 676Q658 706 656.5 730.5Q655 755 652 776ZM339 768Q338 750 337.0 732.5Q336 715 336 691Q336 680 336.0 655.0Q336 630 336.0 596.5Q336 563 336.0 526.5Q336 490 336.0 456.0Q336 422 336.0 394.5Q336 367 336 353Q336 334 337.0 309.0Q338 284 339 266H194Q195 280 197.0 306.0Q199 332 199 354Q199 368 199.0 395.0Q199 422 199.0 456.5Q199 491 199.0 527.5Q199 564 199.0 597.0Q199 630 199.0 655.0Q199 680 199 691Q199 705 198.0 727.5Q197 750 195 768Z"/><path transform="translate(3120,0)" d="M92 463Q110 462 138.0 460.5Q166 459 196.5 458.0Q227 457 253 457Q278 457 315.0 457.0Q352 457 395.5 457.0Q439 457 485.5 457.0Q532 457 578.0 457.0Q624 457 665.0 457.0Q706 457 738.5 457.0Q771 457 790 457Q825 457 856.0 459.5Q887 462 907 463V306Q890 307 856.0 309.0Q822 311 790 311Q771 311 738.0 311.0Q705 311 664.0 311.0Q623 311 577.5 311.0Q532 311 485.0 311.0Q438 311 394.5 311.0Q351 311 314.5 311.0Q278 311 253 311Q210 311 165.0 309.5Q120 308 92 306Z"/></g></svg></span></span>
      </a>
      <form class="pc-only" aria-label="募集を検索" style="flex: 1 1 320px; min-width: 0; max-width: 480px; display: flex; align-items: center; gap: 10px; background: #F5F5F7; border-radius: 8px; padding: 0 16px; height: 42px; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">キーワード</label>
        <input id="q" type="search" value="{{qv}}" onInput="{{setQ}}" placeholder="病院名、エリア、「残業少なめ」など" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #1D1D1F; outline: none">
      </form>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" aria-current="page" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; background: #F5F5F7; color: #1D1D1F; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg>メッセージ<span style="background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #E8E8ED; color: #86868B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
      <button type="button" class="m-only" onClick="{{openCond}}" aria-label="検索条件" style="margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: none; background: #F5F5F7; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
    </div>
  </header>

  <!-- Body: 3 columns -->
  <div class="wrap" style="max-width: 1160px; width: 100%; margin: 0 auto; padding: 28px 32px 64px; box-sizing: border-box; display: flex; gap: 28px; align-items: flex-start">


    <!-- Left: results -->
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
          <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #1D1D1F">{{headTitle}}<span style="font-size: 15px; font-weight: 700"> の病院の看護師求人</span></h1>
          <span style="font-size: 12px; font-weight: 400; color: #6E6E73">2026/11/10更新</span>
        </div>
        <span style="font-size: 13px; font-weight: 400; color: #6E6E73">全 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 24px; font-weight: 700; color: #1D1D1F">{{count}}</span> 件（{{fac}}施設）</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
        <span style="position: relative; display: inline-flex">
          <select aria-label="表示順" onChange="{{setSort}}" style="appearance: none; -webkit-appearance: none; border: 1px solid #E5E5EA; border-radius: 6px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 400; color: #1D1D1F; padding: 8px 32px 8px 10px; min-height: 38px; cursor: pointer">
            <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><option value="{{t.i}}" selected="{{t.on}}">{{t.label}}</option></sc-for>
          </select>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 11px; top: 50%; margin-top: -6px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
        <span style="font-size: 12px; font-weight: 400; color: #1D1D1F">1件 / {{fac}}施設</span>
      </div>

      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="1">
        <article style="background: #FFFFFF; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
          <div class="cardtop" style="display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; padding: 20px 24px 0; align-items: start">
            <div class="ctext" style="min-width: 0; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; color: #6E6E73; flex-wrap: wrap">
                <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 6px; background: #E8E8ED; border: 1px solid #D2D2D7"></span>
                <span>{{j.org}}</span><span>·</span><span>{{j.area}}</span>
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap">
                <span style="font-size: 12px; font-weight: 400; color: #1D1D1F; border: 1px solid #D2D2D7; padding: 2px 8px; border-radius: 6px">{{j.type}}</span>
                <span style="font-size: 12px; font-weight: 400; color: #1D1D1F; border: 1px solid #D2D2D7; padding: 2px 8px; border-radius: 6px">{{j.cat}}</span>
              </div>
              <a href="job.html" class="ctitle" style="text-decoration: none; font-size: 18px; font-weight: 500; line-height: 1.6; color: #1D1D1F">{{j.title}}</a>
              <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 4px">
                <span style="font-size: 12px; font-weight: 400; color: #6E6E73">{{j.payLabel}}</span>
                <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 20px; color: #1D1D1F">{{j.pay}}</span>
                <span style="font-size: 12px; font-weight: 400; color: #6E6E73">{{j.payNote}}</span>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: #424245">
                <sc-for list="{{j.work}}" as="w" hint-placeholder-count="4"><span><span style="color: #6E6E73">{{w.k}}</span> <span style="font-weight: 700; color: #1D1D1F">{{w.v}}</span></span></sc-for>
              </div>
            </div>
            <div class="cover" style="position: relative; aspect-ratio: 16 / 9; background: #1D1D1F; border-radius: 10px; overflow: hidden">
              <a href="job.html" aria-label="{{j.title}}" style="display: block; width: 100%; height: 100%">
                <img src="{{j.img}}" alt="{{j.photo}}" style="width: 100%; height: 100%; object-fit: cover; display: block; animation: fadein .5s ease">
              </a>
              <button type="button" onClick="{{j.prev}}" aria-label="前の写真" class="sl" style="position: absolute; left: 8px; top: 50%; margin-top: -14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(29,29,31,0.28); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
              <button type="button" onClick="{{j.next}}" aria-label="次の写真" class="sl" style="position: absolute; right: 8px; top: 50%; margin-top: -14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(29,29,31,0.28); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
              <span style="position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 6px; pointer-events: none">
                <sc-for list="{{j.dots}}" as="d" hint-placeholder-count="3"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{d.bg}}"></span></sc-for>
              </span>
              <span style="position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 400; color: #1D1D1F; background: rgba(255,255,255,0.94); padding: 4px 10px 4px 8px; border-radius: 999px; pointer-events: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>話を聞ける人 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700">{{j.talk}}</span>人</span>
              <span style="position: absolute; right: 8px; top: 8px; font-size: 11px; font-weight: 400; color: #FFFFFF; background: rgba(29,29,31,0.55); padding: 2px 8px; border-radius: 999px">{{j.pos}}</span>
            </div>
          </div>
          <div class="cardbody" style="padding: 16px 24px 22px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{j.bars}}" as="b" hint-placeholder-count="3">
                <div class="stat" style="flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 2px; background: #F5F5F7; border-radius: 10px; padding: 10px 14px">
                  <span class="statl pc-only" style="font-size: 11px; font-weight: 700; color: #6E6E73">{{b.label}}</span><span class="statl m-only" style="font-size: 11px; font-weight: 700; color: #6E6E73">{{b.short}}</span>
                  <span class="statv" style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: {{b.color}}">{{b.value}}</span>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap">
              <sc-for list="{{j.facts}}" as="f" hint-placeholder-count="3">
                <span style="font-size: 12px; font-weight: 400; color: #1D1D1F; border: 1px solid #D2D2D7; padding: 2px 8px; border-radius: 6px">{{f}}</span>
              </sc-for>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid #E5E5EA">
              <a href="job.html#talk" class="cta" style="text-decoration: none; font-size: 14px; font-weight: 400; padding: 10px 18px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D2D2D7; color: #1D1D1F; min-height: 42px; box-sizing: border-box; display: flex; align-items: center; gap: 10px">話を聞きに行きたい<span style="font-size: 12px; color: #6E6E73; padding-left: 10px; border-left: 1px solid #E5E5EA; white-space: nowrap">話せる人 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; color: #1D1D1F">{{j.talk}}</span>人</span></a>
              <button type="button" onClick="{{j.like}}" aria-pressed="{{j.liked}}" style="border: 1px solid {{j.likeBorder}}; background: {{j.likeBg}}; color: #1D1D1F; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 400; padding: 10px 14px; min-height: 42px; display: flex; align-items: center; gap: 6px; cursor: pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="{{j.likeFill}}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.9 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4.1 0 6.2 4.6 4.5 8-2.5 4.4-9.5 9-9.5 9z"></path></svg>
                気になる <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif">{{j.likes}}</span>
              </button>
              <span style="margin-left: auto; font-size: 12px; font-weight: 700; color: #6E6E73">{{j.posted}}</span>
            </div>
          </div>
        </article>
      </sc-for>
      <button type="button" style="align-self: center; border: 2px solid #D2D2D7; background: #FFFFFF; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 12px 28px; min-height: 48px; cursor: pointer">もっと見る</button>
    </main>

    <!-- Right: search conditions -->
    <aside class="side" aria-label="検索条件" style="flex: 0 0 300px; width: 300px; position: sticky; top: 88px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 700; color: #1D1D1F">検索条件</span>
