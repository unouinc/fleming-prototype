<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleming メンバー（グラフと師長）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F7}
a{color:#1D1D1F}a:hover{color:#6E6E73}
.tabbar{display:none}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important}
  .pagetitle{font-size:20px!important}
  .hero{height:240px!important}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E5E5EA;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E5E5EA">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 0 0 auto">
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #1D1D1F; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF"></span></span>
        <span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.4px">Fleming</span>
      </a>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">スカウト<span style="background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #E8E8ED; color: #86868B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>

  <div class="wrap" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 24px 32px 80px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
    <main style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <a href="job.html" style="font-size: 13px; font-weight: 700; color: #6E6E73; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px">← 募集に戻る</a>
        <h1 class="pagetitle" style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.45">「聞きやすさ」で選ばれる内科病棟で、一緒に働く看護師を募集</h1>
        <span style="font-size: 14px; font-weight: 700; color: #6E6E73">みなと中央病院 · 東京都港区</span>
      </div>

      <nav aria-label="ページ内" style="display: flex; gap: 4px; border-bottom: 2px solid #E5E5EA; font-size: 14px; font-weight: 700">
        <a href="job.html" style="text-decoration: none; padding: 12px 16px; color: #6E6E73; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">施設概要</a>
        <a href="members-b.html" aria-current="page" style="text-decoration: none; padding: 12px 16px; border-bottom: 3px solid #1D1D1F; margin-bottom: -2px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">メンバー</a>
        <a href="interview.html" style="text-decoration: none; padding: 12px 16px; color: #6E6E73; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">インタビュー</a>
      </nav>

      <!-- 師長 profile -->
      <section style="background: #1D1D1F; color: #FFFFFF; border-radius: 14px; padding: 36px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
        <div style="flex: 0 0 220px; display: flex; flex-direction: column; gap: 12px">
          <div style="width: 220px; height: 260px; border-radius: 14px; overflow: hidden; background: #E8E8ED">
            <img src="images/mentor.jpg" alt="看護師長の写真" style="width: 100%; height: 100%; object-fit: cover; object-position: 30% 30%; display: block">
          </div>
          <span style="font-size: 11px; color: #D2D2D7">写真：師長（正面・自然光・病棟で）</span>
        </div>
        <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #D2D2D7">HEAD NURSE</span>
            <h2 style="margin: 0; font-size: 26px; font-weight: 700">看護師長　[氏名]</h2>
            <span style="font-size: 13px; font-weight: 700; color: #D2D2D7">看護師歴 [年数]年｜内科病棟の師長 4年目｜[前職・経歴]</span>
          </div>
          <p style="margin: 0; font-size: 15px; line-height: 1.9">「わからないことは、その場で聞く」。前の職場で、聞けない空気がミスと離職を生むのを見てきました。この病棟で最初に決めたのはそれだけです。忙しさはなくなりませんが、ひとりで抱える忙しさはなくせます。</p>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{headFacts}}" as="h" hint-placeholder-count="4">
              <div style="flex: 1 1 130px; min-width: 0; background: #1D1D1F; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 11px; font-weight: 700; color: #D2D2D7">{{h.k}}</span>
                <span style="font-size: 14px; font-weight: 700">{{h.v}}</span>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <sc-for list="{{headTags}}" as="t" hint-placeholder-count="4">
              <span style="font-size: 12px; font-weight: 700; background: #FFFFFF; color: #1D1D1F; padding: 6px 12px; border-radius: 999px">{{t}}</span>
            </sc-for>
          </div>
        </div>
      </section>

      <!-- Charts -->
      <section style="background: #FFFFFF; border-radius: 14px; padding: 36px; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #1D1D1F">MEMBERS</span>
            <h2 style="margin: 0; font-size: 22px; font-weight: 700">数字で見る、内科病棟のメンバー</h2>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #6E6E73">看護師 24名・看護補助者 6名｜2026年10月時点</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
          <!-- Age -->
          <div style="background: #F5F5F7; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; justify-content: space-between; align-items: baseline">
              <span style="font-size: 15px; font-weight: 700">年齢構成</span>
              <span style="font-size: 12px; font-weight: 700; color: #6E6E73">平均 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 16px; color: #1D1D1F">33.4</span>歳</span>
            </div>
            <div style="display: flex; align-items: flex-end; gap: 10px; height: 140px">
              <sc-for list="{{ages}}" as="a" hint-placeholder-count="5">
                <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%">
                  <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 14px">{{a.n}}</span>
                  <span style="width: 100%; border-radius: 6px 4px 4px 4px; background: {{a.color}}; height: {{a.h}}"></span>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 10px">
              <sc-for list="{{ages}}" as="a" hint-placeholder-count="5">
                <span style="flex: 1 1 0; text-align: center; font-size: 11px; font-weight: 700; color: #6E6E73">{{a.label}}</span>
              </sc-for>
            </div>
          </div>

          <!-- Gender -->
          <div style="background: #F5F5F7; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
            <span style="font-size: 15px; font-weight: 700">男女比</span>
            <div style="display: flex; height: 36px; border-radius: 999px; overflow: hidden">
              <span style="width: 83%; background: #D2D2D7; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 14px">83%</span>
              <span style="width: 17%; background: #1D1D1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 14px">17%</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700">
              <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #D2D2D7"></span>女性 20名</span>
              <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #1D1D1F"></span>男性 4名</span>
            </div>
            <span style="font-size: 12px; line-height: 1.6; color: #6E6E73">男性看護師は4名。夜勤専従2名、Aチーム・Bチームに1名ずつ。</span>
            <div style="margin-top: 6px; padding-top: 14px; border-top: 1px solid #E5E5EA; display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 15px; font-weight: 700">子育て中のメンバー</span>
              <div style="display: flex; align-items: baseline; gap: 8px">
                <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 28px">9</span>
                <span style="font-size: 13px; font-weight: 700; color: #6E6E73">名／24名（時短勤務 3名）</span>
              </div>
            </div>
          </div>

          <!-- Employment -->
          <div style="background: #F5F5F7; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
            <span style="font-size: 15px; font-weight: 700">雇用形態</span>
            <div style="display: flex; align-items: center; gap: 20px">
              <div style="position: relative; width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(#1D1D1F 0 79%, #AEAEB2 79% 92%, #E5E5EA 92% 100%); flex: 0 0 auto; display: flex; align-items: center; justify-content: center">
                <span style="width: 76px; height: 76px; border-radius: 50%; background: #F5F5F7; display: flex; flex-direction: column; align-items: center; justify-content: center">
                  <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 22px; line-height: 1">79%</span>
                  <span style="font-size: 10px; font-weight: 700; color: #6E6E73">正社員</span>
                </span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-weight: 700">
                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #1D1D1F"></span>正社員 19名（79%）</span>
                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #AEAEB2"></span>パート・時短 3名（13%）</span>
                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #E5E5EA"></span>派遣 2名（8%）</span>
              </div>
            </div>
          </div>

          <!-- Tenure / career -->
          <div style="background: #F5F5F7; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
            <span style="font-size: 15px; font-weight: 700">経験年数と入職経路</span>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{tenure}}" as="t" hint-placeholder-count="4">
                <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700">
                  <span style="width: 64px; flex: 0 0 auto; color: #6E6E73">{{t.label}}</span>
                  <span style="flex: 1 1 auto; height: 12px; background: #E5E5EA; border-radius: 999px; overflow: hidden; display: flex"><span style="height: 12px; border-radius: 999px; background: {{t.color}}; width: {{t.w}}"></span></span>
                  <span style="width: 32px; text-align: right; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 14px">{{t.n}}</span>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 4px">
              <div style="flex: 1 1 0; background: #FFFFFF; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 11px; font-weight: 700; color: #6E6E73">中途入職</span>
                <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 20px">58<span style="font-size: 12px">%</span></span>
              </div>
              <div style="flex: 1 1 0; background: #FFFFFF; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 11px; font-weight: 700; color: #6E6E73">昨年度の離職</span>
                <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 20px">2<span style="font-size: 12px">名</span></span>
              </div>
              <div style="flex: 1 1 0; background: #FFFFFF; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 11px; font-weight: 700; color: #6E6E73">平均勤続</span>
                <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 20px">5.2<span style="font-size: 12px">年</span></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Key people -->
      <section style="background: #FFFFFF; border-radius: 14px; padding: 36px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #1D1D1F">PEOPLE</span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 700">話を聞きに行くと会える人</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <sc-for list="{{people}}" as="m" hint-placeholder-count="3">
            <div style="flex: 1 1 220px; min-width: 0; background: #F5F5F7; border-radius: 14px; padding: 20px; display: flex; gap: 14px; align-items: flex-start">
              <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #E8E8ED; color: #86868B; border: 2px solid #D2D2D7; flex: 0 0 auto; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></span>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 15px; font-weight: 700">{{m.role}}</span>
                <span style="font-size: 12px; font-weight: 700; color: #6E6E73">{{m.meta}}</span>
                <span style="font-size: 13px; line-height: 1.7">{{m.text}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
      <p style="margin: 0; font-size: 12px; color: #6E6E73">※氏名・人数・数値はプロトタイプ用のサンプルです</p>
    </main>

    <aside style="flex: 0 1 340px; min-width: 280px; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 2px solid #D2D2D7; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; gap: 14px">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 10px; background: #E8E8ED; border: 1px solid #D2D2D7; flex: 0 0 auto"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 700">みなと中央病院</span>
            <span style="font-size: 12px; font-weight: 700; color: #6E6E73">急性期｜病床数 [病床数]｜東京都港区</span>
            <span style="font-size: 13px; font-weight: 700"><span style="color: #6E6E73">月収 </span><span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 18px">276,500円〜</span></span>
          </div>
        </div>
        <a href="job.html" style="text-decoration: none; background: #1D1D1F; color: #FFFFFF; border-radius: 999px; font-size: 16px; font-weight: 700; padding: 16px; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">話を聞きに行きたい</a>
        <span style="font-size: 12px; line-height: 1.7; color: #6E6E73">見学では師長が同席します。師長に直接聞きたいことを、メッセージで先に送っておけます。</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 700">別の見せ方を見る</span>
        <a href="members-a.html" style="text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px; background: #1D1D1F; color: #FFFFFF; min-height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">パターンA：組織図</a>
      </div>
    </aside>
  </div>
  <nav class="tabbar" aria-label="モバイルナビゲーション">
    <a href="index.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
    <a href="scouts.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg><span style="position: absolute; top: 2px; left: calc(50% + 6px); background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 10px; padding: 1px 6px; border-radius: 999px">3</span>スカウト</a>
    <a href="profile.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>プロフィール</a>
  </nav>
</div>
</template>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="runtime.js"></script>
