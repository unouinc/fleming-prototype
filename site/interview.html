<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleming 施設長インタビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1A1A1A}a:hover{color:#3A63F4}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F6F5F1; color: #1A1A1A; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E0D8">
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 0 0 auto">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #3A63F4; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #FFD338"></span></span>
        <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.4px">Fleming</span>
      </a>
      <nav aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">スカウト<span style="background: #3A63F4; color: #FFFFFF; font-family: 'Outfit', sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #DAD6CC; color: #6B675E; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 900"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>

  <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 24px 32px 80px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
    <main style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <a href="job.html" style="font-size: 13px; font-weight: 700; color: #5C5C5C; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px">← 募集に戻る</a>
        <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.45">「聞きやすさ」で選ばれる内科病棟で、一緒に働く看護師を募集</h1>
        <span style="font-size: 14px; font-weight: 700; color: #5C5C5C">みなと中央病院 · 東京都港区</span>
      </div>

      <nav aria-label="ページ内" style="display: flex; gap: 4px; border-bottom: 2px solid #E3E0D8; font-size: 14px; font-weight: 700">
        <a href="job.html" style="text-decoration: none; padding: 12px 16px; color: #5C5C5C; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">施設概要</a>
        <a href="members-a.html" style="text-decoration: none; padding: 12px 16px; color: #5C5C5C; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">メンバー</a>
        <a href="interview.html" aria-current="page" style="text-decoration: none; padding: 12px 16px; border-bottom: 3px solid #1A1A1A; margin-bottom: -2px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">インタビュー</a>
      </nav>

      <!-- Article -->
      <article style="background: #FFFFFF; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column">
        <div style="height: 460px; background: #DAD6CC; overflow: hidden">
          <img src="images/director.jpg" alt="会議室で話す施設長" style="width: 100%; height: 100%; object-fit: cover; display: block">
        </div>
        <div style="padding: 36px; display: flex; flex-direction: column; gap: 28px">
          <div style="display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 2px; color: #3A63F4">INTERVIEW</span>
            <h2 style="margin: 0; font-size: 28px; font-weight: 900; line-height: 1.5">「忙しさはなくせない。でも、ひとりで抱える忙しさはなくせる」</h2>
            <p style="margin: 0; font-size: 14px; line-height: 1.8; color: #5C5C5C">みなと中央病院 施設長 [氏名]さんに、ご自身の経歴から、この病院の良いところ、いま抱えている課題、これからの展望までを伺いました。聞き手はFleming編集部。</p>
            <span style="font-size: 12px; font-weight: 700; color: #8A857A">取材日 2026年[月][日]日｜文・写真 Fleming編集部</span>
          </div>

          <!-- Profile -->
          <div style="display: flex; flex-wrap: wrap; gap: 20px; background: #F6F5F1; border-radius: 20px; padding: 22px">
            <div style="width: 96px; height: 96px; border-radius: 50%; overflow: hidden; background: #DAD6CC; flex: 0 0 auto">
              <img src="images/director.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block">
            </div>
            <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">施設長</span>
                <span style="font-size: 20px; font-weight: 900">[氏名]</span>
              </div>
              <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px">
                <sc-for list="{{career}}" as="c" hint-placeholder-count="5">
                  <li style="display: flex; gap: 12px; font-size: 13px; line-height: 1.7">
                    <span style="flex: 0 0 72px; font-family: 'Outfit', sans-serif; font-weight: 700; color: #5C5C5C">{{c.y}}</span>
                    <span style="font-weight: 700">{{c.t}}</span>
                  </li>
                </sc-for>
              </ol>
            </div>
          </div>

          <!-- Dialogue -->
          <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
            <section style="display: flex; flex-direction: column; gap: 18px">
              <h3 style="margin: 8px 0 0; font-size: 20px; font-weight: 900; line-height: 1.5; padding-left: 14px; border-left: 4px solid #1A1A1A">{{sec.title}}</h3>
              <sc-for list="{{sec.turns}}" as="t" hint-placeholder-count="4">
                <div style="display: flex; gap: 14px; align-items: flex-start">
                  <span style="flex: 0 0 64px; padding-top: 4px; font-size: 12px; font-weight: 900; color: {{t.color}}">{{t.who}}</span>
                  <p style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 15px; line-height: 2; font-weight: {{t.weight}}; white-space: pre-line">{{t.text}}</p>
                </div>
              </sc-for>
              <sc-if value="{{sec.photo}}" hint-placeholder-val="{{false}}">
                <figure style="margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px">
                  <div style="height: 380px; border-radius: 16px; overflow: hidden; background: #DAD6CC">
                    <img src="{{sec.photo}}" alt="{{sec.caption}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
                  </div>
                  <figcaption style="font-size: 12px; color: #5C5C5C">{{sec.caption}}</figcaption>
                </figure>
              </sc-if>
            </section>
          </sc-for>

          <!-- Closing -->
          <div style="background: #1A1A1A; color: #FFFFFF; border-radius: 20px; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 12px; font-weight: 700; color: #CFCFCF">編集後記</span>
            <p style="margin: 0; font-size: 14px; line-height: 1.9">[取材を終えての一言。施設長の人柄や、病棟で見た光景など、編集部の目線で2〜3文]</p>
          </div>
          <p style="margin: 0; font-size: 12px; color: #5C5C5C">※本文はプロトタイプ用のサンプルです。実際のインタビューの文字起こしに差し替えます</p>
        </div>
      </article>
    </main>

    <aside style="flex: 0 1 340px; min-width: 280px; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 2px solid #1A1A1A; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; gap: 14px">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: #DAD6CC; border: 1px solid #C9C4B8; flex: 0 0 auto"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 900">みなと中央病院</span>
            <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">急性期｜病床数 [病床数]｜東京都港区</span>
            <span style="font-size: 13px; font-weight: 700"><span style="color: #5C5C5C">月収 </span><span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px">276,500円〜</span></span>
          </div>
        </div>
        <a href="job.html" style="text-decoration: none; background: #1A1A1A; color: #FFFFFF; border-radius: 999px; font-size: 16px; font-weight: 700; padding: 16px; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">話を聞きに行きたい</a>
        <span style="font-size: 12px; line-height: 1.7; color: #5C5C5C">見学では施設長または師長が同席します。記事で気になったことを、そのまま聞けます。</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 13px; font-weight: 900">この記事の目次</span>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700">
          <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
            <li style="display: flex; gap: 10px"><span style="font-family: 'Outfit', sans-serif; color: #5C5C5C">{{sec.no}}</span><span>{{sec.short}}</span></li>
          </sc-for>
        </ol>
      </div>
    </aside>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const F = (text) => ({ who: 'Fleming', color: '#3A63F4', weight: 700, text });
    const D = (text) => ({ who: '施設長', color: '#1A1A1A', weight: 500, text });
    return {
      career: [
        { y: '[年]', t: '[大学・看護学校] 卒業。[病院名]に看護師として入職' },
        { y: '[年]', t: '[病院名] 内科病棟 主任' },
        { y: '[年]', t: '[病院名] 看護師長（内科病棟）' },
        { y: '[年]', t: 'みなと中央病院 看護部長' },
        { y: '[年]', t: 'みなと中央病院 施設長（現職）' }
      ],
      sections: [
        { no: '01', short: '経歴', title: '「聞けない空気」を、最初の職場で見た', photo: null, caption: '', turns: [
          F('まず、これまでの経歴を教えてください。'),
          D('看護学校を出て、最初に入ったのが[病院名]の内科病棟でした。[年数]年ほどいて、主任、師長と上がっていって。みなと中央病院に来たのは[年]年です。看護部長を経て、[年]年から施設長をしています。'),
          F('最初の職場で、いまにつながる経験はありましたか。'),
          D('あります。新人のころ、わからないことがあっても聞けない空気があって。聞くと「そんなことも知らないの」という顔をされる。そうすると、聞かずに自分で判断してしまう。それが小さなミスにつながるし、半年で辞めていく同期も多かった。\n「聞けないこと」が、ミスと離職の両方を生むんだと、あのとき身体で覚えました。')
        ] },
        { no: '02', short: '施設の良いところ', title: 'ルールはひとつ。「わからないことは、その場で聞く」', photo: 'images/director2.jpg', caption: '病棟を回る施設長。スタッフとの立ち話が日課だという', turns: [
          F('この病院の良いところを、ご自身の言葉で教えてください。'),
          D('派手なものはないんです。ただ、内科病棟で最初に決めたのが「わからないことは、その場で聞く」というルールで。聞かれた側は、手を止めて答える。それだけです。\n今は中途入職の人が半分以上いますが、3か月たつと「ここは聞きやすい」とほぼ全員が言ってくれます。'),
          F('受け持ち人数も少なめですね。'),
          D('日勤は7人までと決めています。超えそうな日は、朝の申し送りでチーム全体で調整する。忙しさ自体はなくなりません。でも、ひとりで抱える忙しさはなくせる。そう思ってやっています。')
        ] },
        { no: '03', short: '課題', title: '正直に言うと、夜勤の人手はまだ足りていない', photo: null, caption: '', turns: [
          F('あえて、いま困っていることも伺いたいです。'),
          D('夜勤です。夜勤専従が4名いますが、理想はあと2名。今は日勤の人にも月4回お願いしていて、ここは負担だと思っています。\nあとは電子カルテの入力に時間がかかっていること。残業の大半はこれなので、来年度に入力の仕組みを変える予定です。'),
          F('求職者の方に、先に伝えておきたいことはありますか。'),
          D('急性期なので、入退院は多いです。ゆっくり一人の患者さんと向き合いたい方には、正直、回復期のほうが合うかもしれない。そこは見学のときに、現場を見て判断してほしいです。')
        ] },
        { no: '04', short: '今後の展望', title: '「辞めない病院」より、「戻ってこられる病院」に', photo: null, caption: '', turns: [
          F('これからの3年で、どんな病院にしていきたいですか。'),
          D('離職率を下げることばかり考えていた時期もあったんですが、今は「戻ってこられる病院」にしたいと思っています。出産や介護で一度離れても、またここで働きたいと思ってもらえるか。\nそのために、復職支援と院内保育の時間延長を進めています。'),
          F('最後に、この記事を読んでいる看護師の方へ。'),
          D('まず、見学に来てください。私か師長が必ず一緒に回ります。良いところも、足りないところも、その場で聞いてもらって大丈夫です。')
        ] }
      ]
    };
  }
}
mount(Component, 'tpl', 'app');
</script>
</body>
</html>
