<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleming メンバー（組織図）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1A1A1A}a:hover{color:#3A63F4}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F6F5F1; color: #1A1A1A; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E0D8">
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 0 0 auto">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #3A63F4; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #FFD338"></span></span>
        <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.4px">Fleming</span>
      </a>
      <nav aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">スカウト<span style="background: #3A63F4; color: #FFFFFF; font-family: 'Outfit', sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">メッセージ</a>
        <a href="#" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">気になる</a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #FFD338; border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 900">M</a>
      </nav>
    </div>
  </header>

  <div style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 24px 32px 80px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
    <main style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <a href="job.html" style="font-size: 13px; font-weight: 700; color: #5C5C5C; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px">← 募集に戻る</a>
        <h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.45">「聞きやすさ」で選ばれる内科病棟で、一緒に働く看護師を募集</h1>
        <span style="font-size: 14px; font-weight: 700; color: #5C5C5C">みなと中央病院 · 東京都港区</span>
      </div>

      <nav aria-label="ページ内" style="display: flex; gap: 4px; border-bottom: 2px solid #E3E0D8; font-size: 14px; font-weight: 700">
        <a href="job.html" style="text-decoration: none; padding: 12px 16px; color: #5C5C5C; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">ストーリー</a>
        <a href="job.html" style="text-decoration: none; padding: 12px 16px; color: #5C5C5C; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">数字で見る</a>
        <a href="members-a.html" aria-current="page" style="text-decoration: none; padding: 12px 16px; border-bottom: 3px solid #1A1A1A; margin-bottom: -2px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">メンバー</a>
        <a href="job.html" style="text-decoration: none; padding: 12px 16px; color: #5C5C5C; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">募集要項</a>
      </nav>

      <!-- Org chart -->
      <section style="background: #FFFFFF; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 2px; color: #3A63F4">TEAM</span>
            <h2 style="margin: 0; font-size: 22px; font-weight: 900">内科病棟のチーム構成</h2>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">看護師 24名・看護補助者 6名｜2026年10月時点</span>
        </div>

        <!-- Level 1: 師長 -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0">
          <div style="width: 300px; background: #1A1A1A; color: #FFFFFF; border-radius: 20px; padding: 18px 20px; display: flex; gap: 14px; align-items: center">
            <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 50%; background: #FFD338; border: 2px solid #FFFFFF; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #1A1A1A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 11px; font-weight: 700; color: #FFD338">看護師長</span>
              <span style="font-size: 16px; font-weight: 900">[氏名]</span>
              <span style="font-size: 11px; color: #CFCFCF">看護師歴 [年数]年｜この病棟 4年目</span>
            </span>
          </div>
          <span aria-hidden="true" style="width: 2px; height: 28px; background: #C9C4B8"></span>
          <!-- Level 2: 主任 -->
          <div style="width: 240px; background: #FFFFFF; border: 2px solid #1A1A1A; border-radius: 18px; padding: 14px 18px; display: flex; gap: 12px; align-items: center">
            <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #DAD6CC; border: 2px solid #1A1A1A; flex: 0 0 auto"></span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 11px; font-weight: 700; color: #3A63F4">主任</span>
              <span style="font-size: 15px; font-weight: 900">[氏名]</span>
              <span style="font-size: 11px; color: #5C5C5C">看護師歴 [年数]年</span>
            </span>
          </div>
          <span aria-hidden="true" style="width: 2px; height: 28px; background: #C9C4B8"></span>
          <span aria-hidden="true" style="width: 66%; height: 2px; background: #C9C4B8"></span>
        </div>

        <!-- Level 3: teams -->
        <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: -28px">
          <sc-for list="{{teams}}" as="t" hint-placeholder-count="3">
            <div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 0">
              <span aria-hidden="true" style="width: 2px; height: 28px; background: #C9C4B8"></span>
              <div style="width: 100%; background: #F6F5F1; border-radius: 20px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
                <div style="display: flex; justify-content: space-between; align-items: center">
                  <span style="font-size: 15px; font-weight: 900">{{t.name}}</span>
                  <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 14px; background: {{t.color}}; color: {{t.fg}}; padding: 4px 10px; border-radius: 999px">{{t.n}}名</span>
                </div>
                <div style="display: flex; gap: 10px; align-items: center">
                  <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #DAD6CC; border: 2px solid #1A1A1A; flex: 0 0 auto"></span>
                  <span style="display: flex; flex-direction: column; gap: 1px">
                    <span style="font-size: 11px; font-weight: 700; color: #5C5C5C">リーダー</span>
                    <span style="font-size: 13px; font-weight: 900">[氏名]</span>
                  </span>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{t.members}}" as="m" hint-placeholder-count="6">
                    <span aria-label="{{m.label}}" style="width: 30px; height: 30px; border-radius: 50%; background: {{m.bg}}; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: {{m.fg}}">{{m.short}}</span>
                  </sc-for>
                </div>
                <span style="font-size: 12px; line-height: 1.6; color: #5C5C5C">{{t.note}}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <!-- Legend -->
        <div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; font-weight: 700; padding-top: 8px; border-top: 1px solid #EDEAE2">
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #3A63F4"></span>10年以上</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #93A8E8"></span>4〜9年</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #FFD338"></span>1〜3年</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #FF8FB1"></span>新卒1年目</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 50%; background: #E4E0D6"></span>看護補助者</span>
          <span style="margin-left: auto; color: #5C5C5C">★＝中途入職</span>
        </div>
      </section>

      <!-- Support structure -->
      <section style="background: #FFFFFF; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 2px; color: #3A63F4">YOUR PLACE</span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 900">あなたが入ったら、こうなります</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 14px">
          <sc-for list="{{onboard}}" as="o" hint-placeholder-count="3">
            <div style="flex: 1 1 200px; min-width: 0; background: {{o.bg}}; color: {{o.fg}}; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 8px">
              <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 1px">{{o.when}}</span>
              <span style="font-size: 16px; font-weight: 900">{{o.title}}</span>
              <span style="font-size: 13px; line-height: 1.7">{{o.text}}</span>
            </div>
          </sc-for>
        </div>
      </section>
      <p style="margin: 0; font-size: 12px; color: #5C5C5C">※氏名・人数・構成はプロトタイプ用のサンプルです</p>
    </main>

    <aside style="flex: 0 1 340px; min-width: 280px; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 2px solid #1A1A1A; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; gap: 14px">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; background: #DAD6CC; border: 1px solid #C9C4B8; flex: 0 0 auto"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 900">みなと中央病院</span>
            <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">急性期｜病床数 [病床数]｜東京都港区</span>
            <span style="font-size: 13px; font-weight: 700"><span style="color: #5C5C5C">月収 </span><span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px">276,500円〜</span></span>
          </div>
        </div>
        <a href="job.html" style="text-decoration: none; background: #1A1A1A; color: #FFFFFF; border-radius: 999px; font-size: 16px; font-weight: 700; padding: 16px; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">話を聞きに行きたい</a>
        <span style="font-size: 12px; line-height: 1.7; color: #5C5C5C">見学では、師長と主任のどちらかが必ず同席します。</span>
      </div>
      <div style="background: #FFD338; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 900">別の見せ方を見る</span>
        <a href="members-b.html" style="text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; min-height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">パターンB：グラフ＋師長の紹介</a>
      </div>
    </aside>
  </div>
</div>
</template>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const C = { s: ['#3A63F4', '#FFFFFF', '10年以上'], m: ['#93A8E8', '#1A1A1A', '4〜9年'], j: ['#FFD338', '#1A1A1A', '1〜3年'], n: ['#FF8FB1', '#1A1A1A', '新卒1年目'], a: ['#E4E0D6', '#1A1A1A', '看護補助者'] };
    const mk = (code) => code.split('').map((ch, i, arr) => {
      const star = arr[i + 1] === '*'; if (ch === '*') return null;
      const c = C[ch]; return { bg: c[0], fg: c[1], short: star ? '★' : '', label: c[2] + (star ? '・中途入職' : '') };
    }).filter(Boolean);
    return {
      teams: [
        { name: 'Aチーム', n: 10, color: '#3A63F4', fg: '#FFFFFF', members: mk('sm*mjj*jna*a'), note: '病室1〜12。中途入職者が多く、教育担当が1名専任。' },
        { name: 'Bチーム', n: 10, color: '#FFD338', fg: '#1A1A1A', members: mk('smm*jj*j*nnaa'), note: '病室13〜24。新卒2名が今年入職。' },
        { name: '夜勤専従・フリー', n: 10, color: '#FF8FB1', fg: '#1A1A1A', members: mk('ssm*m*jjj*aaa'), note: '夜勤専従4名、日勤フリー2名、看護補助者。' }
      ],
      onboard: [
        { when: 'DAY 1', title: '教育担当がつきます', text: 'Aチームの[氏名]さん（看護師歴[年数]年、中途入職）が3か月間あなたの担当。', bg: '#3A63F4', fg: '#FFFFFF' },
        { when: 'WEEK 1–4', title: '受け持ちは4人から', text: '最初の1か月は受け持ちを減らし、病棟のルールと電子カルテに慣れる期間にします。', bg: '#FFD338', fg: '#1A1A1A' },
        { when: 'MONTH 1–3', title: '月1回、師長と15分', text: '困っていることを師長に直接。チームの変更も相談できます。', bg: '#F6F5F1', fg: '#1A1A1A' }
      ]
    };
  }
}
mount(Component, 'tpl', 'app');
</script>
</body>
</html>
