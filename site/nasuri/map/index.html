<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>関東 病院マップ</title>
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 左に地図（ズーム・パン）、右に絞り込みとエリア一覧。狭い画面では縦に積む */
:root{
  --bg:#F5F5F7; --panel:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#86868B; --line:#E5E5EA;
  --land:#FFFFFF; --muni:#E3E3E8; --pref:#AEAEB2; --sea:#EEF1F5;
  --top:#1D1D1F; --other:#A1A1A6; --hi:#E5484D; --ring:#1D1D1F; --sel:#F4A3A6;
 
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --panel:#1C1C1F; --ink:#F5F5F7; --ink2:#B3B3BA; --ink3:#A1A1A9; --line:#333338;
  --land:#232327; --muni:#34343A; --pref:#6E6E73; --sea:#16171B;
  --top:#F5F5F7; --other:#6E6E73; --hi:#FF6369; --ring:#F5F5F7; --sel:#E87A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --panel:#1C1C1F; --ink:#F5F5F7; --ink2:#B3B3BA; --ink3:#A1A1A9; --line:#333338;
  --land:#232327; --muni:#34343A; --pref:#6E6E73; --sea:#16171B;
  --top:#F5F5F7; --other:#6E6E73; --hi:#FF6369; --ring:#F5F5F7; --sel:#E87A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.lead{margin:0;color:var(--ink2);max-width:72ch}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--sea);border-radius:20px;overflow:hidden;position:relative;box-shadow:0 0 0 .5px var(--line);min-width:0}
svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
svg:active{cursor:grabbing}
.muni{fill:var(--land);stroke:var(--muni)}
.muni.sel{fill:var(--bg)}
.pref{fill:none;stroke:var(--pref);pointer-events:none}
.dot{stroke:var(--panel);cursor:pointer}
.dot.top{fill:var(--top)}
.dot.other{fill:var(--other)}
.dot.sel{fill:var(--sel)}
.dot.on{stroke:var(--ink)}
.ring{fill:none;stroke:var(--ring);pointer-events:none}
.ringlabel{fill:var(--ink2);font-size:11px;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.zoombtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:36px;height:36px;border-radius:999px;border:0;background:var(--panel);color:var(--ink);font-size:18px;box-shadow:0 0 0 .5px var(--line),0 2px 6px rgba(0,0,0,.08);cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;box-shadow:0 0 0 .5px var(--line),0 8px 24px rgba(0,0,0,.14);max-width:280px}
.tip b{font-size:13px;display:block}
.tip span{color:var(--ink2)}
.panel{background:var(--panel);border-radius:20px;padding:18px;box-shadow:0 0 0 .5px var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink2);font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl{font-size:12px;font-weight:600;color:var(--ink3);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.areas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto}
.areas button{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums}
.areas button:hover{background:var(--bg)}
.areas button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.areas .n1{font-weight:700;min-width:2.2em;text-align:right}
.areas .n2{color:var(--ink3);min-width:3em;text-align:right}
.areas button[aria-pressed="true"] .n2{color:inherit;opacity:.7}
.ahead{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:11px;color:var(--ink3);padding:0 10px}
.ahead span:nth-child(2){min-width:2.2em;text-align:right}.ahead span:nth-child(3){min-width:3em;text-align:right}
.note{margin:0;font-size:12px;color:var(--ink3)}
.picked{font-size:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.picked b{display:block;font-size:14px}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>

</head>

<div class="wrap">
  <h1>関東 病院マップ</h1>
  <p class="lead">営業リストの病院（関東1都6県・100〜399床、1,096件）を所在地に置きました。黒い点が上位150件です。エリアを押すと、そのエリアの病院が赤く表示されます。病院を押すと、直線距離5km・10km・20kmの円を出します。</p>
  <div class="main">
    <div class="mapbox" id="mapbox">
      <svg id="map" viewBox="0 0 1000 820" role="img" aria-label="関東の病院の位置"></svg>
      <div class="zoombtns"><button type="button" id="zin" aria-label="拡大">＋</button><button type="button" id="zout" aria-label="縮小">－</button><button type="button" id="zreset" aria-label="全体に戻す" style="font-size:13px">全</button></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="panel">
      <div class="seg" role="group" aria-label="表示する病院">
        <button type="button" id="showTop" aria-pressed="false">上位150のみ</button>
        <button type="button" id="showAll" aria-pressed="true">全1,096件</button>
      </div>
      <div class="legend"><span><i style="background:var(--top)"></i>上位150</span><span><i style="background:var(--other)"></i>その他</span><span><i style="background:var(--sel)"></i>選んだエリア</span></div>
      <div class="picked" id="picked" hidden></div>
      <div style="display:flex;flex-direction:column;gap:8px;min-height:0">
        <p class="lbl">エリア（押すとそのエリアの点が赤くなります）</p>
        <div class="ahead"><span>エリア</span><span>上位</span><span>全体</span></div>
        <ul class="areas" id="areas"></ul>
      </div>
      <p class="note">位置は国土地理院の住所検索で求めた概略です。境界は国土地理院「地球地図日本」（2016）。円は直線距離で、通勤時間ではありません。</p>
    </aside>
  </div>
</div>

.196,35.343],[139.19,35.338],[139.193,35.328],[139.187,35.323],[139.18,35.33],[139.17,35.327],[139.165,35.316],[139.148,35.314],[139.136,35.337],[139.161,35.347],[139.16,35.356]]]]}},{"type":"Feature","id":"14363","geometry":{"type":"MultiPolygon","coordinates":[[[[139.16,35.356],[139.161,35.347],[139.136,35.337],[139.114,35.352],[139.128,35.375],[139.1,35.39],[139.1,35.406],[139.105,35.409],[139.102,35.42],[139.129,35.445],[139.142,35.444],[139.152,35.395],[139.144,35.382],[139.16,35.356]]]]}},{"type":"Feature","id":"14364","geometry":{"type":"MultiPolygon","coordinates":[[[[139.163,35.474],[139.166,35.466],[139.16,35.45],[139.129,35.445],[139.102,35.42],[139.105,35.409],[139.1,35.406],[139.1,35.39],[139.128,35.375],[139.114,35.352],[139.095,35.346],[139.057,35.351],[139.03,35.337],[139.031,35.332],[139.019,35.33],[139.012,35.337],[139.009,35.35],[139.013,35.358],[138.999,35.382],[139.002,35.399],[138.997,35.403],[138.916,35.401],[138.917,35.41],[138.929,35.421],[138.928,35.437],[138.937,35.449],[138.954,35.46],[138.979,35.464],[138.991,35.474],[139.027,35.481],[139.046,35.51],[139.066,35.509],[139.076,35.495],[139.103,35.479],[139.126,35.478],[139.139,35.486],[139.163,35.474]]]]}},{"type":"Feature","id":"14366","geometry":{"type":"MultiPolygon","coordinates":[[[[139.112,35.352],[139.132,35.344],[139.143,35.323],[139.122,35.32],[139.107,35.343],[139.112,35.352]]]]}},{"type":"Feature","id":"14382","geometry":{"type":"MultiPolygon","coordinates":[[[[139.005,35.29],[139.031,35.274],[139.05,35.281],[139.069,35.255],[139.061,35.246],[139.084,35.234],[139.093,35.243],[139.121,35.239],[139.115,35.227],[139.088,35.217],[139.077,35.2],[139.04,35.177],[139.026,35.176],[138.988,35.201],[138.976,35.236],[138.975,35.262],[138.993,35.285],[139.005,35.29]]]]}},{"type":"Feature","id":"14383","geometry":{"type":"MultiPolygon","coordinates":[[[[139.103,35.187],[139.137,35.179],[139.145,35.169],[139.142,35.153],[139.161,35.141],[139.137,35.148],[139.127,35.159],[139.129,35.166],[139.103,35.187]]]]}},{"type":"Feature","id":"14384","geometry":{"type":"MultiPolygon","coordinates":[[[[139.077,35.2],[139.129,35.166],[139.127,35.159],[139.137,35.148],[139.086,35.141],[139.029,35.151],[139.026,35.176],[139.04,35.177],[139.077,35.2]]]]}},{"type":"Feature","id":"14401","geometry":{"type":"MultiPolygon","coordinates":[[[[139.354,35.528],[139.355,35.519],[139.347,35.517],[139.347,35.499],[139.343,35.499],[139.317,35.509],[139.307,35.523],[139.27,35.507],[139.246,35.532],[139.25,35.547],[139.278,35.546],[139.286,35.556],[139.294,35.557],[139.316,35.539],[139.325,35.544],[139.354,35.528]]]]}},{"type":"Feature","id":"14402","geometry":{"type":"MultiPolygon","coordinates":[[[[139.248,35.542],[139.252,35.523],[139.264,35.51],[139.276,35.507],[139.298,35.479],[139.294,35.462],[139.245,35.463],[139.228,35.452],[139.228,35.457],[139.204,35.46],[139.195,35.449],[139.18,35.448],[139.164,35.454],[139.166,35.481],[139.223,35.529],[139.219,35.534],[139.232,35.532],[139.248,35.542]]]]}}]};
const lat0 = 35.95, lon0 = 139.6, K = Math.cos(lat0*Math.PI/180);
const W = 1000, HH = 820;
// planar projection fitted to Kanto bbox
const bx=[138.4,140.9], by=[34.85,37.2];
const s = Math.min(W/((bx[1]-bx[0])*K), HH/(by[1]-by[0]))*0.98;
const ox = (W - (bx[1]-bx[0])*K*s)/2, oy = (HH - (by[1]-by[0])*s)/2;
const px = (lon,lat)=>[ox+(lon-bx[0])*K*s, oy+(by[1]-lat)*s];
const proj = d3.geoTransform({point:function(x,y){const p=px(x,y);this.stream.point(p[0],p[1]);}});
const path = d3.geoPath(proj);
const kmPerPx = 111.32/s; // 1 degree lat = 111.32km

const svg = d3.select('#map'), g = svg.append('g');
const gm = g.append('g'), gp = g.append('g'), gr = g.append('g'), gd = g.append('g');
gm.selectAll('path').data(GEO.features).join('path').attr('class','muni').attr('d',path);
gp.selectAll('path').data(PREFS.features).join('path').attr('class','pref').attr('d',path);

const pts = H.map((h,i)=>{const p=px(h[8],h[9]);return {i,n:h[0],pref:h[1],city:h[2],area:h[3],beds:h[4],kind:h[5],score:h[6],rank:h[7],x:p[0],y:p[1]}});
let showAll = true, selArea = null, picked = null, k = 1;
const dots = gd.selectAll('circle').data(pts.slice().sort((a,b)=>(a.rank?1:0)-(b.rank?1:0))).join('circle')
  .attr('class',d=>'dot '+(d.rank?'top':'other')).attr('cx',d=>d.x).attr('cy',d=>d.y);
function r(d){return (d.rank?3.4:2.4)/Math.pow(k,0.8);}
function render(){
  gp.selectAll('path').style('stroke-width',(1.2/k)+'px');
  gm.selectAll('path').style('stroke-width',(0.6/k)+'px');
  dots.attr('r',d=>(picked&&d.i===picked.i)?r(d)*1.6:r(d))
    .attr('display',d=>(!showAll && !d.rank)?'none':null)
    .classed('sel',d=>selArea && d.area===selArea)
    .classed('on',d=>picked && d.i===picked.i)
    .style('stroke-width',d=>(picked&&d.i===picked.i)?(2/Math.pow(k,0.8))+'px':(0.8/Math.pow(k,0.8))+'px');
  gr.selectAll('*').remove();
  if (picked){
    [5,10,20].forEach(km=>{
      const rr = km/kmPerPx;
      gr.append('circle').attr('class','ring').attr('cx',picked.x).attr('cy',picked.y).attr('r',rr).style('stroke-width',(1.4/k)+'px').style('stroke-dasharray',(5/k)+' '+(4/k));
      gr.append('text').attr('class','ringlabel').attr('x',picked.x).attr('y',picked.y-rr-3/k).attr('text-anchor','middle').style('font-size',(11/k)+'px').style('stroke-width',(3/k)+'px').text(km+'km');
    });
  }
}
const zoom = d3.zoom().scaleExtent([1,24]).translateExtent([[0,0],[W,HH]]).on('zoom',e=>{k=e.transform.k;g.attr('transform',e.transform);render();});
svg.call(zoom);
d3.select('#zin').on('click',()=>svg.transition().duration(250).call(zoom.scaleBy,1.6));
d3.select('#zout').on('click',()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6));
d3.select('#zreset').on('click',()=>{selArea=null;picked=null;syncAreas();showPicked();svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);});

const tip = document.getElementById('tip'), box = document.getElementById('mapbox');
function rankText(d){return d.rank?('上位150（'+d.rank+'）'):'上位150外';}
dots.on('mouseenter',(e,d)=>{tip.innerHTML='';const b=document.createElement('b');b.textContent=d.n;tip.appendChild(b);
  const s1=document.createElement('span');s1.textContent=d.pref+d.city+'｜'+d.beds+'床｜'+d.kind;tip.appendChild(s1);tip.appendChild(document.createElement('br'));
  const s2=document.createElement('span');s2.textContent=d.area+'｜'+d.score+'点｜'+rankText(d);tip.appendChild(s2);tip.hidden=false;})
  .on('mousemove',e=>{const rc=box.getBoundingClientRect();let x=e.clientX-rc.left+14,y=e.clientY-rc.top+14;if(x>rc.width-290)x=e.clientX-rc.left-290;tip.style.left=x+'px';tip.style.top=y+'px';})
  .on('mouseleave',()=>{tip.hidden=true;})
  .on('click',(e,d)=>{e.stopPropagation();picked=(picked&&picked.i===d.i)?null:d;showPicked();render();});
svg.on('click',()=>{if(picked){picked=null;showPicked();render();}});

const pk = document.getElementById('picked');
function showPicked(){
  if(!picked){pk.hidden=true;return;}
  pk.hidden=false;pk.innerHTML='';
  const b=document.createElement('b');b.textContent=picked.n;pk.appendChild(b);
  const near = pts.filter(p=>p.i!==picked.i && (showAll||p.rank)).map(p=>({p,km:Math.hypot(p.x-picked.x,p.y-picked.y)*kmPerPx}));
  const c5=near.filter(o=>o.km<=5).length,c10=near.filter(o=>o.km<=10).length,c20=near.filter(o=>o.km<=20).length;
  const t5=near.filter(o=>o.km<=10&&o.p.rank).length;
  const lines=[picked.pref+picked.city+'｜'+picked.beds+'床｜'+picked.kind, picked.area+'｜'+picked.score+'点｜'+rankText(picked),
    '半径5km '+c5+'件／10km '+c10+'件／20km '+c20+'件', '10km以内の上位150：'+t5+'件'];
  lines.forEach(t=>{const s=document.createElement('div');s.textContent=t;pk.appendChild(s);});
}

const areaStats = d3.rollups(pts, v=>({top:v.filter(d=>d.rank).length, all:v.length, xs:d3.extent(v,d=>d.x), ys:d3.extent(v,d=>d.y)}), d=>d.area)
  .sort((a,b)=>b[1].top-a[1].top||b[1].all-a[1].all);
const ul = document.getElementById('areas');
areaStats.forEach(([name,st])=>{
  const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.dataset.a=name;b.setAttribute('aria-pressed','false');
  const a=document.createElement('span');a.textContent=name;const n1=document.createElement('span');n1.className='n1';n1.textContent=st.top;const n2=document.createElement('span');n2.className='n2';n2.textContent=st.all;
  b.append(a,n1,n2);b.addEventListener('click',()=>{
    if(selArea===name){selArea=null;syncAreas();render();return;}
    selArea=name;syncAreas();render();});
  li.appendChild(b);ul.appendChild(li);});
function syncAreas(){ul.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.a===selArea?'true':'false'));}
function setShow(all){showAll=all;document.getElementById('showAll').setAttribute('aria-pressed',all);document.getElementById('showTop').setAttribute('aria-pressed',!all);showPicked();render();}
document.getElementById('showAll').addEventListener('click',()=>setShow(true));
document.getElementById('showTop').addEventListener('click',()=>setShow(false));
render();
})();
</script>
