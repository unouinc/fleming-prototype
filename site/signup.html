<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>ナスリー 登録・ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F7}
a{color:#1D1D1F}a:hover{color:#6E6E73}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #1D1D1F;outline-offset:2px}
@media (max-width: 760px){
  .hdr{padding:0 16px!important;height:56px!important}
  .su-wrap{padding:20px 16px 48px!important}
  .su-card{padding:24px 20px!important}
  .su-title{font-size:22px!important}
}
.tabbar{display:none}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .su-wrap{padding-bottom:110px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important}
  .pagetitle{font-size:20px!important}
  .hero{height:240px!important}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E5E5EA;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E5E5EA">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" aria-label="ナスリー トップへ" style="display: flex; flex-direction: row; align-items: center; gap: 10px; text-decoration: none; flex: 0 1 auto; min-width: 0; line-height: 1.2"><svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true" style="flex: 0 0 auto; display: block"><path fill-rule="evenodd" fill="#3A6CF2" d="M40.00,6.00 Q40,0 46.00,0.00 L74.00,0.00 Q80,0 80.00,6.00 L80.00,39.00 Q80,40 81.00,40.00 L114.00,40.00 Q120,40 120.00,46.00 L120.00,74.00 Q120,80 114.00,80.00 L81.00,80.00 Q80,80 80.00,81.00 L80.00,114.00 Q80,120 74.00,120.00 L46.00,120.00 Q40,120 40.00,114.00 L40.00,81.00 Q40,80 39.00,80.00 L6.00,80.00 Q0,80 0.00,74.00 L0.00,46.00 Q0,40 6.00,40.00 L39.00,40.00 Q40,40 40.00,39.00 Z M45.00,43.00 Q43,43 43.00,45.00 L43.00,75.00 Q43,77 45.00,77.00 L75.00,77.00 Q77,77 77.00,75.00 L77.00,45.00 Q77,43 75.00,43.00 Z"></path></svg><span style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0">
        <span class="brand-concept" style="font-size: 10px; font-weight: 500; color: #6E6E73; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">職場がみえる 看護師のための転職プラットフォーム</span>
        <span role="img" aria-label="ナスリー" style="display: block; color: #1D1D1F; margin-top: 2px"><svg width="86" height="19" viewBox="100 5 3850 855" aria-hidden="true" style="display: block"><g transform="translate(0,800) scale(1,-1)" fill="currentColor"><path d="M458,775 Q458,791 474,791 H580 Q596,791 596,775 V34 Q596,-56 506,-56 H246 Q230,-56 230,-40 V66 Q230,82 246,82 H446 Q458,82 458,94 Z"/><path d="M120,436 H935 Q951,436 951,452 V558 Q951,574 935,574 H120 Q104,574 104,558 V452 Q104,436 120,436 Z"/><path transform="translate(1040,0)" d="M834 678Q828 669 816.5 650.0Q805 631 799 615Q778 568 747.5 510.0Q717 452 678.5 393.5Q640 335 597 284Q541 221 473.5 159.5Q406 98 331.5 46.5Q257 -5 179 -42L76 66Q157 97 233.0 144.0Q309 191 374.0 246.0Q439 301 486 353Q519 391 548.5 434.0Q578 477 601.0 519.5Q624 562 635 598Q625 598 599.0 598.0Q573 598 538.5 598.0Q504 598 466.0 598.0Q428 598 393.5 598.0Q359 598 333.0 598.0Q307 598 296 598Q275 598 252.0 596.5Q229 595 208.5 593.5Q188 592 177 591V733Q192 732 214.0 730.0Q236 728 258.5 727.0Q281 726 296 726Q309 726 337.0 726.0Q365 726 401.0 726.0Q437 726 475.5 726.0Q514 726 549.5 726.0Q585 726 611.0 726.0Q637 726 649 726Q682 726 709.5 730.0Q737 734 752 739ZM610 367Q649 336 693.0 295.0Q737 254 780.0 210.0Q823 166 859.5 125.5Q896 85 921 55L807 -44Q770 7 722.5 62.0Q675 117 622.5 171.5Q570 226 516 275Z"/><path transform="translate(2080,0)" d="M803 776Q802 755 800.5 730.5Q799 706 799 676Q799 650 799.0 613.0Q799 576 799.0 539.5Q799 503 799 478Q799 398 791.5 338.0Q784 278 769.0 233.0Q754 188 732.5 153.5Q711 119 683 88Q650 52 607.0 23.5Q564 -5 520.5 -24.5Q477 -44 440 -56L335 54Q410 71 470.5 101.5Q531 132 576 180Q602 209 618.0 238.0Q634 267 642.5 302.5Q651 338 654.5 383.0Q658 428 658 486Q658 512 658.0 548.0Q658 584 658.0 619.0Q658 654 658 676Q658 706 656.5 730.5Q655 755 652 776ZM339 768Q338 750 337.0 732.5Q336 715 336 691Q336 680 336.0 655.0Q336 630 336.0 596.5Q336 563 336.0 526.5Q336 490 336.0 456.0Q336 422 336.0 394.5Q336 367 336 353Q336 334 337.0 309.0Q338 284 339 266H194Q195 280 197.0 306.0Q199 332 199 354Q199 368 199.0 395.0Q199 422 199.0 456.5Q199 491 199.0 527.5Q199 564 199.0 597.0Q199 630 199.0 655.0Q199 680 199 691Q199 705 198.0 727.5Q197 750 195 768Z"/><path transform="translate(3120,0)" d="M92 463Q110 462 138.0 460.5Q166 459 196.5 458.0Q227 457 253 457Q278 457 315.0 457.0Q352 457 395.5 457.0Q439 457 485.5 457.0Q532 457 578.0 457.0Q624 457 665.0 457.0Q706 457 738.5 457.0Q771 457 790 457Q825 457 856.0 459.5Q887 462 907 463V306Q890 307 856.0 309.0Q822 311 790 311Q771 311 738.0 311.0Q705 311 664.0 311.0Q623 311 577.5 311.0Q532 311 485.0 311.0Q438 311 394.5 311.0Q351 311 314.5 311.0Q278 311 253 311Q210 311 165.0 309.5Q120 308 92 306Z"/></g></svg></span></span>
      </a>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg>メッセージ<span style="background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #E8E8ED; color: #86868B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>
  <main class="su-wrap" style="flex: 1 1 auto; padding: 48px 32px 80px; box-sizing: border-box; display: flex; justify-content: center; align-items: flex-start">
    <div class="su-card" style="width: 100%; max-width: 520px; background: #FFFFFF; border: 1px solid #E5E5EA; border-radius: 18px; padding: 36px 36px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; gap: 6px" aria-hidden="true">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="flex: 1; height: 4px; border-radius: 4px; background: {{d.bg}}"></span></sc-for>
      </div>

      <sc-if value="{{isEmail}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h1 class="su-title" style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.4">{{suTitle}}</h1>
          <p style="margin: 0; font-size: 14px; line-height: 1.8; color: #424245">{{lead}}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="su-email" style="font-size: 14px; font-weight: 700">メールアドレス</label>
          <input id="su-email" type="email" inputmode="email" autocomplete="email" value="{{email}}" onInput="{{setEmail}}" placeholder="例：nurse@example.com" style="font-family: inherit; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1.5px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; min-width: 0; width: 100%; box-sizing: border-box">
          <span style="font-size: 12px; line-height: 1.7; color: #6E6E73">パスワードは不要です。届いたメールのリンクを押すだけで進めます。</span>
        </div>
        <sc-if value="{{showAgree}}" hint-placeholder-val="{{true}}"><label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.7; cursor: pointer">
          <input id="su-agree" type="checkbox" checked="{{agree}}" onChange="{{toggleAgree}}" style="width: 20px; height: 20px; margin: 2px 0 0; flex: 0 0 auto; accent-color: #1D1D1F">
          <span><a href="terms.html" target="_blank" rel="noopener" style="color: #1D1D1F">利用規約</a>と<a href="privacy.html" target="_blank" rel="noopener" style="color: #1D1D1F">プライバシーポリシー</a>に同意します</span>
        </label></sc-if>
        <sc-if value="{{err}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 13px; line-height: 1.6; color: #B3261E">{{err}}</span></sc-if>
        <button type="button" onClick="{{sendLink}}" style="border: none; background: #1D1D1F; color: #FFFFFF; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 700; padding: 14px; min-height: 52px; cursor: pointer; width: 100%">{{emailBtn}}</button>
        <sc-if value="{{isLogin}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 1.7; color: #6E6E73">ログインすると、<a href="terms.html" target="_blank" rel="noopener" style="color: #1D1D1F">利用規約</a>と<a href="privacy.html" target="_blank" rel="noopener" style="color: #1D1D1F">プライバシーポリシー</a>に同意したものとみなします。</span></sc-if>
        <button type="button" onClick="{{switchMode}}" style="align-self: center; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #1D1D1F; text-decoration: underline; cursor: pointer; min-height: 44px">{{switchLabel}}</button>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.7; color: #424245; border-top: 1px solid #E5E5EA; padding-top: 18px">
          <li>・看護師の方は無料で使えます</li>
          <li>・電話番号の登録はありません。電話はかかってきません</li>
          <li>・気になる病院の人に、応募の前に話を聞けます</li>
        </ul>
      </sc-if>

      <sc-if value="{{isSent}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; padding: 8px 0">
          <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #F5F5F7; color: #1D1D1F; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg></span>
          <h1 class="su-title" style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.4">メールを送りました</h1>
          <p style="margin: 0; font-size: 14px; line-height: 1.9; color: #424245"><span style="font-weight: 700; word-break: break-all">{{emailShown}}</span> に届いたメールのリンクを押すと、登録の続きに進みます。</p>
          <p style="margin: 0; font-size: 12px; line-height: 1.8; color: #6E6E73">数分たっても届かないときは、迷惑メールフォルダをご確認ください。<br>メールは、この端末・このブラウザで開いてください。</p>
          <button type="button" onClick="{{backToEmail}}" style="border: 1px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; font-family: inherit; font-size: 14px; padding: 12px 20px; min-height: 48px; cursor: pointer">メールアドレスを入れ直す</button>
          <sc-if value="{{isProto}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{skipToProfile}}" style="border: none; background: none; color: #1D1D1F; font-family: inherit; font-size: 13px; font-weight: 700; padding: 10px; min-height: 44px; cursor: pointer; text-decoration: underline">（試作用）リンクを押した後の画面へ</button></sc-if>
        </div>
      </sc-if>

      <sc-if value="{{isProfile}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <h1 class="su-title" style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.4">プロフィールを登録</h1>
          <p style="margin: 0; font-size: 14px; line-height: 1.8; color: #424245">{{profileLead}}</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="su-name" style="font-size: 14px; font-weight: 700">お名前</label>
          <input id="su-name" type="text" autocomplete="name" value="{{name}}" onInput="{{setName}}" placeholder="例：山田 花子" style="font-family: inherit; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1.5px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; min-width: 0; width: 100%; box-sizing: border-box">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="su-photo-l" style="font-size: 14px; font-weight: 700">顔写真</span>
          <div style="display: flex; align-items: center; gap: 16px">
            <sc-if value="{{photo}}" hint-placeholder-val="{{false}}"><img src="{{photo}}" alt="選んだ写真" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; background: #F5F5F7"></sc-if>
            <sc-if value="{{noPhoto}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; background: #F5F5F7; border: 1.5px dashed #D2D2D7; box-sizing: border-box; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #86868B"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"></path></svg></span></sc-if>
            <label for="su-photo" style="border: 1px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; font-size: 14px; font-weight: 700; padding: 10px 18px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; cursor: pointer">{{photoBtn}}</label>
            <input id="su-photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" aria-labelledby="su-photo-l" onChange="{{pickPhoto}}" style="position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden">
          </div>
          <span style="font-size: 12px; line-height: 1.7; color: #6E6E73">話を聞きたい病院の人にだけ見えます。顔がわかる、明るい写真がおすすめです。</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="su-lic-l" style="font-size: 14px; font-weight: 700">資格</span>
          <div role="group" aria-labelledby="su-lic-l" style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{licenses}}" as="l" hint-placeholder-count="2"><button type="button" aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="flex: 1 1 120px; border: 1.5px solid {{l.border}}; background: {{l.bg}}; color: #1D1D1F; border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 700; padding: 12px; min-height: 48px; cursor: pointer">{{l.label}}</button></sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="su-years" style="font-size: 14px; font-weight: 700">看護師としての経験年数</label>
          <div style="display: flex; align-items: center; gap: 10px">
            <input id="su-years" type="text" inputmode="numeric" value="{{years}}" onInput="{{setYears}}" placeholder="例：3" style="font-family: inherit; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1.5px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; min-width: 0; width: 100%; box-sizing: border-box; max-width: 120px">
            <span style="font-size: 15px">年目</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="su-station" style="font-size: 14px; font-weight: 700">最寄駅</label>
          <input id="su-station" type="text" value="{{station}}" onInput="{{setStation}}" placeholder="例：上大岡" style="font-family: inherit; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1.5px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; min-width: 0; width: 100%; box-sizing: border-box">
          <span style="font-size: 12px; line-height: 1.7; color: #6E6E73">通える範囲の病院をお知らせするために使います。</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="su-work" style="font-size: 14px; font-weight: 700">いまの職場<span style="font-weight: 500; color: #6E6E73">（任意）</span></label>
          <input id="su-work" type="text" value="{{workplace}}" onInput="{{setWorkplace}}" placeholder="例：急性期・内科病棟" style="font-family: inherit; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 1.5px solid #D2D2D7; background: #FFFFFF; color: #1D1D1F; min-width: 0; width: 100%; box-sizing: border-box">
          <span style="font-size: 12px; line-height: 1.7; color: #6E6E73">病院名は書かなくて大丈夫です。</span>
        </div>
        <sc-if value="{{err}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 13px; line-height: 1.6; color: #B3261E">{{err}}</span></sc-if>
        <button type="button" onClick="{{saveProfile}}" style="border: none; background: #1D1D1F; color: #FFFFFF; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 700; padding: 14px; min-height: 52px; cursor: pointer; width: 100%">{{profileBtn}}</button>
      </sc-if>

      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; padding: 8px 0">
          <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #F5F5F7; color: #1D1D1F; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          <h1 class="su-title" style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.4">登録が完了しました</h1>
          <p style="margin: 0; font-size: 14px; line-height: 1.9; color: #424245">気になる病院を見つけたら、「話を聞きに行きたい」を押してください。</p>
          <a href="index.html" style="width: 100%; text-decoration: none; background: #1D1D1F; color: #FFFFFF; border-radius: 999px; font-size: 16px; font-weight: 700; padding: 14px; min-height: 52px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">求人をさがす</a>
        </div>
      </sc-if>
    </div>
  </main>
  <nav class="tabbar" aria-label="モバイルナビゲーション">
    <a href="index.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
    <a href="scouts.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg><span style="position: absolute; top: 2px; left: calc(50% + 6px); background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 10px; padding: 1px 6px; border-radius: 999px">3</span>メッセージ</a>
    <a href="profile.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>プロフィール</a>

</div>
</template>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    const demo = !!(p && p.step);
    this.state = { mode: (typeof location !== 'undefined' && /login/.test(location.hash)) ? 'login' : 'signup', step: (p && p.step) || 0, email: demo ? 'misaki@example.com' : '', agree: demo, busy: false, err: '', name: '', license: 0, years: '', station: '', workplace: '', photo: '', needPhoto: false };
    this.N = (typeof window !== 'undefined' && window.Nasuri && window.Nasuri.enabled) ? window.Nasuri : null;
    if (this.N && typeof location !== 'undefined' && /error_code=/.test(location.hash)) {
      this.state.err = /expired|invalid|not_found/.test(location.hash) ? 'ログイン用のリンクの有効期限が切れているか、すでに使われています。もう一度リンクを送ってください。' : 'ログインできませんでした。もう一度リンクを送ってください。';
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
    if (this.N) {
      const sync = () => {
        const pr = this.N.profile;
        if (this.N.session && pr && pr.avatar_path && /edit/.test(location.hash)) {
          this.setState({ step: 2, editing: true, name: pr.name || '', license: pr.license === '准看護師' ? 1 : 0, years: pr.years ? String(pr.years) : '', station: pr.station || '', workplace: pr.workplace || '' });
          this.N.avatarUrl(pr.avatar_path).then((u) => { if (u && !this.photoFile) this.setState({ photo: u }); });
        }
        else if (this.N.session && pr && pr.avatar_path) this.finish();
        else if (this.N.session && pr) this.setState({ step: 2, needPhoto: true, name: pr.name || '', license: pr.license === '准看護師' ? 1 : 0, years: pr.years ? String(pr.years) : '', station: pr.station || '', workplace: pr.workplace || '' });
        else if (this.N.session) this.setState({ step: 2 });
      };
      if (this.N.ready) setTimeout(sync, 0); else window.addEventListener('nasuri:ready', sync);
    }
  }
  finish() {
    this.N.flushPending().then((url) => { if (url) location.href = url; else this.setState({ step: 3, busy: false }); })
      .catch(() => this.setState({ step: 3, busy: false }));
  }
  renderVals() {
    const st = this.state, N = this.N;
    const licDefs = ['正看護師', '准看護師'];
    const pending = !!(N && N.hasPending && N.hasPending());
    const fail = (e) => this.setState({ busy: false, err: (e && (e.status === 429 || /rate limit/i.test(e.message || ''))) ? '短い時間にメールを送りすぎたため、いまは送れません。1時間ほどおいてから、もう一度お試しください。' : 'うまく送れませんでした。時間をおいて、もう一度お試しください。' });
    return {
      suTitle: st.mode === 'login' ? 'ログイン' : '無料で新規登録', isLogin: st.mode === 'login', showAgree: st.mode !== 'login',
      switchLabel: st.mode === 'login' ? 'はじめての方は、新規登録' : 'すでに登録済みの方は、ログイン',
      switchMode: () => this.setState({ mode: st.mode === 'login' ? 'signup' : 'login', err: '' }),
      isEmail: st.step === 0, isSent: st.step === 1, isProfile: st.step === 2, isDone: st.step === 3, isProto: !N,
      dots: [0, 1, 2].map((i) => ({ bg: Math.min(st.step, 2) >= i ? '#1D1D1F' : '#E5E5EA' })),
      lead: pending ? '「話を聞きたい」を送る前に、かんたんな登録をお願いします。登録が終わると、そのまま送信されます。' : st.mode === 'login' ? '登録したメールアドレスを入れてください。ログイン用のリンクをお送りします。' : 'メールアドレスだけで始められます。届いたメールのリンクから、プロフィールの登録に進みます。',
      email: st.email, emailShown: st.email || 'ご入力のメールアドレス', agree: st.agree, err: st.err || '',
      setEmail: (e) => this.setState({ email: e.target.value }), toggleAgree: () => this.setState({ agree: !st.agree }),
      emailBtn: st.busy ? '送信中…' : st.mode === 'login' ? 'ログイン用のリンクを送る' : '登録用のリンクを送る',
      sendLink: () => {
        if (st.busy) return;
        const email = (st.email || '').trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return this.setState({ err: 'メールアドレスを確認してください。' });
        if (st.mode !== 'login' && !st.agree) return this.setState({ err: '利用規約とプライバシーポリシーへの同意が必要です。' });
        if (!N) return this.setState({ step: 1, err: '' });
        this.setState({ busy: true, err: '' });
        N.signIn(email).then(() => this.setState({ step: 1, busy: false })).catch(fail);
      },
      backToEmail: () => this.setState({ step: 0, err: '' }), skipToProfile: () => this.setState({ step: 2, err: '' }),
      photo: st.photo, noPhoto: !st.photo, photoBtn: st.photo ? '写真を選び直す' : '写真を選ぶ',
      profileLead: st.editing ? '登録した内容を変更できます。写真を変えるときだけ、新しい写真を選んでください。' : st.needPhoto ? '顔写真の登録をお願いします。写真を選んで「登録する」を押すと、登録が完了します。' : '話を聞きたい病院にだけ届く情報です。1分ほどで終わります。',
      pickPhoto: (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        if (!/^image\//.test(f.type) && !/\.(heic|heif)$/i.test(f.name)) return this.setState({ err: '画像ファイルを選んでください。' });
        if (f.size > 20 * 1024 * 1024) return this.setState({ err: '写真のサイズが大きすぎます（20MBまで）。' });
        this.photoFile = f;
        this.setState({ photo: URL.createObjectURL(f), err: '' });
      },
      name: st.name, years: st.years, station: st.station, workplace: st.workplace,
      setName: (e) => this.setState({ name: e.target.value }), setYears: (e) => this.setState({ years: e.target.value.replace(/[^0-9]/g, '').slice(0, 2) }),
      setStation: (e) => this.setState({ station: e.target.value }), setWorkplace: (e) => this.setState({ workplace: e.target.value }),
      licenses: licDefs.map((label, i) => ({ label, on: st.license === i, pick: () => this.setState({ license: i }), border: st.license === i ? '#1D1D1F' : '#D2D2D7', bg: st.license === i ? '#F5F5F7' : '#FFFFFF' })),
      profileBtn: st.busy ? '保存中…' : st.editing ? '変更を保存する' : (pending ? '登録して「話を聞きたい」を送る' : '登録する'),
      saveProfile: () => {
        if (st.busy) return;
        const name = st.name.trim(), station = st.station.trim().replace(/駅$/, ''), years = parseInt(st.years, 10);
        if (!name) return this.setState({ err: 'お名前を入力してください。' });
        if (!(years >= 1)) return this.setState({ err: '経験年数を数字で入力してください（1年目なら 1）。' });
        if (!station) return this.setState({ err: '最寄駅を入力してください。' });
        if (!st.photo || (!this.photoFile && !st.editing)) return this.setState({ err: '顔写真を選んでください。' });
        if (!N) return this.setState({ step: 3, err: '' });
        this.setState({ busy: true, err: '' });
        Promise.resolve().then(() => this.photoFile ? N.uploadAvatar(this.photoFile) : N.profile.avatar_path)
          .then((avatar_path) => N.saveProfile({ name, license: licDefs[st.license], years, station, workplace: st.workplace.trim(), avatar_path }))
          .then(() => { if (st.editing) location.href = 'profile.html'; else this.finish(); })
          .catch(() => this.setState({ busy: false, err: '写真をアップロードできませんでした。別の写真を選ぶか、時間をおいてもう一度お試しください。' }));
      }
    };
  }
}
mount(Component, 'tpl', 'app');
</script>
