<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleming スカウト・メッセージ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1A1A1A}a:hover{color:#3A63F4}
.tabbar{display:none}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important}
  .pagetitle{font-size:20px!important}
  .hero{height:240px!important}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E3E0D8;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F6F5F1; color: #1A1A1A; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E0D8">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 0 0 auto">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #3A63F4; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #FFD338"></span></span>
        <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.4px">Fleming</span>
      </a>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 4px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">さがす</a>
        <a href="scouts.html" aria-current="page" style="text-decoration: none; padding: 10px 14px; border-radius: 4px; background: #3B4654; color: #FFFFFF; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">スカウト<span style="background: #3A63F4; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #DAD6CC; color: #6B675E; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 900"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>

  <div class="wrap" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 28px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <h1 class="pagetitle" style="margin: 0; font-size: 26px; font-weight: 900">スカウト・メッセージ</h1>
      <div style="display: flex; gap: 4px; background: #FFFFFF; border-radius: 8px; padding: 4px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button type="button" onClick="{{f.pick}}" style="border: none; background: {{f.bg}}; color: {{f.fg}}; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 18px; min-height: 40px; cursor: pointer">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <!-- Thread list -->
      <nav aria-label="スレッド" style="flex: 1 1 360px; min-width: 300px; max-width: 460px; background: #FFFFFF; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
        <sc-for list="{{threads}}" as="t" hint-placeholder-count="5">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="border: none; border-bottom: 1px solid #EDEAE2; background: {{t.bg}}; text-align: left; font-family: inherit; padding: 16px 20px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; min-height: 44px">
            <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 6px; background: {{t.color}}; flex: 0 0 auto"></span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 auto">
              <span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
                <span style="font-size: 14px; font-weight: 900; color: #1A1A1A">{{t.org}}</span>
                <span style="font-size: 11px; font-weight: 700; color: #5C5C5C; flex: 0 0 auto">{{t.when}}</span>
              </span>
              <span style="font-size: 12px; font-weight: 700; color: {{t.kindColor}}">{{t.kind}}</span>
              <span style="font-size: 13px; line-height: 1.6; color: #3D3D3D; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{t.preview}}</span>
            </span>
            <sc-if value="{{t.unread}}" hint-placeholder-val="{{false}}">
              <span aria-label="未読" style="width: 10px; height: 10px; border-radius: 50%; background: #3A63F4; flex: 0 0 auto; margin-top: 6px"></span>
            </sc-if>
          </button>
        </sc-for>
      </nav>

      <!-- Thread detail -->
      <section aria-label="メッセージ" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
        <div style="padding: 20px 24px; border-bottom: 1px solid #EDEAE2; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 6px; background: {{cur.color}}; flex: 0 0 auto"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 200px; min-width: 0">
            <span style="font-size: 17px; font-weight: 900">{{cur.org}}</span>
            <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">{{cur.from}}</span>
          </div>
          <a href="job.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px; background: #F6F5F1; border-radius: 4px; padding: 8px 8px 8px 16px; min-height: 44px; box-sizing: border-box">
            <span style="font-size: 12px; font-weight: 700; background: #FFFFFF; border-radius: 999px; padding: 6px 12px">職場ページ →</span>
          </a>
        </div>

        <div style="padding: 24px; display: flex; flex-direction: column; gap: 18px; background: #FBFAF7; min-height: 420px">
          <sc-if value="{{cur.hasEntry}}" hint-placeholder-val="{{true}}">
            <div style="align-self: center; width: 100%; max-width: 520px; box-sizing: border-box; background: #EEF2FF; border-radius: 8px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 13px; font-weight: 700; color: #3A63F4">「話を聞きたい」を送りました・{{cur.entryAt}}</span>
              <sc-for list="{{cur.entry}}" as="r" hint-placeholder-count="4">
                <div style="display: grid; grid-template-columns: 6.5em 1fr; gap: 12px; font-size: 13px; line-height: 1.7"><span style="color: #5C5C5C">{{r.k}}</span><span style="font-weight: 700">{{r.v}}</span></div>
              </sc-for>
            </div>
          </sc-if>
          <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 6px; align-items: {{m.align}}">
              <span style="font-size: 11px; font-weight: 700; color: #5C5C5C">{{m.who}}・{{m.at}}</span>
              <div style="max-width: 78%; background: {{m.bg}}; color: {{m.fg}}; border-radius: {{m.radius}}; padding: 14px 18px; font-size: 14px; line-height: 1.8; white-space: pre-line">{{m.text}}</div>
            </div>
          </sc-for>
          <sc-if value="{{offerOpen}}" hint-placeholder-val="{{true}}">
            <div style="align-self: flex-start; max-width: 78%; background: #FFFFFF; border: 2px solid #D9D4C7; border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
              <span style="font-size: 12px; font-weight: 700; color: #3A63F4">病院からの提案</span>
              <span style="font-size: 15px; font-weight: 900">{{cur.offerTitle}}</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap">
                <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
                  <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; border-radius: 4px; font-family: inherit; font-size: 13px; font-weight: 700; padding: 10px 14px; min-height: 40px; cursor: pointer">{{s.label}}</button>
                </sc-for>
              </div>
              <sc-if value="{{picked}}" hint-placeholder-val="{{false}}">
                <button type="button" onClick="{{confirmSlot}}" style="align-self: flex-start; border: none; background: #3B4654; color: #FFFFFF; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 18px; min-height: 44px; cursor: pointer">{{confirmLabel}}</button>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{showConfirm}}" hint-placeholder-val="{{false}}">
            <div style="align-self: center; width: 100%; max-width: 520px; box-sizing: border-box; background: #FFFFFF; border: 2px solid #3A63F4; border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 12px; font-weight: 700; color: #3A63F4">カジュアル面談が決まりました</span>
              <span style="font-size: 18px; font-weight: 700">{{pickedLabel}}</span>
              <span style="font-size: 13px; line-height: 1.7; color: #3D3D3D">{{cur.confirmNote}}</span>
              <span style="font-size: 12px; color: #5C5C5C">日程の変更やキャンセルは、このメッセージで伝えられます。</span>
            </div>
          </sc-if>
        </div>

        <form class="pc-only" aria-label="返信" style="padding: 16px 24px 20px; border-top: 1px solid #EDEAE2; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
              <button type="button" style="border: 1.5px solid #D9D4C7; background: #FFFFFF; border-radius: 4px; font-family: inherit; font-size: 12px; font-weight: 700; padding: 8px 12px; min-height: 36px; cursor: pointer">{{q}}</button>
            </sc-for>
          </div>
          <div style="display: flex; gap: 10px; align-items: flex-end">
            <label for="reply" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">返信</label>
            <textarea id="reply" rows="2" placeholder="返信を書く" style="flex: 1 1 auto; min-width: 0; font-family: inherit; font-size: 14px; font-weight: 500; padding: 12px 16px; border-radius: 8px; border: 1.5px solid #D9D4C7; resize: vertical; background: #FFFFFF; color: #1A1A1A"></textarea>
            <button type="button" style="border: none; background: #3B4654; color: #FFFFFF; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 0 22px; min-height: 48px; cursor: pointer; flex: 0 0 auto">送信</button>
          </div>
          <span style="font-size: 11px; color: #5C5C5C">スカウトへの返信は匿名のまま送れます。「話を聞きたい」を送った病院には、お名前とプロフィールが届いています。電話番号は届きません。</span>
        </form>
      </section>
    </div>
  </div>
  <nav class="tabbar" aria-label="モバイルナビゲーション">
    <a href="index.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #8A857A; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
    <a href="scouts.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #1A1A1A; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg><span style="position: absolute; top: 2px; left: calc(50% + 6px); background: #3A63F4; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 10px; padding: 1px 6px; border-radius: 999px">3</span>スカウト</a>
    <a href="profile.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #8A857A; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>プロフィール</a>
  </nav>
</div>
</template>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filter: 0, cur: 0, slot: (p && p.booked) ? 1 : -1, sent: !!(p && p.booked) }; }
  renderVals() {
    const filters = ['すべて', 'スカウト', '進行中'].map((label, i) => ({ label, pick: () => this.setState({ filter: i }), bg: this.state.filter === i ? '#3B4654' : 'transparent', fg: this.state.filter === i ? '#FFFFFF' : '#1A1A1A' }));
    const me = (text, at) => ({ who: 'あなた', at, text, align: 'flex-end', bg: '#3B4654', fg: '#FFFFFF', radius: '8px 8px 4px 8px' });
    const them = (who, text, at) => ({ who, at, text, align: 'flex-start', bg: '#FFFFFF', fg: '#1A1A1A', radius: '8px 8px 8px 4px' });
    const data = [
      { org: 'みなと中央病院', from: '内科病棟 師長 高橋', color: '#3A63F4', kind: '進行中｜カジュアル面談', kindColor: '#5C5C5C', when: '1時間前', unread: true, preview: '「話を聞きたい」をありがとうございます。師長の高橋です。残業と夜勤の体制について…', showOffer: true,
        hasEntry: true, entryAt: '昨日 21:40', entry: [{ k: '気持ち', v: 'まずは話を聞いてみたい' }, { k: '話したい人', v: '高橋 恵さん、小林 真央さん' }, { k: '聞きたいこと', v: '実際の残業、夜勤の体制' }, { k: '話し方', v: 'オンライン' }],
        offerTitle: 'オンラインで30分、話しませんか', slotLabels: ['11/18（水）12:30 オンライン', '11/19（木）20:00 オンライン', '別の日程を相談'],
        confirmNote: 'オンライン・30分ほど。高橋（師長）と小林（看護師4年目）がお話しします。参加用のURLは前日にこのメッセージへ届きます。',
        messages: [them('内科病棟 師長 高橋', '佐藤さん、「話を聞きたい」をありがとうございます。みなと中央病院 内科病棟の師長、高橋です。\n残業と夜勤の体制について、実際のところを小林と一緒にお話しします。選考ではないので、気になることは何でも聞いてください。\n\n下の候補から、ご都合のよい日時を選んでいただけますか。', '今日 10:12')] },
      { org: '青葉の森総合病院', from: '外科病棟 師長', color: '#18C29C', kind: 'スカウト', kindColor: '#3A63F4', when: '3時間前', unread: true, preview: 'プロフィールを拝見しました。「受け持ち7人以下」「聞きやすい職場」というご希望、まさに…', showOffer: true,
        offerTitle: '見学 or オンラインで15分、話しませんか', slotLabels: ['11/17（火）15:00 見学', '11/20（金）20:00 オンライン', '別の日程を相談'],
        confirmNote: '15分ほど。外科病棟の師長がお話しします。',
        messages: [them('外科病棟 師長', 'はじめまして。青葉の森総合病院 外科病棟の師長です。\nプロフィールを拝見しました。「受け持ち7人以下」「わからないことを聞きやすい職場」というご希望が、うちの病棟が大事にしてきたことと重なっていて、ご連絡しました。\n\n応募ではなく、まずは見学やオンラインでの雑談からで大丈夫です。', '今日 8:05')] },
      { org: 'さくら台リハビリ病院', from: '看護部 採用担当', color: '#FFD338', kind: 'スカウト', kindColor: '#3A63F4', when: '昨日', unread: true, preview: '日勤のみの働き方に興味はありませんか？託児所もあり、子育て中の看護師が…', showOffer: false,
        messages: [them('看護部 採用担当', '日勤のみの働き方に興味はありませんか？託児所もあり、子育て中の看護師が多い職場です。', '昨日 18:40')] },
      { org: 'ひだまりの郷', from: '施設長', color: '#FF8FB1', kind: '進行中｜見学', kindColor: '#5C5C5C', when: '2日前', unread: false, preview: '11/8の見学、お待ちしています。当日は14時に正面玄関へ…', showOffer: false,
        messages: [me('11/8（土）に見学をお願いできますか。', '3日前 21:05'), them('施設長', 'ありがとうございます！11/8の見学、お待ちしています。当日は14時に正面玄関へお越しください。1時間ほどで、夜勤帯の様子もお話しします。', '2日前 9:30')] },
      { org: '[クリニック名]', from: '院長', color: '#1A1A1A', kind: 'スカウト', kindColor: '#3A63F4', when: '5日前', unread: true, preview: '週3日からの外来勤務にご興味があれば…', showOffer: false,
        messages: [them('院長', '週3日からの外来勤務にご興味があれば、一度お話しできればうれしいです。', '5日前')] },
      { org: 'Fleming 運営', from: 'サポート', color: '#EDEAE2', kind: 'お知らせ', kindColor: '#5C5C5C', when: '1週間前', unread: false, preview: '募集ページの「数字で見る」について。担当患者数と残業時間は…', showOffer: false,
        messages: [them('サポート', '募集ページの「数字で見る」について。担当患者数と残業時間は、病院が申告した直近の実績をFlemingが確認のうえ掲載しています。', '1週間前')] }
    ];
    const threads = data.map((t, i) => Object.assign({}, t, { active: this.state.cur === i, bg: this.state.cur === i ? '#F1F4FF' : '#FFFFFF', pick: () => this.setState({ cur: i, slot: -1, sent: false }) }));
    const st = this.state; const curT = data[st.cur]; const slotLabels = curT.slotLabels || [];
    const slots = slotLabels.map((label, i) => ({ label, on: this.state.slot === i, pick: () => this.setState({ slot: i }), bg: this.state.slot === i ? '#3A63F4' : '#FFFFFF', fg: this.state.slot === i ? '#FFFFFF' : '#1A1A1A', border: this.state.slot === i ? '#3A63F4' : '#D9D4C7' }));
    const sentText = st.slot === 2 ? '別の日程を相談させてください。' : (slotLabels[st.slot] + ' でお願いします。');
    const msgs = st.sent ? curT.messages.concat([me(sentText, 'たった今')]) : curT.messages;
    return { filters, threads, cur: Object.assign({ hasEntry: false, entry: [], entryAt: '', offerTitle: '', confirmNote: '' }, curT), msgs, slots, offerOpen: !!curT.showOffer && !st.sent, picked: st.slot >= 0, pickedLabel: st.slot >= 0 ? slotLabels[st.slot] : '',
      confirmSlot: () => this.setState({ sent: true }), confirmLabel: st.slot === 2 ? '相談を送る' : 'この日程で送る', showConfirm: st.sent && st.slot >= 0 && st.slot < 2,
      quick: ['興味があります。詳しく聞かせてください', '見学できる日を教えてください', '今回は見送ります'] };
  }
}
mount(Component, 'tpl', 'app');
</script>
</body>
</html>
