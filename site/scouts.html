<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>ナスリー メッセージ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F7}
a{color:#1D1D1F}a:hover{color:#6E6E73}
.tabbar{display:none}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important}
  .pagetitle{font-size:20px!important}
  .hero{height:240px!important}
  .th-title{font-size:16px!important}
  .th-img{transform:scale(.8);transform-origin:left center}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E5E5EA;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E5E5EA">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" aria-label="ナスリー トップへ" style="display: flex; flex-direction: row; align-items: center; gap: 10px; text-decoration: none; flex: 0 1 auto; min-width: 0; line-height: 1.2"><svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true" style="flex: 0 0 auto; display: block"><path fill-rule="evenodd" fill="#4F57E3" d="M40.00,6.00 Q40,0 46.00,0.00 L74.00,0.00 Q80,0 80.00,6.00 L80.00,39.00 Q80,40 81.00,40.00 L114.00,40.00 Q120,40 120.00,46.00 L120.00,74.00 Q120,80 114.00,80.00 L81.00,80.00 Q80,80 80.00,81.00 L80.00,114.00 Q80,120 74.00,120.00 L46.00,120.00 Q40,120 40.00,114.00 L40.00,81.00 Q40,80 39.00,80.00 L6.00,80.00 Q0,80 0.00,74.00 L0.00,46.00 Q0,40 6.00,40.00 L39.00,40.00 Q40,40 40.00,39.00 Z M45.00,43.00 Q43,43 43.00,45.00 L43.00,75.00 Q43,77 45.00,77.00 L75.00,77.00 Q77,77 77.00,75.00 L77.00,45.00 Q77,43 75.00,43.00 Z"></path></svg><span style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0">
        <span class="brand-concept" style="font-size: 10px; font-weight: 500; color: #6E6E73; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">職場がみえる 看護師のための転職プラットフォーム</span>
        <span style="font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; font-size: 25px; letter-spacing: -0.01em; line-height: 1; color: #1D1D1F">nasuri</span></span>
      </a>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
        <a href="scouts.html" aria-current="page" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; background: #F5F5F7; color: #1D1D1F; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg>メッセージ<span style="background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #E8E8ED; color: #86868B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>

  <div class="wrap" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 28px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <h1 class="pagetitle" style="margin: 0; font-size: 26px; font-weight: 700">メッセージ</h1>
    </div>

    <sc-if value="{{noThreads}}" hint-placeholder-val="{{false}}">
      <div style="background: #FFFFFF; border-radius: 14px; padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <span style="font-size: 18px; font-weight: 700; color: #1D1D1F">{{emptyTitle}}</span>
        <span style="max-width: 460px; font-size: 14px; line-height: 1.8; color: #6E6E73">{{emptyText}}</span>
        <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center">
          <sc-for list="{{emptyBtns}}" as="b" hint-placeholder-count="2"><button type="button" onClick="{{b.go}}" style="border: 2px solid #1D1D1F; background: {{b.bg}}; color: {{b.fg}}; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 0 24px; min-height: 48px; min-width: 160px; cursor: pointer">{{b.label}}</button></sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{hasThreads}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <!-- Thread list -->
      <nav aria-label="スレッド" style="flex: 1 1 360px; min-width: 300px; max-width: 460px; background: #FFFFFF; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
        <sc-for list="{{threads}}" as="t" hint-placeholder-count="5">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="border: none; border-bottom: 1px solid #E5E5EA; background: {{t.bg}}; text-align: left; font-family: inherit; padding: 16px 20px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; min-height: 44px">
            <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 10px; background: {{t.color}}; flex: 0 0 auto"></span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 auto">
              <span style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
                <span style="font-size: 14px; font-weight: 700; color: #1D1D1F">{{t.org}}</span>
                <span style="font-size: 11px; font-weight: 700; color: #6E6E73; flex: 0 0 auto">{{t.when}}</span>
              </span>
              <span style="font-size: 12px; font-weight: 700; color: {{t.kindColor}}">{{t.kind}}</span>
              <span style="font-size: 13px; line-height: 1.6; color: #424245; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{t.preview}}</span>
            </span>
            <sc-if value="{{t.unread}}" hint-placeholder-val="{{false}}">
              <span aria-label="未読" style="width: 10px; height: 10px; border-radius: 50%; background: #1D1D1F; flex: 0 0 auto; margin-top: 6px"></span>
            </sc-if>
          </button>
        </sc-for>
      </nav>

      <!-- Thread detail -->
      <section aria-label="メッセージ" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden">
        <div style="padding: 24px 28px; border-bottom: 1px solid #E5E5EA; display: flex; align-items: center; gap: 24px">
          <a class="th-img" href="job.html" aria-label="{{cur.org}}の職場ページ" style="position: relative; flex: 0 0 auto; width: 88px; height: 88px; display: block">
            <sc-if value="{{cur.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{cur.img}}" alt="" style="width: 88px; height: 88px; object-fit: cover; border-radius: 10px; display: block"></sc-if>
            <sc-if value="{{cur.noImg}}" hint-placeholder-val="{{false}}"><span style="width: 88px; height: 88px; border-radius: 10px; background: #E8E8ED; display: block"></span></sc-if>
            <span aria-hidden="true" style="position: absolute; right: -10px; bottom: -10px; width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E5E5EA; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1D1D1F">{{cur.initial}}</span>
          </a>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 auto">
            <span style="font-size: 13px; font-weight: 500; color: #424245">{{cur.status}}</span>
            <a class="th-title" href="job.html" style="text-decoration: none; font-size: 20px; font-weight: 700; line-height: 1.45; color: #1D1D1F">{{cur.title}}</a>
            <span style="font-size: 14px; font-weight: 700; color: #86868B">{{cur.org}}</span>
          </div>
        </div>

        <div style="padding: 28px; display: flex; flex-direction: column; gap: 28px; background: #FFFFFF; min-height: 420px">
          <sc-if value="{{cur.hasEntry}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
              <span style="background: #1D1D1F; color: #FFFFFF; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 700">{{cur.feeling}}</span>
              <span style="font-size: 12px; color: #6E6E73; text-align: right">{{cur.entryNote}}</span>
              <span style="font-size: 12px; color: #86868B">{{cur.entryAt}}</span>
            </div>
          </sc-if>
          <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
            <div style="display: flex; gap: 12px; align-items: flex-start; justify-content: {{m.justify}}">
              <sc-if value="{{m.isThem}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #F5F5F7; border: 1px solid #E5E5EA; box-sizing: border-box; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{m.initial}}</span></sc-if>
              <div style="display: flex; flex-direction: column; gap: 6px; align-items: {{m.align}}; max-width: 72%; min-width: 0">
                <sc-if value="{{m.isThem}}" hint-placeholder-val="{{true}}"><span style="font-size: 13px; font-weight: 700; color: #1D1D1F">{{m.who}}</span></sc-if>
                <div style="background: {{m.bg}}; color: {{m.fg}}; border-radius: {{m.radius}}; padding: 16px 20px; font-size: 15px; line-height: 1.9; white-space: pre-line; overflow-wrap: anywhere">{{m.text}}</div>
                <span style="font-size: 11px; color: #86868B">{{m.at}}</span>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{offerOpen}}" hint-placeholder-val="{{true}}">
            <div style="align-self: flex-start; max-width: 78%; background: #FFFFFF; border: 2px solid #D2D2D7; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
              <span style="font-size: 12px; font-weight: 700; color: #1D1D1F">病院からの提案</span>
              <span style="font-size: 15px; font-weight: 700">{{cur.offerTitle}}</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap">
                <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
                  <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 700; padding: 10px 14px; min-height: 40px; cursor: pointer">{{s.label}}</button>
                </sc-for>
              </div>
              <sc-if value="{{picked}}" hint-placeholder-val="{{false}}">
                <button type="button" onClick="{{confirmSlot}}" style="align-self: flex-start; border: none; background: #1D1D1F; color: #FFFFFF; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 18px; min-height: 44px; cursor: pointer">{{confirmLabel}}</button>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{showConfirm}}" hint-placeholder-val="{{false}}">
            <div style="align-self: center; width: 100%; max-width: 520px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D2D2D7; box-shadow: 0 2px 6px rgba(0,0,0,0.04), 0 24px 48px -28px rgba(0,0,0,0.3); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 12px; font-weight: 700; color: #1D1D1F">カジュアル面談が決まりました</span>
              <span style="font-size: 18px; font-weight: 700">{{pickedLabel}}</span>
              <span style="font-size: 13px; line-height: 1.7; color: #424245">{{cur.confirmNote}}</span>
              <span style="font-size: 12px; color: #6E6E73">日程の変更やキャンセルは、このメッセージで伝えられます。</span>
            </div>
          </sc-if>
        </div>

        <form aria-label="返信" style="padding: 12px 24px 20px; display: flex; flex-direction: column; gap: 8px">
          <div style="position: relative; background: #F5F5F7; border-radius: 22px; padding: 14px 68px 14px 22px">
            <label for="reply" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">メッセージ</label>
            <textarea id="reply" rows="3" maxlength="2000" value="{{draft}}" onInput="{{setDraft}}" placeholder="メッセージを入力" style="width: 100%; box-sizing: border-box; border: none; outline: none; background: transparent; resize: vertical; font-family: inherit; font-size: 15px; font-weight: 500; line-height: 1.7; color: #1D1D1F; padding: 0"></textarea>
            <button type="button" onClick="{{send}}" aria-label="{{sendLabel}}" style="position: absolute; right: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; border: none; background: {{sendBg}}; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.99.99 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"></path></svg></button>
          </div>
          <sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 12px; font-weight: 700; color: #C4314B">{{err}}</span></sc-if>
          <span style="font-size: 11px; color: #6E6E73">「話を聞きたい」を送った病院には、お名前とプロフィールが届いています。メールアドレスと電話番号は届きません。</span>
        </form>
      </section>
    </div>
    </sc-if>
  </div>
  <nav class="tabbar" aria-label="モバイルナビゲーション">
    <a href="index.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
    <a href="scouts.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #1D1D1F; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg><span style="position: absolute; top: 2px; left: calc(50% + 6px); background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 10px; padding: 1px 6px; border-radius: 999px">3</span>メッセージ</a>
    <a href="profile.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 10px; font-weight: 700; color: #86868B; min-height: 44px; justify-content: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>プロフィール</a>
  </nav>
</div>
</template>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    const N = window.Nasuri;
    this.live = !!(N && N.enabled);
    this.state = { filter: 0, cur: 0, slot: (p && p.booked) ? 1 : -1, sent: !!(p && p.booked), loading: this.live, threads: [], draft: '', sending: false, err: '' };
    if (this.live) {
      const go = () => this.load(true);
      if (N.ready) setTimeout(go, 0); else window.addEventListener('nasuri:ready', go);
      setInterval(() => { if (!document.hidden && N.session) this.load(false); }, 20000);
    }
  }
  load(first) {
    const N = window.Nasuri;
    if (!N.session) { this.setState({ loading: false, threads: [] }); return; }
    N.loadThreads().then((threads) => {
      let cur = this.state.cur;
      if (first) { const want = Number((location.hash.match(/talk=(\d+)/) || [])[1]); const k = threads.findIndex((x) => x.id === want); if (k >= 0) cur = k; }
      if (cur >= threads.length) cur = 0;
      const t = threads[cur];
      if (t && t.messages.some((m) => m.sender === 'hospital' && !m.read_at)) {
        N.markRead(t.id);
        threads = threads.map((x) => x.id === t.id ? Object.assign({}, x, { messages: x.messages.map((m) => m.sender === 'hospital' && !m.read_at ? Object.assign({}, m, { read_at: new Date().toISOString() }) : m) }) : x);
      }
      this.setState({ loading: false, threads, cur });
    }).catch(() => this.setState({ loading: false, err: '読み込めませんでした。時間をおいて開き直してください。' }));
  }
  send() {
    const N = window.Nasuri, st = this.state, t = st.threads[st.cur];
    const body = (st.draft || '').trim();
    if (!t || !body || st.sending) return;
    if (body.length > 2000) { this.setState({ err: '2000文字以内で送ってください。' }); return; }
    this.setState({ sending: true, err: '' });
    N.sendMessage(t.id, body).then((m) => {
      const threads = this.state.threads.map((x) => x.id === t.id ? Object.assign({}, x, { messages: x.messages.concat([m]) }) : x);
      this.setState({ sending: false, draft: '', threads });
    }).catch(() => this.setState({ sending: false, err: '送信できませんでした。もう一度お試しください。' }));
  }
  decorate(c) {
    const TITLES = { 'みなと中央病院': '「聞きやすさ」で選ばれる内科病棟で、一緒に働く看護師を募集' };
    const IMGS = { 'みなと中央病院': 'images/sns3.jpg' };
    const ent = c.entry || [];
    const get = (k) => (ent.find((r) => r.k === k) || {}).v || '';
    const img = c.img || IMGS[c.org] || '';
    return Object.assign({}, c, {
      status: c.hasEntry ? '「話を聞きたい」を送りました' : (c.kind || 'メッセージ'),
      title: c.title || TITLES[c.org] || c.org || '',
      initial: (c.org || '').slice(0, 1),
      feeling: get('気持ち') || 'まずは話を聞いてみたい',
      entryNote: ent.filter((r) => r.k !== '気持ち').map((r) => r.k + '：' + r.v).join('　'),
      img, hasImg: !!img, noImg: !img
    });
  }
  renderVals() {
    const filters = ['すべて', 'スカウト', '進行中'].map((label, i) => ({ label, pick: () => this.setState({ filter: i }), bg: this.state.filter === i ? '#1D1D1F' : 'transparent', fg: this.state.filter === i ? '#FFFFFF' : '#1D1D1F' }));
    const me = (text, at) => ({ who: 'あなた', at, text, align: 'flex-end', justify: 'flex-end', isThem: false, initial: '', bg: '#1D1D1F', fg: '#FFFFFF', radius: '18px 18px 4px 18px' });
    const them = (who, text, at) => ({ who, at, text, align: 'flex-start', justify: 'flex-start', isThem: true, initial: (who || '').slice(0, 1), bg: '#F5F5F7', fg: '#1D1D1F', radius: '4px 18px 18px 18px' });
    const st = this.state;
    const quick = ['興味があります。詳しく聞かせてください', '見学できる日を教えてください', 'オンラインで話せる日を教えてください'];
    if (this.live) return this.liveVals(filters, me, them, quick);
    const data = [
