<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<meta name="robots" content="noindex, nofollow">
<title>ナスリー 管理画面</title>
<style>
:root{--ink:#1D1D1F;--ink2:#424245;--ink3:#6E6E73;--line:#E5E5EA;--line2:#D2D2D7;--bg:#F5F5F7;--card:#FFFFFF;--err:#B3261E;--ok:#1E7B34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hdr{max-width:1200px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand small{font-size:10px;color:var(--ink3)}
.brand b{font-size:18px}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink3);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600;font-size:13px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1200px;margin:0 auto;padding:24px 24px 64px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.login{max-width:440px;margin:48px auto}
.login h1{font-size:22px;margin:0 0 8px}
.login p{color:var(--ink2);margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700}
.input{border:1.5px solid var(--line2);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;background:#fff}
.msg{font-size:13px;margin-top:12px}
.msg.err{color:var(--err)}
.tabs{display:flex;gap:4px;background:#E8E8ED;border-radius:999px;padding:4px;width:max-content;max-width:100%;margin-bottom:20px}
.tab{border:none;background:none;border-radius:999px;padding:8px 18px;font-weight:700;color:var(--ink3);min-height:40px}
.tab[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--ink);color:#fff;font-size:11px;line-height:20px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.search{margin-left:auto;min-width:220px;flex:0 1 280px;border:1px solid var(--line2);border-radius:999px;padding:8px 14px;background:#fff}
.summary{color:var(--ink3);font-size:13px;margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:12px}
.req{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:20px}
.req h3{margin:0;font-size:16px}
.meta{color:var(--ink3);font-size:12px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#E8E8ED;color:var(--ink)}
.badge.s0{background:#1D1D1F;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;margin-top:6px}
dl{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:4px 12px;margin:12px 0 0}
dt{color:var(--ink3)}
dd{margin:0;word-break:break-word}
.side{display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);padding-left:20px}
.side select,.side textarea{border:1.5px solid var(--line2);border-radius:12px;padding:9px 10px;background:#fff;width:100%}
.side textarea{min-height:92px;resize:vertical}
.saveline{display:flex;align-items:center;gap:10px}
.msgs{display:flex;flex-direction:column;gap:10px;margin:12px 0;max-height:420px;overflow:auto;background:#F5F5F7;border-radius:12px;padding:12px}
.msg-row{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.msg-row.mine{align-items:flex-end}
.msg-row .bubble{max-width:80%;background:#fff;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.msg-row.mine .bubble{background:#1D1D1F;color:#fff}
.reply{display:flex;flex-direction:column;gap:6px}
.reply textarea{min-height:90px;border:1.5px solid var(--line2);border-radius:12px;padding:9px 10px;background:#fff;width:100%;box-sizing:border-box;resize:vertical}
.sent.err{color:#C4314B}
.saved{font-size:12px;color:var(--ok)}
.saved.err{color:var(--err)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink3);font-weight:600;background:#FAFAFC}
tr.person{cursor:pointer}
tr.person:hover td{background:#FAFAFC}
tr.detail td{background:#FAFAFC}
.empty{padding:40px;text-align:center;color:var(--ink3);background:var(--card);border:1px dashed var(--line2);border-radius:16px}
.copy{border:none;background:none;padding:0 4px;color:var(--ink3);text-decoration:underline;font-size:12px}
.hidden{display:none!important}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#E8E8ED;flex:0 0 auto;display:inline-block;vertical-align:middle}
.av.lg{width:72px;height:72px}
.nurse{display:flex;gap:10px;align-items:center}
.hs-0{background:#E8E8ED;color:#424245}.hs-1{background:#FFF4CC;color:#6B5300}.hs-2{background:#E3ECFF;color:#1F3B8A}.hs-3{background:#1D1D1F;color:#fff}.hs-4{background:#F5F5F7;color:#86868B}
.hedit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hedit .field{margin:0}
.hedit .input{font-size:14px;padding:9px 10px}
@media (max-width:820px){
  .hdr{padding:0 16px}
  main{padding:16px 16px 48px}
  .req{grid-template-columns:1fr;padding:16px}
  .side{border-left:none;border-top:1px solid var(--line);padding:16px 0 0}
  .search{margin-left:0;flex:1 1 100%}
  .who span{display:none}
  .tablewrap{overflow-x:auto}
  table{min-width:640px}
}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="brand-wrap" style="display:flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 120 120" aria-hidden="true" style="flex: 0 0 auto; display: block"><path fill-rule="evenodd" fill="#4F57E3" d="M40.00,6.00 Q40,0 46.00,0.00 L74.00,0.00 Q80,0 80.00,6.00 L80.00,39.00 Q80,40 81.00,40.00 L114.00,40.00 Q120,40 120.00,46.00 L120.00,74.00 Q120,80 114.00,80.00 L81.00,80.00 Q80,80 80.00,81.00 L80.00,114.00 Q80,120 74.00,120.00 L46.00,120.00 Q40,120 40.00,114.00 L40.00,81.00 Q40,80 39.00,80.00 L6.00,80.00 Q0,80 0.00,74.00 L0.00,46.00 Q0,40 6.00,40.00 L39.00,40.00 Q40,40 40.00,39.00 Z M45.00,43.00 Q43,43 43.00,45.00 L43.00,75.00 Q43,77 45.00,77.00 L75.00,77.00 Q77,77 77.00,75.00 L77.00,45.00 Q77,43 75.00,43.00 Z"></path></svg><div class="brand"><small>運営者向け</small><b style="display:flex;align-items:center;gap:8px"><svg width="86" height="19" viewBox="100 5 3850 855" role="img" aria-label="ナスリー" style="display:block;color:#1D1D1F"><g transform="translate(0,800) scale(1,-1)" fill="currentColor"><path d="M458,775 Q458,791 474,791 H580 Q596,791 596,775 V34 Q596,-56 506,-56 H246 Q230,-56 230,-40 V66 Q230,82 246,82 H446 Q458,82 458,94 Z"/><path d="M120,436 H935 Q951,436 951,452 V558 Q951,574 935,574 H120 Q104,574 104,558 V452 Q104,436 120,436 Z"/><path transform="translate(1040,0)" d="M834 678Q828 669 816.5 650.0Q805 631 799 615Q778 568 747.5 510.0Q717 452 678.5 393.5Q640 335 597 284Q541 221 473.5 159.5Q406 98 331.5 46.5Q257 -5 179 -42L76 66Q157 97 233.0 144.0Q309 191 374.0 246.0Q439 301 486 353Q519 391 548.5 434.0Q578 477 601.0 519.5Q624 562 635 598Q625 598 599.0 598.0Q573 598 538.5 598.0Q504 598 466.0 598.0Q428 598 393.5 598.0Q359 598 333.0 598.0Q307 598 296 598Q275 598 252.0 596.5Q229 595 208.5 593.5Q188 592 177 591V733Q192 732 214.0 730.0Q236 728 258.5 727.0Q281 726 296 726Q309 726 337.0 726.0Q365 726 401.0 726.0Q437 726 475.5 726.0Q514 726 549.5 726.0Q585 726 611.0 726.0Q637 726 649 726Q682 726 709.5 730.0Q737 734 752 739ZM610 367Q649 336 693.0 295.0Q737 254 780.0 210.0Q823 166 859.5 125.5Q896 85 921 55L807 -44Q770 7 722.5 62.0Q675 117 622.5 171.5Q570 226 516 275Z"/><path transform="translate(2080,0)" d="M803 776Q802 755 800.5 730.5Q799 706 799 676Q799 650 799.0 613.0Q799 576 799.0 539.5Q799 503 799 478Q799 398 791.5 338.0Q784 278 769.0 233.0Q754 188 732.5 153.5Q711 119 683 88Q650 52 607.0 23.5Q564 -5 520.5 -24.5Q477 -44 440 -56L335 54Q410 71 470.5 101.5Q531 132 576 180Q602 209 618.0 238.0Q634 267 642.5 302.5Q651 338 654.5 383.0Q658 428 658 486Q658 512 658.0 548.0Q658 584 658.0 619.0Q658 654 658 676Q658 706 656.5 730.5Q655 755 652 776ZM339 768Q338 750 337.0 732.5Q336 715 336 691Q336 680 336.0 655.0Q336 630 336.0 596.5Q336 563 336.0 526.5Q336 490 336.0 456.0Q336 422 336.0 394.5Q336 367 336 353Q336 334 337.0 309.0Q338 284 339 266H194Q195 280 197.0 306.0Q199 332 199 354Q199 368 199.0 395.0Q199 422 199.0 456.5Q199 491 199.0 527.5Q199 564 199.0 597.0Q199 630 199.0 655.0Q199 680 199 691Q199 705 198.0 727.5Q197 750 195 768Z"/><path transform="translate(3120,0)" d="M92 463Q110 462 138.0 460.5Q166 459 196.5 458.0Q227 457 253 457Q278 457 315.0 457.0Q352 457 395.5 457.0Q439 457 485.5 457.0Q532 457 578.0 457.0Q624 457 665.0 457.0Q706 457 738.5 457.0Q771 457 790 457Q825 457 856.0 459.5Q887 462 907 463V306Q890 307 856.0 309.0Q822 311 790 311Q771 311 738.0 311.0Q705 311 664.0 311.0Q623 311 577.5 311.0Q532 311 485.0 311.0Q438 311 394.5 311.0Q351 311 314.5 311.0Q278 311 253 311Q210 311 165.0 309.5Q120 308 92 306Z"/></g></svg>管理画面</b></div></div>
    <div class="who hidden" id="who"><span id="whoEmail"></span><button class="btn" id="logout" type="button">ログアウト</button></div>
  </div>
</header>
<main>
  <section id="loading" class="panel login"><p>読み込み中…</p></section>

  <section id="login" class="panel login hidden" aria-labelledby="loginTitle">
    <h1 id="loginTitle">運営者ログイン</h1>
    <p>登録済みの運営者のメールアドレスに、ログイン用のリンクを送ります。</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" class="input" type="email" autocomplete="email" required placeholder="name@unou.design">
      </div>
      <button class="btn primary" id="loginBtn" type="submit" style="width:100%;min-height:48px">ログイン用のリンクを送る</button>
    </form>
    <p class="msg" id="loginMsg" role="status"></p>
  </section>

  <section id="denied" class="panel login hidden">
    <h1>権限がありません</h1>
    <p>このアカウント（<span id="deniedEmail"></span>）には管理画面の権限がありません。運営者として追加するには、担当者に連絡してください。</p>
    <button class="btn" type="button" id="deniedLogout">別のアカウントでログイン</button>
  </section>

  <section id="app" class="hidden">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabReq" aria-selected="true" aria-controls="viewReq">申し込み<span class="count" id="openCount">0</span><span class="count hidden" id="msgCount" title="看護師からの未読メッセージ" style="background:#C4314B">0</span></button>
      <button class="tab" role="tab" id="tabPeople" aria-selected="false" aria-controls="viewPeople">登録者<span class="count" id="peopleCount" style="background:#86868B">0</span></button>
      <button class="tab" role="tab" id="tabHosp" aria-selected="false" aria-controls="viewHosp">病院<span class="count" id="hospCount" style="background:#86868B">0</span></button>
    </div>

    <div id="viewHosp" role="tabpanel" aria-labelledby="tabHosp" class="hidden">
      <div class="toolbar">
        <div id="hospChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <select id="hospArea" class="search" style="flex:0 1 200px;min-width:160px" aria-label="エリアで絞り込む"><option value="">すべてのエリア</option></select>
        <input class="search" id="hospSearch" type="search" placeholder="病院名・市区町村で絞り込む" aria-label="病院を絞り込む" style="margin-left:0">
        <button class="btn" type="button" id="hospAddBtn">病院を追加</button>
      </div>
      <form id="hospAdd" class="panel hidden" style="margin-bottom:16px;padding:20px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
          <div class="field" style="margin:0"><label for="haName">病院名</label><input id="haName" class="input" required></div>
          <div class="field" style="margin:0"><label for="haPref">都県</label><input id="haPref" class="input" placeholder="東京都"></div>
          <div class="field" style="margin:0"><label for="haCity">市区町村</label><input id="haCity" class="input" placeholder="江東区"></div>
          <div class="field" style="margin:0"><label for="haArea">エリア</label><input id="haArea" class="input" list="areaList" placeholder="東京東部〜千葉西部"></div>
        </div>
        <datalist id="areaList"></datalist>
        <div class="saveline" style="margin-top:12px"><button class="btn primary" type="submit">追加する</button><button class="btn" type="button" id="hospAddCancel">やめる</button><span class="saved" id="hospAddMsg"></span></div>
      </form>
      <p class="summary" id="hospSummary"></p>
      <div class="tablewrap">
        <table>
          <thead><tr><th>ID</th><th>病院名</th><th>エリア</th><th>病床</th><th>状況</th><th>プラン・契約開始</th><th>申し込み</th></tr></thead>
          <tbody id="hospBody"></tbody>
        </table>
      </div>
    </div>

    <div id="viewReq" role="tabpanel" aria-labelledby="tabReq">
      <div class="toolbar">
        <div id="statusChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        <input class="search" id="reqSearch" type="search" placeholder="病院名・名前・最寄駅で絞り込む" aria-label="申し込みを絞り込む">
        <button class="btn" type="button" id="reload">更新</button>
        <button class="btn" type="button" id="csv">CSVで書き出す</button>
      </div>
      <p class="summary" id="reqSummary"></p>
      <div class="list" id="reqList"></div>
    </div>

    <div id="viewPeople" role="tabpanel" aria-labelledby="tabPeople" class="hidden">
      <div class="toolbar">
        <input class="search" id="peopleSearch" type="search" placeholder="名前・最寄駅・職場で絞り込む" aria-label="登録者を絞り込む" style="margin-left:0">
      </div>
      <p class="summary" id="peopleSummary"></p>
      <div class="tablewrap">
        <table>
          <thead><tr><th>名前</th><th>資格</th><th>経験</th><th>最寄駅</th><th>いまの職場</th><th>申し込み</th><th>登録日</th></tr></thead>
          <tbody id="peopleBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var STATUSES = ['未対応', '病院に連絡済み', '日程確定', '見送り'];
  var HSTAT = ['未接触', '接点あり', '商談中', '契約済み', '見送り'];
  var cfg = window.NASURI_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var state = { session: null, talks: [], people: [], byId: {}, msgs: {}, filter: '未対応', q: '', pq: '', open: null,
    hospitals: [], hFilter: '契約済み', hq: '', harea: '', hopen: null, avatars: {} };
  var client;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function list(a) { return (a && a.length) ? a.map(esc).join('、') : '—'; }
  function show(id) { ['loading', 'login', 'denied', 'app'].forEach(function (k) { $(k).classList.toggle('hidden', k !== id); }); }

  function start() {
    if (!window.supabase || !cfg.supabaseUrl) { $('loading').innerHTML = '<p>接続設定を読み込めませんでした。</p>'; return; }
    client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    var hashErr = /error_code=/.test(location.hash);
    if (hashErr) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    client.auth.getSession().then(function (r) {
      state.session = r.data && r.data.session;
      if (!state.session) {
        show('login');
        if (hashErr) msg('ログイン用のリンクの有効期限が切れているか、すでに使われています。もう一度送ってください。', true);
        return;
      }
      $('who').classList.remove('hidden');
      $('whoEmail').textContent = state.session.user.email;
      return client.rpc('is_admin').then(function (res) {
        if (res.error || !res.data) { $('deniedEmail').textContent = state.session.user.email; show('denied'); return; }
        show('app');
        load();
      });
    });
  }

  function msg(t, err) { var m = $('loginMsg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = $('email').value.trim();
    if (!email) return;
    $('loginBtn').disabled = true; msg('送信中…');
    client.auth.signInWithOtp({ email: email, options: { emailRedirectTo: new URL('admin.html', location.href).href } })
      .then(function (r) {
        $('loginBtn').disabled = false;
        if (r.error) {
          var t = r.error.status === 429 ? '短い時間に送りすぎました。しばらくおいてから、もう一度お試しください。'
            : /signups not allowed|not found|Signups/i.test(r.error.message || '') ? 'このメールアドレスは登録されていません。'
            : 'うまく送れませんでした。時間をおいて、もう一度お試しください。';
          msg(t, true); return;
        }
        msg('メールを送りました。届いたリンクを押すと、管理画面が開きます。');
      });
  });
  function logout() { client.auth.signOut().then(function () { location.href = 'admin.html'; }); }
  $('logout').addEventListener('click', logout);
  $('deniedLogout').addEventListener('click', logout);

  function load() {
    $('reqSummary').textContent = '読み込み中…';
    Promise.all([
      client.from('talk_requests').select('*').order('created_at', { ascending: false }),
      client.from('profiles').select('*').order('created_at', { ascending: false }),
      client.from('hospitals').select('*').order('code', { ascending: true }),
      client.from('messages').select('*').order('created_at', { ascending: true })
    ]).then(function (res) {
      if (res[0].error || res[1].error) { $('reqSummary').textContent = '読み込めませんでした。もう一度「更新」を押してください。'; return; }
      state.talks = res[0].data || [];
      state.people = res[1].data || [];
      state.hospitals = (res[2] && !res[2].error && res[2].data) || [];
      state.msgs = {};
      ((res[3] && !res[3].error && res[3].data) || []).forEach(function (m) { (state.msgs[m.talk_id] = state.msgs[m.talk_id] || []).push(m); });
      state.byId = {};
      state.people.forEach(function (p) { state.byId[p.id] = p; });
      renderChips(); renderReqs(); renderPeople(); renderHospArea(); renderHosp();
      loadAvatars();
    });
  }

  /* 写真は非公開の保管場所にあるので、1時間だけ有効なURLを発行して表示する */
  function loadAvatars() {
    var paths = state.people.map(function (p) { return p.avatar_path; }).filter(Boolean);
    if (!paths.length || !client.storage) return;
    client.storage.from('avatars').createSignedUrls(paths, 3600).then(function (r) {
      if (r.error || !r.data) return;
      r.data.forEach(function (x) { if (x.signedUrl) state.avatars[x.path] = x.signedUrl; });
      renderReqs(); renderPeople();
    });
  }
  function avatar(p, lg) {
    var url = p && p.avatar_path && state.avatars[p.avatar_path];
    return url ? '<img class="av' + (lg ? ' lg' : '') + '" src="' + esc(url) + '" alt="' + esc(p.name) + 'さんの写真">'
      : '<span class="av' + (lg ? ' lg' : '') + '" role="img" aria-label="写真なし"></span>';
  }

  function renderChips() {
    var counts = { 'すべて': state.talks.length };
    STATUSES.forEach(function (s) { counts[s] = state.talks.filter(function (t) { return t.status === s; }).length; });
    $('openCount').textContent = counts['未対応'];
    var unreadAll = state.talks.reduce(function (a, t) { return a + unreadOf(t); }, 0);
    $('msgCount').textContent = unreadAll; $('msgCount').classList.toggle('hidden', !unreadAll);
    $('peopleCount').textContent = state.people.length;
    $('statusChips').innerHTML = ['すべて'].concat(STATUSES).map(function (s) {
      return '<button type="button" class="chip" data-s="' + esc(s) + '" aria-pressed="' + (state.filter === s) + '">' + esc(s) + '（' + counts[s] + '）</button>';
    }).join('');
  }
  $('statusChips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-s]'); if (!b) return;
    state.filter = b.getAttribute('data-s'); renderChips(); renderReqs();
  });
  $('reqSearch').addEventListener('input', function (e) { state.q = e.target.value.trim(); renderReqs(); });
  $('peopleSearch').addEventListener('input', function (e) { state.pq = e.target.value.trim(); renderPeople(); });
  $('reload').addEventListener('click', load);

  function matches(q, fields) { if (!q) return true; q = q.toLowerCase(); return fields.some(function (f) { return String(f || '').toLowerCase().indexOf(q) >= 0; }); }

  function visibleTalks() {
    return state.talks.filter(function (t) {
      var p = state.byId[t.user_id] || {};
      return (state.filter === 'すべて' || t.status === state.filter) && matches(state.q, [t.hospital, t.job, p.name, p.station, p.email]);
    });
  }

  function reqCard(t) {
    var p = state.byId[t.user_id] || {};
    var opts = STATUSES.map(function (s) { return '<option' + (s === t.status ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');
    return '<article class="req" data-id="' + t.id + '">' +
      '<div>' +
        '<div class="row"><span class="badge' + (t.status === '未対応' ? ' s0' : '') + '">' + esc(t.status) + '</span><span class="meta">' + fmt(t.created_at) + '・No.' + t.id + '</span></div>' +
        '<h3 style="margin-top:8px">' + esc(t.hospital) + (t.job ? '<span class="meta" style="font-size:13px;font-weight:500">　' + esc(t.job) + '</span>' : '') + '</h3>' +
        '<dl>' +
          '<dt>看護師</dt><dd><div class="nurse">' + avatar(p, true) + '<div><b>' + esc(p.name || '（プロフィール未登録）') + '</b>' + (p.name ? '<br>' + esc(p.license) + '・' + esc(p.years) + '年目・' + esc(p.station) + '駅' : '') + (p.name && !p.avatar_path ? '<br><span class="meta">写真未登録</span>' : '') + '</div></div></dd>' +
          '<dt>メール</dt><dd>' + esc(p.email || '—') + (p.email ? ' <button type="button" class="copy" data-copy="' + esc(p.email) + '">コピー</button>' : '') + '</dd>' +
          '<dt>いまの職場</dt><dd>' + esc(p.workplace || '—') + '</dd>' +
          '<dt>気持ち</dt><dd>' + esc(t.feeling) + '</dd>' +
          '<dt>話したい人</dt><dd>' + list(t.people) + '</dd>' +
          '<dt>聞きたいこと</dt><dd>' + list(t.topics) + '</dd>' +
          '<dt>希望の方法</dt><dd>' + esc(t.way) + '</dd>' +
          '<dt>ひとこと</dt><dd>' + (t.note ? esc(t.note) : '—') + '</dd>' +
        '</dl>' +
      '</div>' +
      '<div class="side">' +
        '<label for="st' + t.id + '"><b>ステータス</b></label>' +
        '<select id="st' + t.id + '" data-f="status">' + opts + '</select>' +
        '<label for="mm' + t.id + '"><b>運営メモ</b></label>' +
        '<textarea id="mm' + t.id + '" data-f="memo" placeholder="病院とのやりとり、日程など">' + esc(t.memo) + '</textarea>' +
        '<div class="saveline"><button type="button" class="btn primary" data-save="' + t.id + '">保存</button><span class="saved" aria-live="polite"></span></div>' +
      '</div>' +
      thread(t, p) +
    '</article>';
  }

  /* メッセージ：看護師とのやりとり。運営が病院として返信する（代理送信） */
  function unreadOf(t) { return (state.msgs[t.id] || []).filter(function (m) { return m.sender === 'nurse' && !m.read_at; }).length; }
  function thread(t, p) {
    var ms = state.msgs[t.id] || [], un = unreadOf(t);
    var last = ms.filter(function (m) { return m.sender === 'hospital'; }).slice(-1)[0];
    return '<div class="thread" style="grid-column:1/-1;border-top:1px solid var(--line);padding-top:16px">' +
      '<div class="row" style="justify-content:space-between"><b>メッセージ（' + ms.length + '件）</b>' +
        (un ? '<span><span class="badge s0">看護師から未読 ' + un + '件</span> <button type="button" class="copy" data-read="' + t.id + '">既読にする</button></span>' : '') + '</div>' +
      '<div class="msgs">' + (ms.length ? ms.map(function (m) {
        var mine = m.sender === 'hospital';
        return '<div class="msg-row' + (mine ? ' mine' : '') + '"><span class="meta">' + esc(mine ? m.sender_name : (p.name || '看護師')) + '・' + fmt(m.created_at) + (mine ? (m.read_at ? '・既読' : '・未読') : '') + '</span><div class="bubble">' + esc(m.body) + '</div></div>';
      }).join('') : '<p class="meta" style="margin:8px 0">まだやりとりはありません。最初の返信を送ると、看護師にメールで知らせます。</p>') + '</div>' +
      '<div class="reply">' +
        '<label for="rn' + t.id + '" class="meta">差出人として表示する名前</label>' +
        '<input id="rn' + t.id + '" class="input" data-f="rname" value="' + esc(last ? last.sender_name : t.hospital + ' 看護部') + '">' +
        '<label for="rb' + t.id + '" class="meta">本文（看護師に病院からのメッセージとして届きます）</label>' +
        '<textarea id="rb' + t.id + '" data-f="rbody" maxlength="2000" placeholder="例：「話を聞きたい」をありがとうございます。来週、オンラインで30分ほどお話しできますか。"></textarea>' +
        '<div class="saveline"><button type="button" class="btn primary" data-send="' + t.id + '">送信</button><span class="sent" aria-live="polite"></span></div>' +
      '</div>' +
    '</div>';
  }

  function renderReqs() {
    var v = visibleTalks();
    $('reqSummary').textContent = state.talks.length ? v.length + '件を表示中（全' + state.talks.length + '件）' : '';
    $('reqList').innerHTML = v.length ? v.map(reqCard).join('') : '<div class="empty">' + (state.talks.length ? '条件に合う申し込みはありません。' : 'まだ申し込みはありません。') + '</div>';
  }

  $('reqList').addEventListener('click', function (e) {
    var c = e.target.closest('[data-copy]');
    if (c) { try { navigator.clipboard.writeText(c.getAttribute('data-copy')); c.textContent = 'コピーしました'; } catch (x) {} return; }
    var rd = e.target.closest('[data-read]');
    if (rd) { var rid = Number(rd.getAttribute('data-read')); client.rpc('mark_read', { p_talk: rid }).then(function () { (state.msgs[rid] || []).forEach(function (m) { if (m.sender === 'nurse') m.read_at = m.read_at || new Date().toISOString(); }); renderChips(); renderReqs(); }); return; }
    var sd = e.target.closest('[data-send]');
    if (sd) {
      var tid = Number(sd.getAttribute('data-send')), box = sd.closest('.thread');
      var name = box.querySelector('[data-f=rname]').value.trim(), body = box.querySelector('[data-f=rbody]').value.trim(), out = box.querySelector('.sent');
      if (!body) { out.className = 'sent err'; out.textContent = '本文を入れてください'; return; }
      sd.disabled = true; out.className = 'sent'; out.textContent = '送信中…';
      client.from('messages').insert({ talk_id: tid, sender_name: name, body: body }).select().single().then(function (r) {
        sd.disabled = false;
        if (r.error) { out.className = 'sent err'; out.textContent = '送信できませんでした'; return; }
        (state.msgs[tid] = state.msgs[tid] || []).push(r.data);
        client.rpc('mark_read', { p_talk: tid }).then(function () { (state.msgs[tid] || []).forEach(function (m) { if (m.sender === 'nurse') m.read_at = m.read_at || new Date().toISOString(); }); renderChips(); renderReqs(); });
      });
      return;
    }
    var b = e.target.closest('[data-save]'); if (!b) return;
    var card = b.closest('.req'), id = Number(b.getAttribute('data-save'));
    var status = card.querySelector('[data-f=status]').value, memo = card.querySelector('[data-f=memo]').value;
    var note = card.querySelector('.saved');
    b.disabled = true; note.className = 'saved'; note.textContent = '保存中…';
    client.from('talk_requests').update({ status: status, memo: memo }).eq('id', id).select().single().then(function (r) {
      b.disabled = false;
      if (r.error) { note.className = 'saved err'; note.textContent = '保存できませんでした'; return; }
      state.talks = state.talks.map(function (t) { return t.id === id ? r.data : t; });
      note.textContent = '保存しました';
      renderChips();
      card.querySelector('.badge').textContent = status;
      card.querySelector('.badge').className = 'badge' + (status === '未対応' ? ' s0' : '');
    });
  });

  function renderPeople() {
    var v = state.people.filter(function (p) { return matches(state.pq, [p.name, p.station, p.workplace, p.email]); });
    $('peopleSummary').textContent = state.people.length ? v.length + '人を表示中（全' + state.people.length + '人）' : '';
    if (!v.length) { $('peopleBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:#6E6E73;padding:32px">' + (state.people.length ? '条件に合う登録者はいません。' : 'まだ登録者はいません。') + '</td></tr>'; return; }
    $('peopleBody').innerHTML = v.map(function (p) {
      var mine = state.talks.filter(function (t) { return t.user_id === p.id; });
      var row = '<tr class="person" tabindex="0" data-pid="' + esc(p.id) + '" aria-expanded="' + (state.open === p.id) + '">' +
        '<td><div class="nurse">' + avatar(p) + '<div><b>' + esc(p.name) + '</b><div class="meta">' + esc(p.email) + '</div></div></div></td><td>' + esc(p.license) + '</td><td>' + esc(p.years) + '年目</td><td>' + esc(p.station) + '</td><td>' + esc(p.workplace || '—') + '</td><td>' + mine.length + '件</td><td>' + fmt(p.created_at) + '</td></tr>';
      if (state.open === p.id) {
        row += '<tr class="detail"><td colspan="7">' + (mine.length ? mine.map(function (t) {
          return '<div style="padding:6px 0"><span class="badge' + (t.status === '未対応' ? ' s0' : '') + '">' + esc(t.status) + '</span>　<b>' + esc(t.hospital) + '</b>　<span class="meta">' + fmt(t.created_at) + '・' + esc(t.feeling) + '・' + esc(t.way) + '</span>' + (t.memo ? '<div class="meta">メモ：' + esc(t.memo) + '</div>' : '') + '</div>';
        }).join('') : '<span class="meta">まだ申し込みはありません。</span>') + '</td></tr>';
      }
      return row;
    }).join('');
  }
  function togglePerson(e) {
    var tr = e.target.closest('tr.person'); if (!tr) return;
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    if (e.type === 'keydown') e.preventDefault();
    var id = tr.getAttribute('data-pid'); state.open = state.open === id ? null : id; renderPeople();
  }
  $('peopleBody').addEventListener('click', togglePerson);
  $('peopleBody').addEventListener('keydown', togglePerson);

  function selectTab(which) {
    [['req', 'tabReq', 'viewReq'], ['people', 'tabPeople', 'viewPeople'], ['hosp', 'tabHosp', 'viewHosp']].forEach(function (t) {
      $(t[1]).setAttribute('aria-selected', t[0] === which);
      $(t[2]).classList.toggle('hidden', t[0] !== which);
    });
  }
  $('tabReq').addEventListener('click', function () { selectTab('req'); });
  $('tabPeople').addEventListener('click', function () { selectTab('people'); });
  $('tabHosp').addEventListener('click', function () { selectTab('hosp'); });

  /* ---- 病院 ---- */
  function talksFor(h) { return state.talks.filter(function (t) { return t.hospital === h.name; }); }
  function hBadge(s) { return '<span class="badge hs-' + Math.max(0, HSTAT.indexOf(s)) + '">' + esc(s) + '</span>'; }
  function renderHospArea() {
    var areas = [];
    state.hospitals.forEach(function (h) { if (h.area && areas.indexOf(h.area) < 0) areas.push(h.area); });
    areas.sort();
    $('hospArea').innerHTML = '<option value="">すべてのエリア</option>' + areas.map(function (a) { return '<option' + (a === state.harea ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('');
    $('areaList').innerHTML = areas.map(function (a) { return '<option value="' + esc(a) + '">'; }).join('');
  }
  function renderHosp() {
    var counts = { 'すべて': state.hospitals.length };
    HSTAT.forEach(function (s) { counts[s] = state.hospitals.filter(function (h) { return h.status === s; }).length; });
    $('hospCount').textContent = counts['契約済み'];
    $('hospChips').innerHTML = ['すべて'].concat(HSTAT).map(function (s) {
      return '<button type="button" class="chip" data-h="' + esc(s) + '" aria-pressed="' + (state.hFilter === s) + '">' + esc(s) + '（' + counts[s] + '）</button>';
    }).join('');
    var v = state.hospitals.filter(function (h) {
      return (state.hFilter === 'すべて' || h.status === state.hFilter) && (!state.harea || h.area === state.harea) && matches(state.hq, [h.name, h.city, h.code, h.pref]);
    });
    $('hospSummary').textContent = v.length + '件を表示中（全' + state.hospitals.length + '件）';
    if (!v.length) {
      $('hospBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:#6E6E73;padding:32px">' +
        (state.hFilter === '契約済み' && !counts['契約済み'] ? '契約済みの病院はまだありません。「すべて」から病院を開き、状況を「契約済み」にすると、ここに並びます。' : '条件に合う病院はありません。') + '</td></tr>';
      return;
    }
    $('hospBody').innerHTML = v.map(function (h) {
      var mine = talksFor(h);
      var row = '<tr class="person" tabindex="0" data-hid="' + h.id + '" aria-expanded="' + (state.hopen === h.id) + '">' +
        '<td class="meta">' + esc(h.code || '') + '</td><td><b>' + esc(h.name) + '</b><div class="meta">' + esc(h.pref) + esc(h.city) + '</div></td><td>' + esc(h.area || '—') + '</td><td>' + (h.beds ? esc(h.beds) + '床' : '—') + '</td>' +
        '<td>' + hBadge(h.status) + '</td><td>' + esc(h.plan || '—') + (h.contract_start ? '<div class="meta">' + esc(h.contract_start) + '〜</div>' : '') + '</td><td>' + mine.length + '件</td></tr>';
      if (state.hopen === h.id) {
        var opts = HSTAT.map(function (s) { return '<option' + (s === h.status ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');
        row += '<tr class="detail"><td colspan="7"><form class="hform" data-hid="' + h.id + '">' +
          '<div class="hedit">' +
            '<div class="field"><label for="hs' + h.id + '">状況</label><select id="hs' + h.id + '" class="input" data-k="status">' + opts + '</select></div>' +
            '<div class="field"><label for="hp' + h.id + '">プラン</label><input id="hp' + h.id + '" class="input" data-k="plan" value="' + esc(h.plan) + '" placeholder="無料（初期）／スタンダード など"></div>' +
            '<div class="field"><label for="hc' + h.id + '">契約開始日</label><input id="hc' + h.id + '" class="input" type="date" data-k="contract_start" value="' + esc(h.contract_start || '') + '"></div>' +
            '<div class="field"><label for="hn' + h.id + '">病院の担当者</label><input id="hn' + h.id + '" class="input" data-k="contact_name" value="' + esc(h.contact_name) + '" placeholder="看護部長 〇〇様"></div>' +
            '<div class="field"><label for="he' + h.id + '">担当者の連絡先</label><input id="he' + h.id + '" class="input" data-k="contact_email" value="' + esc(h.contact_email) + '" placeholder="メールまたは電話"></div>' +
            '<div class="field"><label for="hl' + h.id + '">代表電話</label><input id="hl' + h.id + '" class="input" data-k="phone" value="' + esc(h.phone) + '"></div>' +
          '</div>' +
          '<div class="field" style="margin-top:12px"><label for="hm' + h.id + '">メモ</label><textarea id="hm' + h.id + '" class="input" data-k="memo" style="min-height:80px">' + esc(h.memo) + '</textarea></div>' +
          '<div class="saveline"><button type="submit" class="btn primary">保存</button><span class="saved" aria-live="polite"></span></div>' +
          '<div style="margin-top:16px"><b>この病院への申し込み</b>' + (mine.length ? mine.map(function (t) {
            var p = state.byId[t.user_id] || {};
            return '<div style="padding:6px 0"><span class="badge' + (t.status === '未対応' ? ' s0' : '') + '">' + esc(t.status) + '</span>　' + esc(p.name || '—') + '　<span class="meta">' + fmt(t.created_at) + '・' + esc(t.feeling) + '・' + esc(t.way) + '</span></div>';
          }).join('') : '<div class="meta" style="padding:6px 0">まだ申し込みはありません。</div>') + '</div>' +
          '<div class="meta" style="margin-top:8px">住所：' + esc(h.address || '—') + (h.score != null ? '　総合点：' + esc(h.score) : '') + '</div>' +
        '</form></td></tr>';
      }
      return row;
    }).join('');
  }
  $('hospChips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-h]'); if (!b) return;
    state.hFilter = b.getAttribute('data-h'); renderHosp();
  });
  $('hospArea').addEventListener('change', function (e) { state.harea = e.target.value; renderHosp(); });
  $('hospSearch').addEventListener('input', function (e) { state.hq = e.target.value.trim(); renderHosp(); });
  function toggleHosp(e) {
    if (e.target.closest('.hform')) return;
    var tr = e.target.closest('tr.person'); if (!tr) return;
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    if (e.type === 'keydown') e.preventDefault();
    var id = Number(tr.getAttribute('data-hid')); state.hopen = state.hopen === id ? null : id; renderHosp();
  }
  $('hospBody').addEventListener('click', toggleHosp);
  $('hospBody').addEventListener('keydown', toggleHosp);
  $('hospBody').addEventListener('submit', function (e) {
    var f = e.target.closest('.hform'); if (!f) return;
    e.preventDefault();
    var id = Number(f.getAttribute('data-hid')), patch = {};
    f.querySelectorAll('[data-k]').forEach(function (el) { patch[el.getAttribute('data-k')] = el.value; });
    if (!patch.contract_start) patch.contract_start = null;
    var note = f.querySelector('.saved'), btn = f.querySelector('button[type=submit]');
    btn.disabled = true; note.className = 'saved'; note.textContent = '保存中…';
    client.from('hospitals').update(patch).eq('id', id).select().single().then(function (r) {
      btn.disabled = false;
      if (r.error) { note.className = 'saved err'; note.textContent = '保存できませんでした'; return; }
      state.hospitals = state.hospitals.map(function (h) { return h.id === id ? r.data : h; });
      renderHosp();
      var again = document.querySelector('.hform[data-hid="' + id + '"] .saved'); if (again) again.textContent = '保存しました';
    });
  });
  $('hospAddBtn').addEventListener('click', function () { $('hospAdd').classList.remove('hidden'); $('haName').focus(); });
  $('hospAddCancel').addEventListener('click', function () { $('hospAdd').classList.add('hidden'); });
  $('hospAdd').addEventListener('submit', function (e) {
    e.preventDefault();
    var row = { name: $('haName').value.trim(), pref: $('haPref').value.trim(), city: $('haCity').value.trim(), area: $('haArea').value.trim() };
    if (!row.name) return;
    $('hospAddMsg').className = 'saved'; $('hospAddMsg').textContent = '追加中…';
    client.from('hospitals').insert(row).select().single().then(function (r) {
      if (r.error) { $('hospAddMsg').className = 'saved err'; $('hospAddMsg').textContent = '追加できませんでした'; return; }
      state.hospitals.push(r.data); state.hFilter = 'すべて'; state.hopen = r.data.id;
      $('hospAdd').reset(); $('hospAdd').classList.add('hidden'); $('hospAddMsg').textContent = '';
      renderHospArea(); renderHosp();
    });
  });

  $('csv').addEventListener('click', function () {
    var head = ['No', '申込日時', 'ステータス', '病院', '求人', '名前', 'メール', '資格', '経験年数', '最寄駅', 'いまの職場', '気持ち', '話したい人', '聞きたいこと', '希望の方法', 'ひとこと', '運営メモ'];
    var rows = visibleTalks().map(function (t) {
      var p = state.byId[t.user_id] || {};
      return [t.id, fmt(t.created_at), t.status, t.hospital, t.job, p.name, p.email, p.license, p.years, p.station, p.workplace, t.feeling, (t.people || []).join('、'), (t.topics || []).join('、'), t.way, t.note, t.memo];
    });
    var csv = [head].concat(rows).map(function (r) { return r.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
    var a = document.createElement('a');
