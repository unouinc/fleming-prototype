<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleming 募集詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Outfit:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1A1A1A}a:hover{color:#3A63F4}
.tabbar{display:none}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important}
  .wrap-top{padding:12px 16px 0!important}
  .pagetitle{font-size:20px!important}
  .hero{height:240px!important;border-radius:20px}
  .ov{padding:0!important}
  .dlg{max-width:none!important;height:100%;max-height:none!important;border-radius:0!important}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E3E0D8;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F6F5F1; color: #1A1A1A; font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E0D8">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; flex: 0 0 auto">
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #3A63F4; display: flex; align-items: center; justify-content: center"><span style="width: 11px; height: 11px; border-radius: 50%; background: #FFD338"></span></span>
        <span style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.4px">Fleming</span>
      </a>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 4px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 4px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px">スカウト<span style="background: #3A63F4; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #DAD6CC; color: #6B675E; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 900"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>

  <!-- Cover -->
  <div class="wrap-top" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 24px 32px 0; box-sizing: border-box">
    <a href="index.html" style="font-size: 13px; font-weight: 700; color: #5C5C5C; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px">← 募集一覧に戻る</a>
    <div class="hero" style="margin-top: 12px; display: flex; gap: 12px; height: 420px">
      <div style="flex: 2 1 0; min-width: 0; border-radius: 8px; overflow: hidden; background: #DAD6CC">
        <img src="images/station.jpg" alt="申し送り中のナースステーション。師長と若手看護師が談笑している" style="width: 100%; height: 100%; object-fit: cover; display: block">
      </div>
      <div class="subs pc-only" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div style="flex: 1 1 0; min-height: 0; border-radius: 8px; overflow: hidden; background: #E4E0D6">
          <img src="images/rehab.jpg" alt="病棟の廊下で患者さんの歩行に付き添う看護師" style="width: 100%; height: 100%; object-fit: cover; display: block">
        </div>
        <div style="flex: 1 1 0; min-height: 0; border-radius: 8px; overflow: hidden; background: #E4E0D6">
          <img src="images/mentor.jpg" alt="教育担当と中途入職者の1on1" style="width: 100%; height: 100%; object-fit: cover; display: block">
        </div>
      </div>
    </div>
  </div>

  <div class="wrap" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 28px 32px 80px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

    <!-- Main column -->
    <main style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <span style="background: #3B4654; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px">正社員</span>
          <span style="background: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #D9D4C7">病院・急性期</span>
          <span style="background: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #D9D4C7">看護師</span>
        </div>
        <h1 class="pagetitle" style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.5; color: #333333">「聞きやすさ」で選ばれる内科病棟で、<br class="pc-only">一緒に働く看護師を募集</h1>
        <a href="#" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: 700">
          <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 4px; background: #DAD6CC; border: 1px solid #C9C4B8"></span>
          みなと中央病院<span style="color: #5C5C5C">·</span><span style="color: #5C5C5C">東京都港区</span>
        </a>
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; background: #FFFFFF; border-radius: 8px; padding: 14px 20px">
          <span style="font-size: 13px; font-weight: 700; color: #5C5C5C">月収</span>
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.4px">276,500円〜</span>
          <span style="font-size: 13px; font-weight: 700; color: #5C5C5C">夜勤4回・各種手当を含む｜年収目安 [金額]〜</span>
        </div>
      </div>

      <!-- Tabs -->
      <nav aria-label="ページ内" style="display: flex; gap: 4px; border-bottom: 2px solid #E3E0D8; font-size: 14px; font-weight: 700">
        <a href="#about" style="text-decoration: none; padding: 12px 16px; border-bottom: 3px solid #1A1A1A; margin-bottom: -2px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">施設概要</a>
        <a href="members-a.html" style="text-decoration: none; padding: 12px 16px; color: #5C5C5C; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">メンバー</a>
        <a href="interview.html" style="text-decoration: none; padding: 12px 16px; color: #5C5C5C; min-height: 44px; box-sizing: border-box; display: flex; align-items: center">インタビュー</a>
      </nav>

      <!-- About -->
      <section id="about" style="background: #FFFFFF; border-radius: 8px; padding: 36px; display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #3A63F4">ABOUT</span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 900">施設概要</h2>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 2; color: #3D3D3D">港区にある[病床数]床の急性期病院。内科病棟では、高齢の患者さんの急性期治療から退院支援までを担当します。看護師は[人数]名、中途入職が半数以上で、ブランクから復帰したメンバーもいます。</p>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 900; padding-bottom: 10px; border-bottom: 2px solid #1A1A1A">{{g.title}}</h3>
            <dl style="margin: 0; display: flex; flex-direction: column">
              <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
                <div style="display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid #EDEAE2">
                  <dt style="flex: 0 0 150px; font-size: 13px; font-weight: 700; color: #5C5C5C; padding-top: 2px">{{r.k}}</dt>
                  <dd style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.7; white-space: pre-line">{{r.v}}</dd>
                </div>
              </sc-for>
            </dl>
          </div>
        </sc-for>
      </section>

      <!-- Members -->
      <section id="members" style="background: #FFFFFF; border-radius: 8px; padding: 36px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #3A63F4">MEMBERS</span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 900">話を聞きに行くと会える人 <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 16px; font-weight: 700; color: #3A63F4">{{memberCount}}人</span></h2>
          <span style="font-size: 13px; line-height: 1.7; color: #5C5C5C">応募の前に、この中から話したい人を選んで30分ほど話せます。見学でもオンラインでも。</span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <a href="members-a.html" style="text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 4px; border: 2px solid #D9D4C7; min-height: 40px; box-sizing: border-box; display: flex; align-items: center">チームの構成を見る（組織図）</a>
          <a href="members-b.html" style="text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 4px; border: 2px solid #D9D4C7; min-height: 40px; box-sizing: border-box; display: flex; align-items: center">数字で見るメンバー・師長の紹介</a>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <sc-for list="{{members}}" as="m" hint-placeholder-count="3">
            <div style="flex: 1 1 220px; min-width: 0; border: 1px solid #E3E0D8; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; gap: 12px; align-items: center">
                <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #DAD6CC; color: #6B675E; border: 2px solid #D9D4C7; flex: 0 0 auto; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></span>
                <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 15px; font-weight: 700; color: #333333">{{m.name}}</span>
                  <span style="font-size: 12px; font-weight: 400; color: #5C5C5C">{{m.role}}</span>
                </div>
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap">
                <sc-for list="{{m.tags}}" as="t" hint-placeholder-count="3"><span style="font-size: 12px; font-weight: 400; color: #333333; border: 1px solid #C9C4B8; padding: 2px 8px; border-radius: 4px">{{t}}</span></sc-for>
              </div>
              <span style="font-size: 13px; line-height: 1.7; color: #333333">{{m.text}}</span>
              <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid #EDEAE2">
                <span style="font-size: 11px; font-weight: 700; color: #5C5C5C">こんな話ができます</span>
                <span style="font-size: 13px; line-height: 1.7; color: #333333">{{m.ask}}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </section>

      <!-- Numbers -->
      <section id="numbers" style="background: #FFFFFF; border-radius: 8px; padding: 36px; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #3A63F4">NUMBERS</span>
            <h2 style="margin: 0; font-size: 22px; font-weight: 900">入る前に知っておきたい数字</h2>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">病院の申告値｜2026年10月更新</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 14px; background: #F6F5F1; border-radius: 8px; padding: 20px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700">
                <span>{{b.label}}</span>
                <span style="display: flex; gap: 10px; align-items: baseline"><span style="font-size: 11px; color: #5C5C5C">エリア平均 {{b.avg}}</span><span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 20px">{{b.value}}</span></span>
              </div>
              <div style="height: 12px; background: #E6E2D8; border-radius: 999px; position: relative; overflow: hidden">
                <div style="position: absolute; left: 0; top: 0; height: 12px; border-radius: 999px; background: {{b.color}}; width: {{b.w}}"></div>
                <div style="position: absolute; top: 0; height: 12px; width: 3px; background: #3B4654; left: {{b.avgPos}}"></div>
              </div>
              <span style="font-size: 11px; color: #5C5C5C">{{b.note}}</span>
            </div>
          </sc-for>
          <div style="display: flex; flex-wrap: wrap; gap: 12px">
            <sc-for list="{{facts}}" as="f" hint-placeholder-count="2">
              <div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">{{f.label}}</span>
                <span style="font-size: 20px; font-weight: 900">{{f.value}}</span>
                <span style="font-size: 11px; color: #5C5C5C">{{f.note}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 14px; font-weight: 900">働く人の声</span>
          <sc-for list="{{voices}}" as="v" hint-placeholder-count="3">
            <blockquote style="margin: 0; background: #F6F5F1; border-radius: 8px 8px 8px 4px; padding: 14px 18px; font-size: 14px; line-height: 1.8">{{v.text}}<span style="display: block; margin-top: 6px; font-size: 12px; color: #5C5C5C">— {{v.who}}</span></blockquote>
          </sc-for>
        </div>
      </section>

      <p style="margin: 0; font-size: 12px; color: #5C5C5C">※病院名・声・数値はプロトタイプ用のサンプルです</p>
    </main>

    <!-- Side: action card -->
    <aside style="flex: 0 1 340px; min-width: 280px; display: flex; flex-direction: column; gap: 16px">
      <div style="background: #FFFFFF; border: 2px solid #D9D4C7; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; gap: 14px">
          <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 6px; background: #DAD6CC; border: 1px solid #C9C4B8; flex: 0 0 auto"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 16px; font-weight: 900">みなと中央病院</span>
            <span style="font-size: 12px; font-weight: 700; color: #5C5C5C">急性期｜病床数 [病床数]｜東京都港区</span>
            <span style="font-size: 13px; font-weight: 700"><span style="color: #5C5C5C">月収 </span><span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 18px">276,500円〜</span></span>
          </div>
        </div>
        <sc-if value="{{applied}}" hint-placeholder-val="{{false}}">
          <div style="background: #EEF2FF; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; font-weight: 900; color: #3A63F4">「話を聞きたい」を送りました</span>
            <span style="font-size: 13px; line-height: 1.7">病院から返信があると、メッセージに届きます。目安は2〜3日です。</span>
            <a href="scouts.html" style="font-size: 13px; font-weight: 700; color: #3A63F4">メッセージを見る →</a>
          </div>
        </sc-if>
        <sc-if value="{{notApplied}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{apply}}" style="border: none; background: #3B4654; color: #FFFFFF; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: 700; padding: 16px; min-height: 56px; cursor: pointer">話を聞きに行きたい</button>
        </sc-if>
        <div style="display: flex; gap: 8px">
          <button type="button" onClick="{{toggleLike}}" aria-pressed="{{liked}}" style="flex: 1 1 auto; border: 2px solid {{likeBorder}}; background: {{likeBg}}; border-radius: 4px; font-family: inherit; font-size: 14px; font-weight: 700; padding: 12px; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="{{likeFill}}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9C.8 8.6 2.9 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4.1 0 6.2 4.6 4.5 8-2.5 4.4-9.5 9-9.5 9z"></path></svg>気になる
          </button>
        </div>
        <span style="font-size: 12px; line-height: 1.7; color: #5C5C5C">「話を聞きに行きたい」は応募ではありません。見学やオンラインでの雑談から始められます。</span>
      </div>

      <div style="background: #FFFFFF; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 13px; font-weight: 900">あなたの希望との相性</span>
        <sc-for list="{{fit}}" as="f" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700">
            <span style="width: 22px; height: 22px; border-radius: 50%; background: {{f.bg}}; color: {{f.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; flex: 0 0 auto">{{f.mark}}</span>
            <span style="flex: 1 1 auto">{{f.label}}</span>
            <span style="color: #5C5C5C">{{f.val}}</span>
          </div>
        </sc-for>
        <a href="profile.html" style="font-size: 12px; font-weight: 700; color: #3A63F4; text-decoration: none">希望条件を編集 →</a>
      </div>

      <div style="background: #3B4654; color: #FFFFFF; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 13px; font-weight: 900; color: #FFD338">この募集を友だちに</span>
        <span style="font-size: 13px; line-height: 1.7">合いそうな同期がいたら送ってみてください。その人がFlemingで転職したら、あなたに5万円。</span>
        <button type="button" style="align-self: flex-start; border: none; background: #FFFFFF; color: #1A1A1A; border-radius: 4px; font-family: inherit; font-size: 13px; font-weight: 700; padding: 10px 16px; min-height: 40px; cursor: pointer">紹介文をコピー</button>
      </div>
    </aside>
  </div>
  <sc-if value="{{talkOpen}}" hint-placeholder-val="{{false}}">
    <div class="ov" role="dialog" aria-modal="true" aria-label="話を聞きに行きたい" style="position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
      <div onClick="{{closeTalk}}" style="position: absolute; inset: 0; background: rgba(26,26,26,0.45)"></div>
      <div class="dlg" style="position: relative; width: 100%; max-width: 640px; max-height: calc(100vh - 48px); flex: 0 0 auto; background: #FFFFFF; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 48px rgba(26,26,26,0.2)">
