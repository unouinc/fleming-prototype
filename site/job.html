<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<title>ナスリー 募集詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F7}
a{color:#1D1D1F}a:hover{color:#6E6E73}
.tabbar{display:none}
@media (max-width: 760px){
  .pc-only{display:none!important}
  .hdr{padding:0 16px!important;height:56px!important}
  .wrap{padding:12px 16px 96px!important;gap:16px!important}
  .wrap-top{padding:12px 16px 0!important}
  .pagetitle{font-size:20px!important}
  .hero{height:240px!important;border-radius:20px}
  .ov{padding:0!important}
  .dlg{max-width:none!important;height:100%;max-height:none!important;border-radius:0!important}
  .tabbar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFFFFF;border-top:1px solid #E5E5EA;padding:6px 0 calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-height: 100vh; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; font-weight: 500; letter-spacing: 0.01em; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E5E5EA">
    <div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 0 32px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 28px">
      <a href="index.html" aria-label="ナスリー トップへ" style="display: flex; flex-direction: row; align-items: center; gap: 10px; text-decoration: none; flex: 0 1 auto; min-width: 0; line-height: 1.2"><svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true" style="flex: 0 0 auto; display: block"><path fill-rule="evenodd" fill="#3A6CF2" d="M40.00,6.00 Q40,0 46.00,0.00 L74.00,0.00 Q80,0 80.00,6.00 L80.00,39.00 Q80,40 81.00,40.00 L114.00,40.00 Q120,40 120.00,46.00 L120.00,74.00 Q120,80 114.00,80.00 L81.00,80.00 Q80,80 80.00,81.00 L80.00,114.00 Q80,120 74.00,120.00 L46.00,120.00 Q40,120 40.00,114.00 L40.00,81.00 Q40,80 39.00,80.00 L6.00,80.00 Q0,80 0.00,74.00 L0.00,46.00 Q0,40 6.00,40.00 L39.00,40.00 Q40,40 40.00,39.00 Z M45.00,43.00 Q43,43 43.00,45.00 L43.00,75.00 Q43,77 45.00,77.00 L75.00,77.00 Q77,77 77.00,75.00 L77.00,45.00 Q77,43 75.00,43.00 Z"></path></svg><span style="display: flex; flex-direction: column; justify-content: center; gap: 1px; min-width: 0">
        <span class="brand-concept" style="font-size: 10px; font-weight: 500; color: #6E6E73; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">職場がみえる 看護師のための転職プラットフォーム</span>
        <span role="img" aria-label="ナスリー" style="display: block; color: #1D1D1F; margin-top: 2px"><svg width="86" height="19" viewBox="100 5 3850 855" aria-hidden="true" style="display: block"><g transform="translate(0,800) scale(1,-1)" fill="currentColor"><path d="M458,775 Q458,791 474,791 H580 Q596,791 596,775 V34 Q596,-56 506,-56 H246 Q230,-56 230,-40 V66 Q230,82 246,82 H446 Q458,82 458,94 Z"/><path d="M120,436 H935 Q951,436 951,452 V558 Q951,574 935,574 H120 Q104,574 104,558 V452 Q104,436 120,436 Z"/><path transform="translate(1040,0)" d="M834 678Q828 669 816.5 650.0Q805 631 799 615Q778 568 747.5 510.0Q717 452 678.5 393.5Q640 335 597 284Q541 221 473.5 159.5Q406 98 331.5 46.5Q257 -5 179 -42L76 66Q157 97 233.0 144.0Q309 191 374.0 246.0Q439 301 486 353Q519 391 548.5 434.0Q578 477 601.0 519.5Q624 562 635 598Q625 598 599.0 598.0Q573 598 538.5 598.0Q504 598 466.0 598.0Q428 598 393.5 598.0Q359 598 333.0 598.0Q307 598 296 598Q275 598 252.0 596.5Q229 595 208.5 593.5Q188 592 177 591V733Q192 732 214.0 730.0Q236 728 258.5 727.0Q281 726 296 726Q309 726 337.0 726.0Q365 726 401.0 726.0Q437 726 475.5 726.0Q514 726 549.5 726.0Q585 726 611.0 726.0Q637 726 649 726Q682 726 709.5 730.0Q737 734 752 739ZM610 367Q649 336 693.0 295.0Q737 254 780.0 210.0Q823 166 859.5 125.5Q896 85 921 55L807 -44Q770 7 722.5 62.0Q675 117 622.5 171.5Q570 226 516 275Z"/><path transform="translate(2080,0)" d="M803 776Q802 755 800.5 730.5Q799 706 799 676Q799 650 799.0 613.0Q799 576 799.0 539.5Q799 503 799 478Q799 398 791.5 338.0Q784 278 769.0 233.0Q754 188 732.5 153.5Q711 119 683 88Q650 52 607.0 23.5Q564 -5 520.5 -24.5Q477 -44 440 -56L335 54Q410 71 470.5 101.5Q531 132 576 180Q602 209 618.0 238.0Q634 267 642.5 302.5Q651 338 654.5 383.0Q658 428 658 486Q658 512 658.0 548.0Q658 584 658.0 619.0Q658 654 658 676Q658 706 656.5 730.5Q655 755 652 776ZM339 768Q338 750 337.0 732.5Q336 715 336 691Q336 680 336.0 655.0Q336 630 336.0 596.5Q336 563 336.0 526.5Q336 490 336.0 456.0Q336 422 336.0 394.5Q336 367 336 353Q336 334 337.0 309.0Q338 284 339 266H194Q195 280 197.0 306.0Q199 332 199 354Q199 368 199.0 395.0Q199 422 199.0 456.5Q199 491 199.0 527.5Q199 564 199.0 597.0Q199 630 199.0 655.0Q199 680 199 691Q199 705 198.0 727.5Q197 750 195 768Z"/><path transform="translate(3120,0)" d="M92 463Q110 462 138.0 460.5Q166 459 196.5 458.0Q227 457 253 457Q278 457 315.0 457.0Q352 457 395.5 457.0Q439 457 485.5 457.0Q532 457 578.0 457.0Q624 457 665.0 457.0Q706 457 738.5 457.0Q771 457 790 457Q825 457 856.0 459.5Q887 462 907 463V306Q890 307 856.0 309.0Q822 311 790 311Q771 311 738.0 311.0Q705 311 664.0 311.0Q623 311 577.5 311.0Q532 311 485.0 311.0Q438 311 394.5 311.0Q351 311 314.5 311.0Q278 311 253 311Q210 311 165.0 309.5Q120 308 92 306Z"/></g></svg></span></span>
      </a>
      <nav class="pc-only" aria-label="グローバル" style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700">
        <a href="index.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>さがす</a>
        <a href="scouts.html" style="text-decoration: none; padding: 10px 14px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg>メッセージ<span style="background: #1D1D1F; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 12px; padding: 2px 8px; border-radius: 999px">3</span></a>
        <a href="profile.html" aria-label="マイプロフィール" style="margin-left: 8px; width: 40px; height: 40px; border-radius: 50%; background: #E8E8ED; color: #86868B; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></a>
      </nav>
    </div>
  </header>

  <!-- Cover -->
  <div class="wrap-top" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 24px 32px 0; box-sizing: border-box">
    <a href="index.html" style="font-size: 13px; font-weight: 700; color: #6E6E73; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 32px">← 募集一覧に戻る</a>
    <div class="hero" style="margin-top: 12px; display: flex; gap: 12px; height: 420px">
      <div style="flex: 2 1 0; min-width: 0; border-radius: 14px; overflow: hidden; background: #E8E8ED">
        <img src="images/station.jpg" alt="申し送り中のナースステーション。師長と若手看護師が談笑している" style="width: 100%; height: 100%; object-fit: cover; display: block">
      </div>
      <div class="subs pc-only" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div style="flex: 1 1 0; min-height: 0; border-radius: 14px; overflow: hidden; background: #E5E5EA">
          <img src="images/rehab.jpg" alt="病棟の廊下で患者さんの歩行に付き添う看護師" style="width: 100%; height: 100%; object-fit: cover; display: block">
        </div>
        <div style="flex: 1 1 0; min-height: 0; border-radius: 14px; overflow: hidden; background: #E5E5EA">
          <img src="images/mentor.jpg" alt="教育担当と中途入職者の1on1" style="width: 100%; height: 100%; object-fit: cover; display: block">
        </div>
      </div>
    </div>
  </div>

  <div class="wrap" style="max-width: 1360px; width: 100%; margin: 0 auto; padding: 28px 32px 80px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

    <!-- Main column -->
    <main style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <span style="background: #1D1D1F; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px">正社員</span>
          <span style="background: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #D2D2D7">病院・急性期</span>
          <span style="background: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1.5px solid #D2D2D7">看護師</span>
        </div>
        <h1 class="pagetitle" style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.5; color: #1D1D1F">「聞きやすさ」で選ばれる内科病棟で、<br class="pc-only">一緒に働く看護師を募集</h1>
        <a href="#" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 15px; font-weight: 700">
          <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 6px; background: #E8E8ED; border: 1px solid #D2D2D7"></span>
          みなと中央病院<span style="color: #6E6E73">·</span><span style="color: #6E6E73">東京都港区</span>
        </a>
        <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; background: #FFFFFF; border-radius: 14px; padding: 14px 20px">
          <span style="font-size: 13px; font-weight: 700; color: #6E6E73">月収</span>
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.4px">276,500円〜</span>
          <span style="font-size: 13px; font-weight: 700; color: #6E6E73">夜勤4回・各種手当を含む｜年収目安 [金額]〜</span>
        </div>
      </div>

      <!-- Tabs -->
      <nav aria-label="ページ内" role="tablist" style="display: flex; gap: 4px; border-bottom: 2px solid #E5E5EA; font-size: 14px; font-weight: 700; overflow-x: auto">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 700; padding: 12px 8px; border-bottom: 3px solid {{t.line}}; margin-bottom: -2px; min-height: 44px; color: {{t.fg}}; cursor: pointer; white-space: nowrap; flex: 1 1 0; text-align: center">{{t.label}}</button></sc-for>
      </nav>

      <sc-if value="{{isAbout}}">
      <!-- About -->
      <section id="about" style="background: #FFFFFF; border-radius: 14px; padding: 36px; display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #1D1D1F">ABOUT</span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 700">施設概要</h2>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 2; color: #424245">港区にある[病床数]床の急性期病院。内科病棟では、高齢の患者さんの急性期治療から退院支援までを担当します。看護師は[人数]名、中途入職が半数以上で、ブランクから復帰したメンバーもいます。</p>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 14px; font-weight: 700">ひと目でわかる数字 <span style="font-size: 12px; font-weight: 700; color: #6E6E73">病院の申告値｜2026年10月更新</span></span>
        <div style="display: flex; flex-direction: column; gap: 14px; background: #F5F5F7; border-radius: 14px; padding: 20px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700">
                <span>{{b.label}}</span>
                <span style="display: flex; gap: 10px; align-items: baseline"><span style="font-size: 11px; color: #6E6E73">エリア平均 {{b.avg}}</span><span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-size: 20px">{{b.value}}</span></span>
              </div>
              <div style="height: 12px; background: #E5E5EA; border-radius: 999px; position: relative; overflow: hidden">
                <div style="position: absolute; left: 0; top: 0; height: 12px; border-radius: 999px; background: {{b.color}}; width: {{b.w}}"></div>
                <div style="position: absolute; top: 0; height: 12px; width: 3px; background: #1D1D1F; left: {{b.avgPos}}"></div>
              </div>
              <span style="font-size: 11px; color: #6E6E73">{{b.note}}</span>
            </div>
          </sc-for>
        </div>
        </div>
        <sc-for list="{{aboutGroups}}" as="g" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; padding-bottom: 10px; border-bottom: 2px solid #1D1D1F">{{g.title}}</h3>
            <dl style="margin: 0; display: flex; flex-direction: column">
              <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
                <div style="display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid #E5E5EA">
                  <dt style="flex: 0 0 150px; font-size: 13px; font-weight: 700; color: #6E6E73; padding-top: 2px">{{r.k}}</dt>
                  <dd style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.7; white-space: pre-line">{{r.v}}</dd>
                </div>
              </sc-for>
            </dl>
          </div>
        </sc-for>
      </section>
      </sc-if>

      <!-- Pay -->
      <sc-if value="{{isPay}}">
      <section style="background: #FFFFFF; border-radius: 14px; padding: 36px; display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #1D1D1F">SALARY</span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 700">給与・手当</h2>
        </div>
        <sc-for list="{{payGroups}}" as="g" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h3 style="margin: 0 0 8px; font-size: 16px; font-weight: 700; padding-bottom: 10px; border-bottom: 2px solid #1D1D1F">{{g.title}}</h3>
            <dl style="margin: 0; display: flex; flex-direction: column">
              <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
                <div style="display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid #E5E5EA">
                  <dt style="flex: 0 0 150px; font-size: 13px; font-weight: 700; color: #6E6E73; padding-top: 2px">{{r.k}}</dt>
                  <dd style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.7; white-space: pre-line">{{r.v}}</dd>
                </div>
              </sc-for>
            </dl>
          </div>
        </sc-for>
      </section>
      </sc-if>

      <!-- Work -->
      <sc-if value="{{isWork}}">
      <!-- Work -->
      <section id="work" style="background: #FFFFFF; border-radius: 14px; padding: 36px; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', Meiryo, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; color: #1D1D1F">WORK</span>
          <h2 style="margin: 0; font-size: 22px; font-weight: 700">配属先と仕事の中身</h2>
          <span style="font-size: 13px; line-height: 1.7; color: #6E6E73">どんな患者さんを、どんな体制で看るのか。入ってからのギャップが出やすいところを、先に書いています。</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <h3 style="margin: 0; font-size: 16px; font-weight: 700; padding-bottom: 10px; border-bottom: 2px solid #1D1D1F">配属先と患者さん</h3>
          <dl style="margin: 0; display: flex; flex-direction: column">
            <sc-for list="{{ward}}" as="r" hint-placeholder-count="3">
              <div style="display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid #E5E5EA">
                <dt style="flex: 0 0 150px; font-size: 13px; font-weight: 700; color: #6E6E73; padding-top: 2px">{{r.k}}</dt>
                <dd style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.7">{{r.v}}</dd>
              </div>
            </sc-for>
          </dl>
          <div style="display: flex; flex-direction: column; gap: 8px; background: #F5F5F7; border-radius: 14px; padding: 16px 20px">
            <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 700"><span>患者さんの重症度</span><span style="font-size: 16px">{{acuityLabel}}</span></div>
            <div style="display: flex; gap: 4px">
              <sc-for list="{{acuity}}" as="a" hint-placeholder-count="3"><span style="flex: 1 1 0; display: flex; flex-direction: column; gap: 4px"><span style="height: 10px; border-radius: 999px; background: {{a.bg}}"></span><span style="font-size: 11px; color: {{a.fg}}; text-align: center">{{a.label}}</span></span></sc-for>
            </div>
            <span style="font-size: 11px; color: #6E6E73">{{acuityNote}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 13px; font-weight: 700; color: #6E6E73">よくある処置・業務</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{tasks}}" as="t" hint-placeholder-count="5"><span style="font-size: 13px; color: #1D1D1F; background: #F5F5F7; padding: 6px 12px; border-radius: 999px">{{t}}</span></sc-for></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <h3 style="margin: 0; font-size: 16px; font-weight: 700; padding-bottom: 10px; border-bottom: 2px solid #1D1D1F">看護体制</h3>
          <div style="display: flex; flex-wrap: wrap; gap: 12px">
            <sc-for list="{{system}}" as="s" hint-placeholder-count="4">
              <div style="flex: 1 1 180px; min-width: 0; background: #F5F5F7; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 12px; font-weight: 700; color: #6E6E73">{{s.label}}</span>
                <span style="font-size: 17px; font-weight: 700">{{s.value}}</span>
                <span style="font-size: 12px; line-height: 1.6; color: #6E6E73">{{s.note}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 10px; border-bottom: 2px solid #1D1D1F; flex-wrap: wrap">
            <h3 style="margin: 0; font-size: 16px; font-weight: 700">1日の流れ</h3>
            <div role="tablist" aria-label="勤務" style="display: flex; gap: 4px; background: #F5F5F7; border-radius: 999px; padding: 3px">
